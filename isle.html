<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐱🏞️ 猫岛胜景 · Nikki 游戏合集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%F0%9F%8F%9D%3C/text%3E%3C/svg%3E">
<!-- ═════════════════════════════════════════════════════════════
     猫岛胜景 · 大场景 3D 化(9 张 AI 参考图对齐工作流)
     · 弱核显可跑:像素比封顶 + 画质自动阶梯 + 默认烘焙阴影(实时阴影为高配开关)
     · 质量:构图/比例/材质/颜色对齐 refs/ref1..9.png
     · 模块化:js/modules/* 由并行专员分模块对照参考图打磨(见 CONTRACT.md)
     ═════════════════════════════════════════════════════════════ -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #17112a; }
  body { font-family: "Nunito", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud {
    position: fixed; top: 10px; left: 12px; right: 12px; z-index: 5;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    color: #fff; font-size: 13px; font-weight: 800; text-shadow: 0 1px 4px rgba(0,0,0,.5);
    pointer-events: none;
  }
  #hud a { color: #ffd76e; text-decoration: none; pointer-events: auto; }
  #quality { font-size: 11px; opacity: .85; }
  #tip {
    position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; z-index: 5;
    color: rgba(255,255,255,.75); font-size: 11px; font-weight: 700; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  #shot {
    position: fixed; right: 12px; bottom: 12px; z-index: 6;
    border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.35); color: #fff;
    border-radius: 999px; padding: 6px 14px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <a href="index.html">🏠 回游戏合集</a>
  <span>🐱🏞️ 猫岛胜景</span>
  <span id="quality">画质:…</span>
</div>
<div id="tip">拖动旋转 · 滚轮/双指缩放 · S 键拍照(对照参考图用)</div>
<button id="shot">📷 拍照</button>

<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
<script type="module">
  import "./isle3d/js/main.js";
</script>
</body>
</html>
