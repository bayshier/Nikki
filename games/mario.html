<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐱🍄 猫猫马里奥 · Nikki 游戏合集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E🐱%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --hk-deep: #ff6b9d; --hk-muted: #c98ba0; --hk-red: #e94560; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    font-family: "Nunito", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #8b4a5e;
    background: linear-gradient(135deg, #ffd6e8 0%, #ffeef4 40%, #fff9fb 100%) fixed;
    min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px;
  }
  .top { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; justify-content: center; }
  .hud {
    background: rgba(255,255,255,0.92); border: 2px solid rgba(255,158,196,0.5);
    border-radius: 12px; padding: 4px 14px; text-align: center;
    box-shadow: 0 3px 0 -1px #f3b7cc;
  }
  .hud .l { font-size: 10px; color: var(--hk-muted); font-weight: 800; }
  .hud .v { font-size: 17px; font-weight: 800; color: var(--hk-deep); }
  .hud .v.warn { color: var(--hk-red); }
  .home {
    text-decoration: none; font-size: 13px; font-weight: 800; color: var(--hk-deep);
    background: #fff; border: 2px solid rgba(255,158,196,0.5); border-radius: 12px; padding: 8px 14px;
    box-shadow: 0 3px 0 -1px #f3b7cc;
  }
  canvas {
    border-radius: 18px;
    border: 4px solid rgba(255,158,196,0.6);
    box-shadow: 0 8px 0 -2px #f3b7cc, 0 18px 30px rgba(255,158,196,0.35);
    max-width: 100%;
  }
  /* 移动端/鼠标控制按钮 */
  .pad { margin-top: 12px; display: flex; gap: 14px; align-items: center; }
  .pad button {
    border: none; cursor: pointer; user-select: none;
    width: 76px; height: 60px; font-size: 26px;
    border-radius: 18px; color: #fff;
    background: linear-gradient(135deg, #ff6b9d, #ff9ec4);
    box-shadow: 0 5px 0 -1px #d15683;
  }
  .pad button:active { transform: translateY(4px); box-shadow: none; }
  .pad .jump { width: 96px; background: linear-gradient(135deg, #ffd56b, #ffb937); box-shadow: 0 5px 0 -1px #d99a1f; }
  .pad .run { width: 64px; font-size: 22px; background: linear-gradient(135deg, #9b6bd6, #c9a6f2); box-shadow: 0 5px 0 -1px #6a3fa0; }
  .tip { margin-top: 10px; font-size: 12px; font-weight: 800; color: var(--hk-muted); text-align: center; }
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(255,158,196,0.45); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
  }
  .overlay.show { display: flex; }
  .modal {
    background: linear-gradient(160deg, #fff5f8, #fff);
    border: 3px solid rgba(255,158,196,0.6);
    border-radius: 24px; padding: 30px 38px; text-align: center;
    box-shadow: 0 16px 40px rgba(255,107,157,0.35);
    animation: pop 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop { from { transform: scale(0.7); } }
  .modal .e { font-size: 54px; }
  .modal h2 { color: var(--hk-deep); margin: 6px 0; }
  .modal p { color: #c98ba0; font-size: 14px; margin-bottom: 16px; line-height: 1.7; }
  .btn {
    border: none; cursor: pointer; font-family: inherit;
    font-size: 14px; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, var(--hk-deep), #ff9ec4);
    padding: 10px 26px; border-radius: 99px; margin: 0 5px;
    box-shadow: 0 4px 0 -1px #d15683;
  }
  .btn.sec { background: #fff; color: var(--hk-deep); border: 2px solid #ff9ec4; box-shadow: 0 3px 0 -1px #f3b7cc; text-decoration: none; display: inline-block; }
</style>
</head>
<body>
  <div class="top">
    <a class="home" href="../index.html">🏠 大厅</a>
    <div class="hud"><div class="l">分数</div><div class="v" id="hud-score">0</div></div>
    <div class="hud"><div class="l">💰 金币</div><div class="v" id="hud-coin">0</div></div>
    <div class="hud"><div class="l">生命</div><div class="v" id="hud-life">❤❤❤</div></div>
    <div class="hud"><div class="l">⏰ 时间</div><div class="v" id="hud-time">300</div></div>
    <div class="hud"><div class="l">最高</div><div class="v" id="hud-best">0</div></div>
  </div>

  <canvas id="cv" width="960" height="540"></canvas>

  <div class="pad">
    <button id="btn-left">⬅</button>
    <button id="btn-right">➡</button>
    <button id="btn-run" class="run">🏃</button>
    <button id="btn-jump" class="jump">🐱⬆</button>
  </div>
  <div class="tip">⬅➡ 走动 · 长按跳跃键跳得更高 · Shift/🏃 加速跑(跑越快跳越高) · 顶❓砖有惊喜 · 食人花碰不得 · 300 秒内抵达🚩!</div>

  <div class="overlay" id="over">
    <div class="modal">
      <div class="e" id="over-e">😿</div>
      <h2 id="over-title">游戏结束</h2>
      <p id="over-detail"></p>
      <button class="btn" onclick="location.reload()">🔄 再来一局</button>
      <a class="btn sec" href="../index.html">🏠 回大厅</a>
    </div>
  </div>

<script src="../../shared/common.js"></script>
<script>
// ============================================================
// 🐱🍄 猫猫马里奥:横版平台跳跃
// ============================================================
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const W = 960, H = 540, TILE = 36, ROWS = 14;
// ===== 经典马里奥 1:1 物理(SMB1 原版常数,按 36px 砖块从 16px 标准等比 ×2.25) =====
const WALK_MAX = 3.52;                        // 走路极速(原版 1.56 px/帧)
const RUN_MAX = 5.77;                         // 按住 Shift/🏃 的跑步极速(原版 2.56)
const ACCEL = 0.083, RUN_ACCEL = 0.125;       // 地面起步加速度(动量:从 0 慢慢加到极速)
const FRICTION = 0.11;                        // 松开方向键后的滑行减速
const SKID = 0.23;                            // 反向按键急刹(比摩擦猛,经典"漂移刹车"感)
const G_RISE = 0.28125;                       // 上升中且按住跳跃键:低重力(滞空悬浮感,原版 0.125)
const G_FALL = 0.984375;                      // 下落中 / 中途松开跳跃键:高重力(干脆收跳、落地,原版 0.4375)
const MAX_FALL = 10.125;                      // 终端下落速度封顶(原版 4.5)
const JUMP_V = 9.0, JUMP_V_FAST = 10.5;       // 起跳初速:走路 4 格高 / 跑步 5 格高(原版 -4.0 / -5.0)
const STOMP_V = 6.0;                          // 踩扁敌人后的反弹力度(按住跳跃反弹更高,经典设定)

// ---------- 关卡(程序化生成) ----------
const COLS = 150;
const T_EMPTY = 0, T_SOLID = 1, T_BRICK = 2, T_COIN = 3, T_FISH = 4, T_SPIKE = 5, T_FLAG = 6, T_Q = 7;
let world = [], qContents = {}, bumps = {};   // qContents:问号砖奖励表("r,c"→coin/life);bumps:砖块被顶弹跳的动画时间戳
let flagX = 0;

function buildLevel() {
  world = Array.from({ length: ROWS }, () => new Array(COLS).fill(T_EMPTY));
  qContents = {}; bumps = {};               // 每次重建关卡,问号砖奖励与顶砖动画全部重置
  const G = ROWS - 2;                       // 地面行(12、13 两层)
  const ground = (x1, x2) => { for (let x = x1; x <= x2; x++) { world[G][x] = T_SOLID; world[G + 1][x] = T_SOLID; } };
  const pit = (x1, x2) => { for (let x = x1; x <= x2; x++) { world[G][x] = T_EMPTY; world[G + 1][x] = T_EMPTY; } };
  const brickRow = (x1, x2, y) => { for (let x = x1; x <= x2; x++) world[y][x] = T_BRICK; };
  const coinRow = (x1, x2, y) => { for (let x = x1; x <= x2; x++) world[y][x] = T_COIN; };
  const spikes = (x1, x2) => { for (let x = x1; x <= x2; x++) world[G][x] = T_SPIKE; };
  const coinAt = (x, y) => world[y][x] = T_COIN;
  const fishAt = (x, y) => world[y][x] = T_FISH;
  // ❓问号砖(qRow 整排,默认藏金币;qLife 指定某块藏蘑菇 = 生命+1;pipe 两行高的管道,给食人花住)
  const qRow = (x1, x2, y) => { for (let x = x1; x <= x2; x++) { world[y][x] = T_Q; qContents[y + "," + x] = "coin"; } };
  const qLife = (x, y) => { qContents[y + "," + x] = "life"; };
  const pipe = (x) => { for (let y = ROWS - 4; y <= ROWS - 3; y++) { world[y][x] = T_BRICK; world[y][x + 1] = T_BRICK; } };

  ground(0, COLS - 1);
  // —— 教学区:金币引导 + 第一排问号砖 ——
  coinRow(8, 12, G - 3);
  qRow(14, 17, G - 4); qLife(16, G - 4); coinRow(14, 17, G - 5);   // 顶❓出金币,16 号砖藏🍄蘑菇(生命+1)
  pipe(20);                                 // 🌺 第一根管道:食人花的家,靠近时它会害羞缩回
  // —— 第一个坑 ——
  pit(24, 26);
  coinRow(24, 26, G - 4);
  // —— 阶梯砖 ——
  world[G - 4][32] = T_BRICK; world[G - 4][33] = T_BRICK;
  world[G - 6][34] = T_BRICK; world[G - 6][35] = T_BRICK;
  coinAt(34, G - 7); coinAt(35, G - 7); fishAt(35, G - 3);
  // —— 宽坑:全速长跳(四格,金币挂在跳跃弧线上当引导) ——
  coinRow(40, 43, G - 6);
  pit(40, 43);
  qRow(46, 48, G - 4); qLife(47, G - 4); coinRow(46, 48, G - 5);   // 问号砖放低成"边跑边顶"奖励排(下方是实地,顶砖无风险)
  // —— 尖刺走廊(上方有砖桥) ——
  spikes(54, 57);
  brickRow(54, 57, G - 4); coinRow(54, 57, G - 5);
  // —— 敌人平原(65 号是问号砖,下方常有捣蛋猫巡逻,顶砖要冒风险) ——
  brickRow(64, 66, G - 4); world[G - 4][65] = T_Q; coinRow(64, 66, G - 5);
  world[G - 4][66] = T_Q; world[G - 4][67] = T_Q;                  // 平地上的双问号砖,大胆顶!
  // ⚠️ 注意:70-71 上空必须保持净空,那是宽坑(72-76)浮砖路线的起跳走廊,顶头砖会把跳跃撞死
  // —— 宽坑:全速长跳一次过(五格宽,与 100-104 坑同款成熟设计;金币鱼干在跳跃弧线上当引导) ——
  pit(72, 76);
  coinAt(72, G - 5); coinAt(73, G - 5);
  coinAt(75, G - 7); coinAt(76, G - 7);
  fishAt(74, G - 5);
  // —— 尖刺 + 砖桥 ——
  spikes(82, 85);
  brickRow(82, 85, G - 4); coinRow(82, 85, G - 5);
  // —— 金币雨 ——
  coinRow(90, 96, G - 3);
  brickRow(92, 94, G - 6); coinRow(92, 94, G - 7);
  pipe(88);                                 // 🌺 第二根管道:金币雨前最后一道关卡
  // —— 最后冲刺:五格宽坑,全速长跳一次过(金币挂弧线) ——
  pit(100, 104);
  coinAt(100, G - 5); coinAt(101, G - 5); coinAt(103, G - 7); coinAt(104, G - 7);
  // —— 终点阶梯 + 旗 ——
  for (let i = 0; i < 4; i++) for (let x = 110; x <= 110 + i; x++) world[G - 1 - i][x] = T_SOLID;
  flagX = 118;
  world[G - 1][flagX] = T_FLAG;
  world[G - 2][flagX] = T_FLAG;             // 旗杆两格
}

// ---------- 敌人 ----------
let enemies = [];
function buildEnemies() {
  enemies = [
    { x: 29 * TILE, y: 0, min: 27 * TILE, max: 33 * TILE, alive: true },
    { x: 60 * TILE, y: 0, min: 58 * TILE, max: 64 * TILE, alive: true },
    { x: 68 * TILE, y: 0, min: 66 * TILE, max: 71 * TILE, alive: true },
    { x: 94 * TILE, y: 0, min: 91 * TILE, max: 98 * TILE, alive: true },   // 巡逻范围避开 88 号管道
  ].map(e => ({ ...e, y: findFloor(e.x) - 34, w: 30, h: 34, dir: 1, spd: 1.1 }));
}
function findFloor(px) {
  const col = Math.floor(px / TILE);
  for (let r = 0; r < ROWS; r++) if (world[r] && world[r][col] === T_SOLID) return r * TILE;
  return (ROWS - 2) * TILE;
}

// ---------- 食人花(住在管道里;经典设定:不能踩,只能躲) ----------
const PIPE_TOP = (ROWS - 4) * TILE;        // 管道口高度(管道占 ROWS-4、ROWS-3 两行)
let plants = [];
function buildPlants() {
  plants = [makePlant(20), makePlant(88)];  // 两根管道各住一朵,相位随机错开
}
function makePlant(pipeCol) {
  return { x: pipeCol * TILE + 6, w: TILE - 12, h: 28, topY: PIPE_TOP, out: 0, phase: Math.random() * 5, y: PIPE_TOP };
}
function updatePlants() {
  const p = player;
  plants.forEach(pl => {
    // 伸缩节奏:5 秒一个循环(升 0.8s → 探出 2s → 缩回 0.8s → 躲藏 1.4s)
    const t = (Date.now() / 1000 + pl.phase) % 5;
    let target;
    if (t < 0.8) target = t / 0.8;
    else if (t < 2.8) target = 1;
    else if (t < 3.6) target = (3.6 - t) / 0.8;
    else target = 0;
    // 经典设定:玩家靠得太近时食人花害羞缩回,不出门(站在管道上很安全)
    if (Math.abs(p.x + p.w / 2 - (pl.x + pl.w / 2)) < 52) target = 0;
    pl.out += (target - pl.out) * 0.12;      // 平滑伸缩,避免生硬跳变
    pl.y = pl.topY - pl.out * (pl.h + 4);    // 伸出时花头升到管道口上方
    // 碰撞判定:食人花踩不得,任何接触都受伤(无敌期除外)
    if (pl.out > 0.2 && p.inv <= 0 &&
        p.x < pl.x + pl.w && p.x + p.w > pl.x && p.y < pl.y + pl.h && p.y + p.h > pl.y) hurt();
  });
}

// ---------- 玩家 ----------
let player, cam = { x: 0 }, coinsGot, score, lives, state, flagDone, timeLeft, jumpLock = 0, timeoutDeath = false;
let best = (() => { try { const v = localStorage.getItem("nikki_mario_best"); return v === null ? 0 : JSON.parse(v); } catch (e) { return 0; } })();

function resetPlayer() {
  player = { x: 2 * TILE, y: 0, w: 26, h: 34, vx: 0, vy: 0, onGround: false, dir: 1, inv: 0 };
  player.y = findFloor(player.x) - player.h;
}

function startLevel() {
  buildLevel();
  buildEnemies();
  buildPlants();
  resetPlayer();
  coinsGot = 0; score = 0; lives = 3; timeLeft = 300; flagDone = false;
  timeoutDeath = false;
  state = "menu";                           // 先进标题菜单,按任意键再开跑(jyMario 式完整流程)
  cam.x = 0;
  updateHUD();
}

// ---------- 输入 ----------
const keys = { left: false, right: false, run: false };
let jumpPressed = false, jumpHeld = false;   // 跳跃键:本帧刚按下(边缘触发起跳)/ 按住中(变高跳跃)
window.addEventListener("keydown", e => {
  ensureAudio();
  tryStart();                                // 菜单状态下按任意键开始游戏
  const k = e.key.toLowerCase();
  if (k === "arrowleft" || k === "a") keys.left = true;
  if (k === "arrowright" || k === "d") keys.right = true;
  if (k === "shift" || k === "x") keys.run = true;         // 加速跑(经典 B 键)
  if (k === " " || k === "arrowup" || k === "w") {
    e.preventDefault();
    if (Date.now() < jumpLock) return;       // 刚从菜单开始的第一下按键不立即跳
    if (!e.repeat && !jumpHeld) jumpPressed = true;   // 边缘触发:只在按下那一帧起跳,长按不连跳
    jumpHeld = true;                         // 按住状态:上升期保持低重力 = 跳更高
  }
});
window.addEventListener("keyup", e => {
  const k = e.key.toLowerCase();
  if (k === "arrowleft" || k === "a") keys.left = false;
  if (k === "arrowright" || k === "d") keys.right = false;
  if (k === "shift" || k === "x") keys.run = false;
  if (k === " " || k === "arrowup" || k === "w") jumpHeld = false;   // 松手 → 高重力收跳(短跳)
});
// 按钮(按住持续移动)
function bindHold(id, key) {
  const b = document.getElementById(id);
  b.addEventListener("pointerdown", e => { e.preventDefault(); ensureAudio(); keys[key] = true; });
  b.addEventListener("pointerup", () => keys[key] = false);
  b.addEventListener("pointerleave", () => keys[key] = false);
}
bindHold("btn-left", "left");
bindHold("btn-right", "right");
bindHold("btn-run", "run");
// 跳跃按钮:pointerdown 边缘触发起跳,按住期间 jumpHeld 保持变高跳跃
const btnJump = document.getElementById("btn-jump");
btnJump.addEventListener("pointerdown", e => {
  e.preventDefault(); ensureAudio(); tryStart();
  if (Date.now() < jumpLock) return;
  jumpPressed = true; jumpHeld = true;
});
btnJump.addEventListener("pointerup", () => jumpHeld = false);
btnJump.addEventListener("pointerleave", () => jumpHeld = false);
// 点击画面任意处也能从菜单开始
cv.addEventListener("pointerdown", () => { ensureAudio(); tryStart(); });

// ---------- 菜单 → 游戏 ----------
function tryStart() {
  if (state !== "menu") return;
  state = "play";
  jumpLock = Date.now() + 300;               // 开局的这次按键不立即触发跳跃
  jumpPressed = false; jumpHeld = false;     // 清掉按键残留
  startBGM();                                // 音乐随游戏开始
}

// ---------- 物理 ----------
function solidAt(px, py) {
  const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
  if (c < 0 || c >= COLS) return true;                 // 关卡左右边界视为墙
  if (r < 0 || r >= ROWS) return false;
  const t = world[r][c];
  // 尖刺也是实心地面(踩上去会受伤,但不会像坑一样掉下去;Q/砖/地同理可站可撞)
  return t === T_SOLID || t === T_BRICK || t === T_Q || t === T_SPIKE;
}

function updatePlayer() {
  const p = player;
  // ===== 水平:经典动量系统(起步加速 / 松手滑行 / 反向急刹) =====
  const accel = keys.run ? RUN_ACCEL : ACCEL;         // 跑步加速更快
  const maxSpd = keys.run ? RUN_MAX : WALK_MAX;       // 跑步极速更高
  if (keys.left && !keys.right) {
    if (p.vx > 0) p.vx = Math.min(0, p.vx - SKID);    // 正向移动时按反向 = 刹车,减得比摩擦猛
    else p.vx = Math.max(-maxSpd, p.vx - accel);
    p.dir = -1;
  } else if (keys.right && !keys.left) {
    if (p.vx < 0) p.vx = Math.max(0, p.vx + SKID);
    else p.vx = Math.min(maxSpd, p.vx + accel);
    p.dir = 1;
  } else if (p.vx > 0) {
    p.vx = Math.max(0, p.vx - FRICTION);              // 松开方向键:滑行一段距离自然停下
  } else {
    p.vx = Math.min(0, p.vx + FRICTION);
  }
  p.x += p.vx;
  // 水平碰撞(撞墙归位并清速度)
  if (p.vx > 0) {
    if (solidAt(p.x + p.w, p.y + 4) || solidAt(p.x + p.w, p.y + p.h - 4) || solidAt(p.x + p.w, p.y + p.h / 2)) {
      p.x = Math.floor((p.x + p.w) / TILE) * TILE - p.w - 0.01;
      p.vx = 0;
    }
  } else if (p.vx < 0) {
    if (solidAt(p.x, p.y + 4) || solidAt(p.x, p.y + p.h - 4) || solidAt(p.x, p.y + p.h / 2)) {
      p.x = Math.floor(p.x / TILE) * TILE + TILE + 0.01;
      p.vx = 0;
    }
  }
  // 镜头不回卷:不能向左走出屏幕左缘(经典规则)
  if (p.x < cam.x + 2) { p.x = cam.x + 2; if (p.vx < 0) p.vx = 0; }

  // ===== 跳跃:只在地面起跳(边缘触发),跑得快跳得高,按住跳得高 =====
  if (jumpPressed && p.onGround) {
    // 双档跳跃(经典):走路跳 4 格高,近极速跑跳 5 格高;阈值取走/跑极速的中点
    p.vy = Math.abs(p.vx) > (WALK_MAX + RUN_MAX) / 2 ? -JUMP_V_FAST : -JUMP_V;
    p.onGround = false;
    beep(720, 0.12, "square", 0.08);
  }
  jumpPressed = false;                                 // 边缘信号只生效一帧
  // 变重力:上升且按住跳跃 → 低重力滞空;松手或已下落 → 高重力干脆落地(短跳/长跳)
  const g = (p.vy < 0 && jumpHeld) ? G_RISE : G_FALL;
  p.vy = Math.min(p.vy + g, MAX_FALL);                 // 终端速度封顶
  p.y += p.vy;
  p.onGround = false;
  if (p.vy > 0) {
    if (solidAt(p.x + 4, p.y + p.h) || solidAt(p.x + p.w - 4, p.y + p.h)) {
      p.y = Math.floor((p.y + p.h) / TILE) * TILE - p.h - 0.01;
      p.vy = 0; p.onGround = true;
    }
  } else if (p.vy < 0) {
    if (solidAt(p.x + 4, p.y) || solidAt(p.x + p.w - 4, p.y)) {
      p.y = Math.floor(p.y / TILE) * TILE + TILE + 0.01;
      p.vy = 0;
      // 🎯 顶砖!优先判定左上角那块,不是可撞砖再试右上角
      if (!bumpHead(p.x + 4, p.y - 2)) bumpHead(p.x + p.w - 4, p.y - 2);
    }
  }
  // 掉出世界 → 死亡
  if (p.y > H + 80) hurt(true);
  // 尖刺
  const fx = p.x + p.w / 2, fy = p.y + p.h - 2;
  const c = Math.floor(fx / TILE), r = Math.floor(fy / TILE);
  if (world[r] && world[r][c] === T_SPIKE) hurt();
  // 收集物
  collectAt(p.x + p.w / 2, p.y + p.h / 2);
  collectAt(p.x + p.w / 2, p.y + 6);
  // 终点旗
  if (!flagDone && p.x + p.w / 2 > flagX * TILE) {
    flagDone = true;
    score += 500 + lives * 200;
    updateHUD();
    win();
  }
  // 摄像机:只向前推进、永不回卷,马里奥保持在屏幕约 42% 处(经典规则)
  cam.x = Math.max(cam.x, Math.min(p.x - W * 0.42, COLS * TILE - W));
  cam.x = Math.max(0, cam.x);
  if (p.inv > 0) p.inv--;
}

function collectAt(px, py) {
  const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
  const cell = world[r] && world[r][c];
  if (cell === T_COIN) {
    world[r][c] = T_EMPTY; coinsGot++; score += 10;
    beep(1050, 0.08, "square", 0.1);
    updateHUD();
  } else if (cell === T_FISH) {
    world[r][c] = T_EMPTY; score += 50;
    beep(1300, 0.1, "triangle", 0.11);
    updateHUD();
  }
}

// ---------- 顶问号砖(经典马里奥的灵魂机制) ----------
function bumpHead(px, py) {
  const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
  const cell = world[r] && world[r][c];
  if (cell !== T_Q && cell !== T_BRICK) return false;
  const key = r + "," + c;
  bumps[key] = Date.now();                   // 记录时间戳,绘制时这块砖会向上弹一下
  if (cell === T_Q) {
    world[r][c] = T_BRICK;                   // 敲过的问号砖变成普通砖,不能再出奖励
    const content = qContents[key] || "coin";
    delete qContents[key];
    if (content === "life") {
      lives = Math.min(3, lives + 1);        // 🍄 蘑菇:生命 +1(上限 3)
      floatText("🍄 生命+1", c * TILE, r * TILE);
      beep(880, 0.15, "triangle", 0.12);
    } else {
      coinsGot++; score += 10;               // 金币与场上金币同规则:结算时统一入钱包 💰
      floatText("💰+10", c * TILE, r * TILE);
      beep(1050, 0.1, "square", 0.11);
    }
    updateHUD();
  } else {
    beep(240, 0.06, "square", 0.07);         // 普通砖只有"咚"的一声
  }
  return true;
}

// ---------- 飘字提示(顶砖奖励等) ----------
let floats = [];
function floatText(txt, wx, wy) { floats.push({ x: wx + TILE / 2, y: wy, txt, t0: Date.now() }); }

function updateEnemies() {
  enemies.forEach(e => {
    if (!e.alive) return;
    e.x += e.dir * e.spd;
    if (e.x < e.min || e.x + e.w > e.max) { e.dir *= -1; e.x = Math.max(e.min, Math.min(e.max - e.w, e.x)); }
    // 与玩家碰撞
    const p = player;
    if (p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
      // 从上方踩踏?
      if (p.vy > 1.5 && p.y + p.h - p.vy <= e.y + 8) {
        e.alive = false;
        p.vy = jumpHeld ? -STOMP_V * 1.35 : -STOMP_V;   // 踩踏反弹:按住跳跃弹更高(经典设定)
        score += 100;
        beep(300, 0.12, "square", 0.12);
        updateHUD();
      } else if (p.inv <= 0) {
        hurt();
      }
    }
  });
}

function hurt(fall) {
  const p = player;
  if (p.inv > 0 && !fall) return;
  lives--;
  updateHUD();
  beep(220, 0.28, "sawtooth", 0.13);
  if (lives <= 0) return endGame(false);
  // 重生
  resetPlayer();
  p.inv = 90;
  if (fall) { resetPlayer(); }
}

// ---------- 绘制 ----------
function drawTile(t, x, y) {
  const px = x * TILE - cam.x;
  // 被顶的砖块向上弹一下的小动画(正弦曲线,280ms 回落)
  let py = y * TILE;
  const bk = y + "," + x;
  if (bumps[bk] !== undefined) {
    const age = (Date.now() - bumps[bk]) / 280;
    if (age >= 1) delete bumps[bk];
    else py -= 14 * Math.sin(age * Math.PI);
  }
  if (px < -TILE || px > W) return;
  if (t === T_SOLID) {
    ctx.fillStyle = "#c98d4e";
    ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = "#8fd96a";                       // 草皮
    ctx.fillRect(px, py, TILE, 10);
    ctx.fillStyle = "rgba(120,70,20,0.35)";
    ctx.fillRect(px, py + TILE - 4, TILE, 4);
  } else if (t === T_BRICK) {
    ctx.fillStyle = "#f4a460";
    ctx.fillRect(px, py, TILE, TILE);
    ctx.strokeStyle = "rgba(150,80,30,0.6)"; ctx.lineWidth = 2;
    ctx.strokeRect(px + 1, py + 1, TILE - 2, TILE - 2);
    ctx.beginPath(); ctx.moveTo(px, py + TILE / 2); ctx.lineTo(px + TILE, py + TILE / 2); ctx.stroke();
  } else if (t === T_COIN) {
    const bob = Math.sin(Date.now() / 200 + x) * 3;
    ctx.fillStyle = "#ffd23b";
    ctx.beginPath(); ctx.arc(px + TILE / 2, py + TILE / 2 + bob, 9, 0, 7); ctx.fill();
    ctx.strokeStyle = "#e8a000"; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = "#ff8fb8";
    ctx.beginPath(); ctx.ellipse(px + TILE / 2, py + TILE / 2 + bob, 4, 3.2, 0, 0, 7); ctx.fill();
  } else if (t === T_FISH) {
    ctx.font = "22px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🐟", px + TILE / 2, py + TILE / 2);
  } else if (t === T_SPIKE) {
    ctx.fillStyle = "#e94560";
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(px + i * 12, py + TILE);
      ctx.lineTo(px + i * 12 + 6, py + TILE - 16);
      ctx.lineTo(px + i * 12 + 12, py + TILE);
      ctx.fill();
    }
  } else if (t === T_Q) {
    // ❓问号砖:金灿灿圆角砖 + 呼吸发光描边,一眼就知道有货
    const glow = 0.5 + 0.5 * Math.sin(Date.now() / 250);
    ctx.fillStyle = "#ffb937";
    ctx.beginPath(); ctx.roundRect(px + 2, py + 2, TILE - 4, TILE - 4, 6); ctx.fill();
    ctx.strokeStyle = `rgba(255,255,255,${0.35 + glow * 0.4})`; ctx.lineWidth = 2;
    ctx.strokeRect(px + 4, py + 4, TILE - 8, TILE - 8);
    ctx.fillStyle = "#fff3d6";               // 四角小铆钉
    [[7, 7], [TILE - 11, 7], [7, TILE - 11], [TILE - 11, TILE - 11]].forEach(([ox, oy]) => ctx.fillRect(px + ox, py + oy, 4, 4));
    ctx.fillStyle = "#fff";
    ctx.font = "800 20px Nunito, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("?", px + TILE / 2, py + TILE / 2 + 1);
  } else if (t === T_FLAG) {
    ctx.fillStyle = "#c9a227";
    ctx.fillRect(px + TILE / 2 - 3, py - 40, 6, TILE + 40);
    ctx.fillStyle = "#ff6b9d";
    ctx.beginPath();
    ctx.moveTo(px + TILE / 2 + 3, py - 38);
    ctx.lineTo(px + TILE / 2 + 40, py - 26);
    ctx.lineTo(px + TILE / 2 + 3, py - 14);
    ctx.fill();
  }
}

function drawCatMario(px, py, dir, onGround) {
  ctx.save();
  ctx.translate(px + 13, py);
  ctx.scale(dir, 1);
  const run = Math.floor(Date.now() / 120) % 2;
  // 尾巴
  ctx.fillStyle = "#ff9ec4";
  ctx.beginPath(); ctx.ellipse(-14 + (run ? 2 : -2), 22, 9, 5, run ? -0.5 : 0.4, 0, 7); ctx.fill();
  // 腿
  ctx.fillStyle = "#2a56c6";
  if (onGround && run) {
    ctx.fillRect(-4, 26, 9, 9); ctx.fillRect(9, 26, 9, 9);
    ctx.fillStyle = "#7a3b12";
    ctx.fillRect(-6, 31, 12, 5); ctx.fillRect(8, 31, 12, 5);
  } else {
    ctx.fillRect(-2, 26, 8, 9); ctx.fillRect(8, 26, 8, 9);
    ctx.fillStyle = "#7a3b12";
    ctx.fillRect(-4, 31, 12, 5); ctx.fillRect(6, 31, 12, 5);
  }
  // 身体(蓝背带裤)
  ctx.fillStyle = "#2a56c6";
  ctx.beginPath(); ctx.roundRect(-8, 12, 22, 18, 5); ctx.fill();
  // 红衣
  ctx.fillStyle = "#e52521";
  ctx.fillRect(-8, 10, 22, 8);
  ctx.fillRect(-9, 8, 7, 12); ctx.fillRect(10, 8, 7, 12);
  // 脸
  ctx.fillStyle = "#ffc8a0";
  ctx.beginPath(); ctx.arc(3, 2, 11, 0, 7); ctx.fill();
  // 猫耳(帽子里探出的耳朵)
  ctx.fillStyle = "#ff9ec4";
  ctx.beginPath(); ctx.moveTo(-8, -8); ctx.lineTo(-11, -18); ctx.lineTo(-1, -11); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10, -8); ctx.lineTo(14, -17); ctx.lineTo(4, -11); ctx.fill();
  // 红帽
  ctx.fillStyle = "#e52521";
  ctx.beginPath(); ctx.arc(3, -8, 10, Math.PI, 0); ctx.fill();
  ctx.fillRect(-8, -10, 23, 4);
  // 白圈 M
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(3, -12, 5, 0, 7); ctx.fill();
  ctx.fillStyle = "#e52521";
  ctx.font = "bold 8px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("M", 3, -11.5);
  // 眼睛
  ctx.fillStyle = "#2a2a2a";
  ctx.beginPath(); ctx.ellipse(8, 1, 2, 3, 0, 0, 7); ctx.fill();
  // 胡须
  ctx.strokeStyle = "#8b5a3a"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(12, 2); ctx.lineTo(18, 1); ctx.moveTo(12, 5); ctx.lineTo(18, 6); ctx.stroke();
  ctx.restore();
}

function drawEnemy(e) {
  if (!e.alive) return;
  const px = e.x - cam.x;
  if (px < -40 || px > W) return;
  ctx.save();
  ctx.translate(px + e.w / 2, e.y + e.h / 2);
  ctx.scale(e.dir, 1);
  // 捣蛋猫:紫色圆 + 怒眉 + 耳
  ctx.fillStyle = "#9b6bd6";
  ctx.beginPath(); ctx.arc(0, 2, 15, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-13, -6); ctx.lineTo(-16, -17); ctx.lineTo(-5, -10); ctx.fill();
  ctx.beginPath(); ctx.moveTo(13, -6); ctx.lineTo(16, -17); ctx.lineTo(5, -10); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.ellipse(5, -2, 3, 4, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-5, -2, 3, 4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#2a2a2a";
  ctx.beginPath(); ctx.ellipse(5.5, -1, 1.4, 2.2, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-4.5, -1, 1.4, 2.2, 0, 0, 7); ctx.fill();
  // 怒眉
  ctx.strokeStyle = "#5a2e8a"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(1, -7); ctx.lineTo(9, -4); ctx.moveTo(-1, -7); ctx.lineTo(-9, -4); ctx.stroke();
  ctx.restore();
}

// ---------- 食人花绘制(只画管道口以上的部分,缩回时自然"沉"进管道) ----------
function drawPlant(pl) {
  const px = pl.x - cam.x;
  if (px < -60 || px > W + 60) return;
  if (pl.topY - pl.y <= 3) return;           // 完全缩回管道就不画
  ctx.save();
  // 裁剪:只渲染管道口高度以上的区域,花缩回去时像被管道吞掉
  ctx.beginPath(); ctx.rect(px - 30, pl.topY - 300, pl.w + 60, 300); ctx.clip();
  const bx = px + pl.w / 2;
  // 茎
  ctx.fillStyle = "#2fa84f";
  ctx.fillRect(bx - 4, pl.y + 18, 8, pl.topY - pl.y - 14);
  // 叶子
  ctx.fillStyle = "#7ed957";
  ctx.beginPath(); ctx.ellipse(bx - 11, pl.topY - 6, 8, 3.5, -0.5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(bx + 11, pl.topY - 6, 8, 3.5, 0.5, 0, 7); ctx.fill();
  // 红色花头 + 白斑点
  ctx.fillStyle = "#e94560";
  ctx.beginPath(); ctx.ellipse(bx, pl.y + 11, 13, 12, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#fff";
  [[-6, 6], [6, 5], [0, 14]].forEach(([ox, oy]) => { ctx.beginPath(); ctx.arc(bx + ox, pl.y + oy, 2.4, 0, 7); ctx.fill(); });
  // 一开一合的嘴
  const open = Math.sin(Date.now() / 160) > 0 ? 4 : 0;
  ctx.beginPath();
  ctx.moveTo(bx - 9, pl.y + 15 + open); ctx.lineTo(bx + 9, pl.y + 15 + open); ctx.lineTo(bx, pl.y + 21 + open);
  ctx.fill();
  ctx.restore();
}

function draw() {
  // 天空
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#a8e0ff"); sky.addColorStop(0.65, "#ffe8f2"); sky.addColorStop(1, "#ffd9ea");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // 远景山丘(视差)
  ctx.fillStyle = "rgba(255,194,220,0.5)";
  ctx.beginPath(); ctx.ellipse(200 - cam.x * 0.2, H - 40, 180, 120, 0, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(700 - cam.x * 0.2, H - 20, 220, 150, 0, Math.PI, 0); ctx.fill();
  // 砖块/物品(可见列)
  const c0 = Math.floor(cam.x / TILE), c1 = Math.ceil((cam.x + W) / TILE);
  for (let r = 0; r < ROWS; r++)
    for (let c = c0; c <= c1; c++)
      if (world[r] && world[r][c]) drawTile(world[r][c], c, r);
  // 食人花(画在砖块之上、敌人之下)
  plants.forEach(drawPlant);
  // 敌人
  enemies.forEach(drawEnemy);
  // 玩家(受击闪烁)
  if (!(player.inv > 0 && Math.floor(player.inv / 6) % 2)) {
    drawCatMario(player.x - cam.x, player.y, player.dir, player.onGround);
  }
  // 飘字(顶砖奖励)
  const now = Date.now();
  floats = floats.filter(f => now - f.t0 < 900);
  floats.forEach(f => {
    const age = (now - f.t0) / 900;
    ctx.globalAlpha = 1 - age;
    ctx.font = "800 18px Nunito, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const fx = f.x - cam.x, fy = f.y - age * 46;
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.strokeText(f.txt, fx, fy);
    ctx.fillStyle = "#ff6b9d"; ctx.fillText(f.txt, fx, fy);
    ctx.globalAlpha = 1;
  });
  // 标题菜单(游戏最上层)
  if (state === "menu") drawMenu();
}

// ---------- 标题菜单 ----------
function drawMenu() {
  ctx.fillStyle = "rgba(255,214,232,0.9)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#ff6b9d";
  ctx.font = "800 62px Fredoka, Nunito, sans-serif";

// ---------- 音效 ----------
let ac = null;
function ensureAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === "suspended") ac.resume(); }
function beep(f, d, t, v) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = t; o.frequency.value = f;
  g.gain.setValueAtTime(v, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + d);
}

// ---------- 背景音乐(Web Audio 合成的原创欢快小循环,方波主旋律 + 三角波低音) ----------
const BGM_SEQ = [
  659, 0, 784, 0, 880, 784, 659, 0, 523, 0, 587, 659, 587, 0, 523, 0,
  440, 0, 523, 0, 587, 523, 440, 0, 392, 0, 440, 494, 523, 0, 0, 0,
];
let bgmTimer = null, bgmStep = 0;
function startBGM() {
  if (bgmTimer || !ac) return;
  bgmTimer = setInterval(() => {
    const f = BGM_SEQ[bgmStep % BGM_SEQ.length];
    if (f) beep(f, 0.16, "square", 0.03);
    if (bgmStep % 4 === 0) beep(131, 0.2, "triangle", 0.045);   // 每拍一个低音"咚"
    bgmStep++;
  }, 170);
}
function stopBGM() { clearInterval(bgmTimer); bgmTimer = null; }

// ---------- HUD / 结算 ----------
function get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const hudTime = document.getElementById("hud-time");
function updateHUD() {
  document.getElementById("hud-score").textContent = score;
  document.getElementById("hud-coin").textContent = coinsGot;
  document.getElementById("hud-life").textContent = "❤".repeat(Math.max(0, lives)) || "💔";
  updateTimeHUD();
}
// ⏰ 倒计时单独刷新(每帧调用,最后 60 秒变红警告)
function updateTimeHUD() {
  const t = Math.max(0, Math.ceil(timeLeft));
  hudTime.textContent = t;
  hudTime.classList.toggle("warn", t <= 60);
}

function endGame(winFlag) {
  state = "over";
  stopBGM();
  // 💰 金币入统一钱包
  Nikki.Wallet.add(coinsGot);
  // 📅 每日挑战
  const dailyGain = Nikki.Daily.report("mario", { score: 1 });
  // 🏆 最高分
  const isBest = score > best;
  if (isBest) { best = score; set("nikki_mario_best", score); }
  document.getElementById("over-e").textContent = winFlag ? "🏁" : "😿";
  document.getElementById("over-title").textContent = winFlag ? "通关啦!" : (timeoutDeath ? "⏰ 时间到!" : "游戏结束");
  document.getElementById("over-detail").innerHTML =
    `分数 <b>${score}</b> · 金币 <b>${coinsGot}</b> 枚(已入钱包 💰)<br>` +
    (dailyGain ? `📅 每日挑战完成!+${dailyGain.reward} 金币<br>` : "") +
    (isBest ? "🏆 <b>新纪录!</b>" : `最高分:${best}`);
  document.getElementById("over").classList.add("show");
  beep(winFlag ? 880 : 220, 0.3, winFlag ? "triangle" : "sawtooth", 0.12);
}

function win() {
  score += Math.floor(timeLeft) * 2;         // ⏰ 剩余时间奖励:每秒 2 分,跑得快赚得多
  updateHUD();
  beep(660, 0.12, "triangle", 0.12);
  setTimeout(() => beep(880, 0.12, "triangle", 0.12), 140);
  setTimeout(() => beep(1100, 0.2, "triangle", 0.12), 280);
  endGame(true);
}

// ---------- 主循环 ----------
function loop() {
  if (state === "play") {
    updatePlayer(); updateEnemies(); updatePlants();
    // ⏰ 倒计时(约 60fps,每帧减 1/60 秒),归零判负
    timeLeft -= 1 / 60;
    if (timeLeft <= 0) { timeLeft = 0; updateTimeHUD(); timeoutDeath = true; endGame(false); }
    else updateTimeHUD();
  }
  draw();
  requestAnimationFrame(loop);
}

// 启动
document.getElementById("hud-best").textContent = best;
startLevel();
loop();
</script>
