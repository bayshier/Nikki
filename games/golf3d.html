<!-- ═════════════════════════════════════════════════════════════
     猫猫高尔夫 3D · three.js 首次上车

       · 在球旁按住往后拖 = 弹弓瞄准,松手击球(镜头自动转到瞄准方向)
       · 低模方块猫当观众,毛线球打进猫碗 🥣
     ═════════════════════════════════════════════════════════════ -->
<style>
  :root { --hk-deep: #ff6b9d; --hk-muted: #c98ba0; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    font-family: "Nunito", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #ffe3ee 0%, #ffd0e2 50%, #ffc3da 100%);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 10px; color: #5a3a48;
  }
  header { text-align: center; margin-bottom: 6px; }
  header h1 { font-size: 24px; color: var(--hk-deep); text-shadow: 0 2px 0 #fff; }

  #stage { position: relative; width: min(96vw, 900px); }
  #cv {
    display: block; width: 100%; aspect-ratio: 4 / 3;
    border-radius: 18px; box-shadow: 0 8px 24px rgba(255, 107, 157, .35);

    position: absolute; top: 32%; left: 0; right: 0; text-align: center;

    text-shadow: 0 0 6px rgba(70, 110, 50, .9), 0 2px 0 rgba(70,110,50,.9), -2px 0 0 rgba(70,110,50,.7), 2px 0 0 rgba(70,110,50,.7);

  #overlay {

  #overlay h2 { font-size: 28px; margin-bottom: 10px; text-shadow: 0 2px 6px rgba(0,0,0,.4); }

  #overlay button {

  }
  #overlay button:active { transform: translateY(3px); box-shadow: 0 1px 0 #d94f83; }
  .home { margin-top: 10px; font-size: 13px; }
  a { color: var(--hk-deep); font-weight: 700; text-decoration: none; }
</style>

<body>
<header>
  <h1>⛳ 猫猫高尔夫 3D</h1>

<div id="stage">

       洞口自带<b>猫猫吸力</b>,慢球路过自动进洞~</p>

</div>

<script type="module">
import * as THREE from "three";

/* ═══════════════════════════════════════════════════════════
   一、常量与 9 洞球道数据 —— 与 2D 版 golf.html 完全同源
   (walls/sands/waters 的 [x,y,w,h] 直接映射到地面 x/z)
   ═══════════════════════════════════════════════════════════ */
const BALL_R = 7, CUP_R = 13, MAX_POW = 12.5, MAX_DRAG = 170;
const HOLES = [
  { par: 2, name: "热身直道", start: [90, 255],  cup: [550, 255],
    walls: [], sands: [], waters: [] },
  { par: 2, name: "穿墙而过", start: [90, 255],  cup: [550, 255],
    walls: [[304, 60, 26, 140], [304, 310, 26, 140]], sands: [], waters: [] },
  { par: 3, name: "绕过大石", start: [90, 90],   cup: [550, 420],
    walls: [[270, 150, 100, 180]], sands: [[140, 330, 150, 110]], waters: [] },
  { par: 2, name: "独木水桥", start: [90, 245],  cup: [550, 245],
    walls: [], sands: [], waters: [[264, 60, 112, 140], [264, 290, 112, 160]] },
  { par: 3, name: "沙滩花园", start: [90, 80],   cup: [540, 400],
    walls: [], sands: [[190, 140, 260, 200]], waters: [] },
  { par: 3, name: "S 形回廊", start: [80, 80],   cup: [560, 420],
    walls: [[0, 140, 410, 26], [230, 314, 410, 26]], sands: [], waters: [] },
  { par: 2, name: "水上走廊", start: [90, 240],  cup: [550, 240],
    walls: [], sands: [], waters: [[430, 60, 180, 130], [430, 290, 180, 160]] },
  { par: 4, name: "老鼠迷宫", start: [70, 150],  cup: [560, 150],
    walls: [[150, 60, 26, 240], [300, 180, 26, 240], [450, 60, 26, 240]], sands: [], waters: [] },
  { par: 3, name: "终点绕圈", start: [90, 255],  cup: [550, 255],
    walls: [[285, 60, 26, 320]], sands: [[230, 388, 140, 56]], waters: [] },
];
const TOTAL_PAR = HOLES.reduce((s, h) => s + h.par, 0);      // 总标准杆 24

/* ═══════════════════════════════════════════════════════════
   二、渲染器 / 场景 / 相机 / 灯光
   ═══════════════════════════════════════════════════════════ */
const cv = document.getElementById("cv");
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));   // 手机端像素比封顶 2
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 4 / 3, 1, 3000);

const hemi = new THREE.HemisphereLight(0xfff4f7, 0x9ed47f, 0.95);
const sun = new THREE.DirectionalLight(0xfff2dd, 1.7);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -260; sun.shadow.camera.right = 260;
sun.shadow.camera.top = 260;  sun.shadow.camera.bottom = -260;
sun.shadow.camera.near = 10;  sun.shadow.camera.far = 700;
sun.shadow.bias = -0.0004;
scene.add(hemi, sun, sun.target);

/* ═══════════════════════════════════════════════════════════
   三、画布纹理工具(所有贴图都是程序化 canvas,零外部素材)
   ═══════════════════════════════════════════════════════════ */
function canvasTex(w, h, draw, opt = {}) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (opt.wrap) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;
}
/* 天空:粉蓝渐变 */
const skyTex = canvasTex(2, 256, (g) => {
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, "#7ec4f5"); gr.addColorStop(0.55, "#bfe4ff"); gr.addColorStop(1, "#ffe3ee");
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
});
scene.background = skyTex;
/* 草地:横向修剪条纹(和 2D 版同款) */
const grassTex = canvasTex(640, 480, (g) => {
  for (let y = 0; y < 480; y += 40) {
    g.fillStyle = ((y / 40) | 0) % 2 ? "#7cc45e" : "#74bb56";
    g.fillRect(0, y, 640, 40);
  }
});
grassTex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
/* 砖墙纹理 */
const brickTexBase = canvasTex(64, 32, (g) => {
  g.fillStyle = "#c98b6a"; g.fillRect(0, 0, 64, 32);
  g.strokeStyle = "rgba(90,50,30,.35)"; g.lineWidth = 2;
  g.strokeRect(1, 1, 62, 30);
  g.beginPath(); g.moveTo(0, 16); g.lineTo(64, 16); g.stroke();
  g.beginPath(); g.moveTo(32, 0); g.lineTo(32, 16); g.moveTo(16, 16); g.lineTo(16, 32); g.moveTo(48, 16); g.lineTo(48, 32); g.stroke();
}, { wrap: true });
/* 水面波纹(先填蓝色水体打底,再叠白色浪线) */
function makeWaveTex() {
  const t = canvasTex(128, 128, (g) => {
    g.fillStyle = "#4a9de8"; g.fillRect(0, 0, 128, 128);
    g.strokeStyle = "rgba(255,255,255,.45)"; g.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      g.beginPath();
      for (let x = 0; x <= 128; x += 6) g.lineTo(x, 24 + i * 40 + Math.sin(x * 0.09 + i * 2) * 5);
      g.stroke();
    }
  }, { wrap: true });
  t.repeat.set(2, 2);
  return t;
}
/* 旗帜 */
const flagTex = canvasTex(120, 76, (g) => {
  g.fillStyle = "#ff6b9d"; g.fillRect(0, 0, 120, 76);
  g.fillStyle = "#fff"; g.font = "40px serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("🐾", 60, 40);
});
/* 发球爪印垫 */
const teeTex = canvasTex(64, 64, (g) => {
  g.fillStyle = "rgba(255,255,255,.55)";
  g.beginPath(); g.arc(32, 32, 30, 0, 6.29); g.fill();
  g.font = "24px serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("🐾", 32, 33);
});
/* 毛线球贴图 */
const ballTex = canvasTex(256, 256, (g) => {
  g.fillStyle = "#fff8f0"; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = "#ffb0c8"; g.lineWidth = 13;
  g.beginPath(); g.arc(128, 128, 78, 0.4, 2.6); g.stroke();
  g.beginPath(); g.arc(128, 128, 48, 3.4, 5.6); g.stroke();
  g.beginPath(); g.arc(128, 128, 100, 4.6, 6.0); g.stroke();
});
/* 粒子小圆点 */
const dotTex = canvasTex(32, 32, (g) => {
  g.fillStyle = "#fff";
  g.beginPath(); g.arc(16, 16, 14, 0, 6.29); g.fill();
});

/* ═══════════════════════════════════════════════════════════
   四、静态环境:场地 / 围栏 / 远山 / 云
   ═══════════════════════════════════════════════════════════ */
{
  const base = new THREE.Mesh(
    new THREE.PlaneGeometry(1600, 1300),
    new THREE.MeshStandardMaterial({ color: 0x68b34b, roughness: 1 })
  );
  base.rotation.x = -Math.PI / 2; base.position.set(320, -0.55, 240);
  scene.add(base);

  const field = new THREE.Mesh(
    new THREE.PlaneGeometry(640, 480),
    new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 })
  );
  field.rotation.x = -Math.PI / 2; field.position.set(320, 0, 240);
  field.receiveShadow = true;
  scene.add(field);

  /* 粉色围栏:球道四周(即物理边界) */
  const fenceMat = new THREE.MeshStandardMaterial({ color: 0xffb0c8, roughness: 0.8 });
  [[320, 10, 660, 6], [320, 470, 660, 6], [10, 240, 6, 480], [630, 240, 6, 480]].forEach(([x, z, w, d]) => {
    const f = new THREE.Mesh(new THREE.BoxGeometry(w, 12, d), fenceMat);
    f.position.set(x, 6, z); f.castShadow = true;
    scene.add(f);
  });

  /* 远山:大扁球 */
  const hillCols = [0x8fd47f, 0xa1dc8b, 0x86cc72, 0x9bd886];
  [[-380, -260, 120], [900, -300, 150], [1000, 620, 130], [-320, 700, 100], [660, -380, 90]].forEach(([x, z, r], i) => {
    const hl = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14),
      new THREE.MeshStandardMaterial({ color: hillCols[i % 4], roughness: 1 }));
    hl.scale.y = 0.5; hl.position.set(x, -10, z);
    scene.add(hl);
  });
}
/* 云:缓慢飘动的扁球组 */
const clouds = [];
{
  const cm = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
  for (let i = 0; i < 5; i++) {
    const grp = new THREE.Group();
    [[0, 0, 0, 14], [12, -2, 2, 10], [-12, -2, -2, 11]].forEach(([x, y, z, r]) => {
      const p = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), cm);
      p.scale.y = 0.6; p.position.set(x, y, z);
      grp.add(p);
    });
    grp.position.set(-300 + i * 240 + (i % 2) * 80, 150 + (i % 3) * 18, -160 + i * 190);
    grp.userData.speed = 0.02 + i * 0.012;
    scene.add(grp); clouds.push(grp);
  }
}

/* ═══════════════════════════════════════════════════════════
   五、公共资产:毛线球 / 猫碗旗 / 发球垫 / 方块猫观众
   ═══════════════════════════════════════════════════════════ */
const ballMesh = new THREE.Mesh(
  new THREE.SphereGeometry(BALL_R, 24, 18),
  new THREE.MeshStandardMaterial({ map: ballTex, roughness: 0.5 })
);
ballMesh.castShadow = true;
scene.add(ballMesh);

/* 猫碗(杯口圆环) + 旗杆 + 旗 —— 每洞只挪位置不重建 */
const cupGroup = new THREE.Group();
{
  const holeDisc = new THREE.Mesh(new THREE.CircleGeometry(12.5, 28),
    new THREE.MeshBasicMaterial({ color: 0x2e1f28 }));
  holeDisc.rotation.x = -Math.PI / 2; holeDisc.position.y = 0.12;
  const rim = new THREE.Mesh(new THREE.TorusGeometry(13, 2.6, 10, 28),
    new THREE.MeshStandardMaterial({ color: 0xe8b8c8, roughness: 0.6 }));
  rim.rotation.x = -Math.PI / 2; rim.position.y = 1.6; rim.castShadow = true;
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 56, 8),
    new THREE.MeshStandardMaterial({ color: 0xeceefc, roughness: 0.4 }));
  pole.position.y = 28; pole.castShadow = true;
  const flagGeo = new THREE.PlaneGeometry(30, 19);
  flagGeo.translate(15, 0, 0);                                  // 左边贴旗杆,方便摆动
  const flag = new THREE.Mesh(flagGeo,
    new THREE.MeshBasicMaterial({ map: flagTex, side: THREE.DoubleSide }));
  flag.position.y = 47;
  cupGroup.add(holeDisc, rim, pole, flag);
  cupGroup.userData.flag = flag;
  scene.add(cupGroup);
}
/* 发球爪印垫 */
const teeMesh = new THREE.Mesh(new THREE.CircleGeometry(14, 24),
  new THREE.MeshBasicMaterial({ map: teeTex, transparent: true }));
teeMesh.rotation.x = -Math.PI / 2; teeMesh.position.y = 0.14;
scene.add(teeMesh);

/* 低模方块猫:身体 + 头 + 耳 + 眼鼻 + 卷尾,整场只有 3 只,逐洞挪位置 */
const CAT_COLORS = [0xffb38a, 0xf7f7f7, 0x4a4a4a];
const cats = [];
{
  for (let ci = 0; ci < 3; ci++) {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: CAT_COLORS[ci], roughness: 0.9 });
    const dark = new THREE.MeshStandardMaterial({ color: 0x2b2233, roughness: 0.6 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(20, 17, 26), mat);
    body.position.y = 11; body.castShadow = true;
    const head = new THREE.Mesh(new THREE.BoxGeometry(15, 13, 13), mat);
    head.position.set(0, 25, 8); head.castShadow = true;
    const earGeo = new THREE.ConeGeometry(3.6, 6.5, 4);
    const earL = new THREE.Mesh(earGeo, mat); earL.position.set(-4.6, 34, 8);
    const earR = new THREE.Mesh(earGeo, mat); earR.position.set(4.6, 34, 8);
    const eyeGeo = new THREE.SphereGeometry(1.4, 8, 6);
    const eyeL = new THREE.Mesh(eyeGeo, dark); eyeL.position.set(-4, 26, 14.6);
    const eyeR = new THREE.Mesh(eyeGeo, dark); eyeR.position.set(4, 26, 14.6);
    const nose = new THREE.Mesh(new THREE.SphereGeometry(1.1, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0xff8fb0, roughness: 0.5 }));
    nose.position.set(0, 23, 15);
    const tailPivot = new THREE.Group(); tailPivot.position.set(0, 15, -13);
    [[0, 0, -2, 2.2], [0, 4, -4.5, 1.9], [0, 8, -5.5, 1.5]].forEach(([x, y, z, r]) => {
      const s = new THREE.Mesh(new THREE.SphereGeometry(r, 8, 6), mat);
      s.position.set(x, y, z); tailPivot.add(s);
    });
    g.add(body, head, earL, earR, eyeL, eyeR, nose, tailPivot);
    g.userData.tail = tailPivot; g.userData.phase = ci * 2.1;
    scene.add(g); cats.push(g);
  }
}
/* 观众席候选位(逐洞轮换起点,避开墙/沙/水/发球点/碗) */
const CAT_SPOTS = [
  [50, 45], [320, 45], [590, 45], [45, 250], [595, 250], [50, 455], [320, 455], [590, 455],
  [150, 150], [470, 150], [150, 350], [470, 350], [230, 250], [410, 250], [90, 455], [550, 45],
];
function spotOK(px, pz, h) {
  if (Math.hypot(px - h.start[0], pz - h.start[1]) < 50) return false;
  if (Math.hypot(px - h.cup[0], pz - h.cup[1]) < 50) return false;
  const inRect = (r, m) => px > r[0] - m && px < r[0] + r[2] + m && pz > r[1] - m && pz < r[1] + r[3] + m;
  for (const w of h.walls) if (inRect(w, 26)) return false;
  for (const s of h.sands) if (inRect(s, 20)) return false;
  for (const wt of h.waters) if (inRect(wt, 20)) return false;
  return true;
}

/* ═══════════════════════════════════════════════════════════
   六、每洞动态搭建:墙 / 沙地 / 水塘(只这些逐洞重建与销毁)
   ═══════════════════════════════════════════════════════════ */
let dynGroup = null, waterTexes = [], disposables = [];
function rrectShape(w, h, r) {
  const s = new THREE.Shape(); const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function track(...objs) { disposables.push(...objs); }
function buildHole(i) {
  if (dynGroup) { scene.remove(dynGroup); disposables.forEach(d => d.dispose && d.dispose()); disposables = []; }
  waterTexes = [];
  dynGroup = new THREE.Group();
  const h = HOLES[i];

  /* 砖墙(猫塔积木风) */
  for (const wl of h.walls) {
    const tex = brickTexBase.clone(); tex.needsUpdate = true;
    tex.repeat.set(Math.max(1, Math.round(wl[2] / 26)), Math.max(1, Math.round(20 / 13)));
    const geo = new THREE.BoxGeometry(wl[2], 20, wl[3]);
    const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 });
    const m = new THREE.Mesh(geo, mat);
    m.position.set(wl[0] + wl[2] / 2, 10, wl[1] + wl[3] / 2);
    m.castShadow = m.receiveShadow = true;
    dynGroup.add(m); track(geo, mat, tex);
  }
  /* 沙地 */
  const sandMat = new THREE.MeshStandardMaterial({ color: 0xf0dca8, roughness: 1 });
  for (const s of h.sands) {
    const geo = new THREE.ShapeGeometry(rrectShape(s[2], s[3], 14));
    const m = new THREE.Mesh(geo, sandMat);
    m.rotation.x = Math.PI / 2; m.position.set(s[0] + s[2] / 2, 0.1, s[1] + s[3] / 2);
    m.receiveShadow = true;
    dynGroup.add(m); track(geo);
  }
  track(sandMat);
  /* 水塘(波纹贴图逐帧流动) */
  for (const wt of h.waters) {
    const tex = makeWaveTex(); tex.repeat.set(Math.max(1, wt[2] / 70), Math.max(1, wt[3] / 70));
    const geo = new THREE.ShapeGeometry(rrectShape(wt[2], wt[3], 14));
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.92, side: THREE.DoubleSide });
    const m = new THREE.Mesh(geo, mat);
    m.rotation.x = Math.PI / 2; m.position.set(wt[0] + wt[2] / 2, 0.08, wt[1] + wt[3] / 2);
    dynGroup.add(m); track(geo, mat, tex);
    waterTexes.push(tex);
  }
  scene.add(dynGroup);

  /* 静态资产就位:碗 / 垫 / 观众猫 */
  cupGroup.position.set(h.cup[0], 0, h.cup[1]);
  teeMesh.position.set(h.start[0], 0.14, h.start[1]);
  const spots = [];
  for (let k = 0; k < CAT_SPOTS.length && spots.length < 3; k++) {
    const idx = (k + i * 3) % CAT_SPOTS.length;                   // 逐洞轮换起点
    const [px, pz] = CAT_SPOTS[idx];
    if (spotOK(px, pz, h) && !spots.some(s => s[0] === px && s[1] === pz)) spots.push([px, pz]);
  }
  cats.forEach((c, j) => {
    if (j < spots.length) {
      c.visible = true;
      c.position.set(spots[j][0], 0, spots[j][1]);
      c.rotation.y = Math.atan2(h.cup[0] - spots[j][0], h.cup[1] - spots[j][1]);
    } else c.visible = false;
  });
}

/* ═══════════════════════════════════════════════════════════
   七、音效(与 2D 版同款 Web Audio 合成)
   ═══════════════════════════════════════════════════════════ */
let AC = null;
function tone(f0, f1, dur, type = "square", vol = 0.12) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sfx = {
  tee:  () => tone(220, 660, .1, "square"),
  wall: () => tone(500, 300, .05, "square", .08),
  sand: () => tone(300, 120, .12, "sawtooth", .07),
  splash: () => tone(400, 60, .4, "sine", .15),
  sink: () => [660, 880, 1100].forEach((f, i) => setTimeout(() => tone(f, f, .1, "triangle", .13), i * 90)),
  win:  () => [0, .12, .24, .4].forEach((d, i) => setTimeout(() => tone([523, 659, 784, 1046][i], [523, 659, 784, 1046][i], .18, "triangle", .14), d * 1000)),
};

/* ═══════════════════════════════════════════════════════════
   八、粒子池(单 Points 一次 draw call:水花/彩带/拖尾/撞墙屑)
   ═══════════════════════════════════════════════════════════ */
const PMAX = 240;
const pPos = new Float32Array(PMAX * 3).fill(-999);
const pCol = new Float32Array(PMAX * 3);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3));
const points = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 5, map: dotTex, transparent: true, depthWrite: false, vertexColors: true,
}));
points.frustumCulled = false;
scene.add(points);
const parts = new Array(PMAX).fill(null).map(() => ({ life: 0, max: 1, vx: 0, vy: 0, vz: 0, g: 0, r: 1, gc: 1, b: 1 }));
let pCursor = 0;
function spawn(x, y, z, n, color, spd, up, g, life) {
  const c = new THREE.Color(color);
  for (let k = 0; k < n; k++) {
    const i = pCursor = (pCursor + 1) % PMAX, p = parts[i];
    const a = Math.random() * 6.283, v = Math.random() * spd;
    p.life = p.max = life + Math.random() * 10;
    p.vx = Math.cos(a) * v; p.vz = Math.sin(a) * v;
    p.vy = Math.random() * up; p.g = g;
    p.r = c.r; p.gc = c.g; p.b = c.b;
    pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z;
  }
}
function updateParts() {
  let any = false;
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i];
    if (p.life <= 0) continue;
    any = true; p.life--;
    p.vy -= p.g;
    pPos[i * 3] += p.vx; pPos[i * 3 + 1] += p.vy; pPos[i * 3 + 2] += p.vz;
    if (pPos[i * 3 + 1] < 0.5) { pPos[i * 3 + 1] = 0.5; p.vy = 0; }
    const k = p.life / p.max;
    pCol[i * 3] = p.r * k; pCol[i * 3 + 1] = p.gc * k; pCol[i * 3 + 2] = p.b * k;
    if (p.life <= 0) pPos[i * 3 + 1] = -999;
  }
  if (any) { pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true; }
}

/* ═══════════════════════════════════════════════════════════
   九、游戏状态与物理 —— 判定数值与 2D 版逐项一致
   ═══════════════════════════════════════════════════════════ */
const G = {};
function loadHole(i) {
  G.hole = i;                                                  // 洞号由 loadHole 统一管理
  const h = HOLES[i];
  Object.assign(G.ball ??= {}, {
    x: h.start[0], z: h.start[1], y: BALL_R, vx: 0, vz: 0, vy: 0, air: false, moving: false, sandT: 0,
  });
  G.strokes = 0;                                             // 本洞杆数
  G.preShot = { x: h.start[0], z: h.start[1] };              // 落水回退点 = 上次击球点
  G.sinkT = 0; G.msg = ""; G.msgT = 0;
  ballMesh.scale.setScalar(1); ballMesh.visible = true;
  ballMesh.position.set(G.ball.x, BALL_R, G.ball.z);
  buildHole(i);
  /* 镜头对准球道方向(发球点 → 猫碗) */
  camYaw = Math.atan2(h.cup[1] - h.start[1], h.cup[0] - h.start[0]);
  camInit = false;
  G.msg = `⛳ 洞 ${i + 1} · ${h.name} · Par ${h.par}`; G.msgT = 130;
}
function reset() {
  Object.assign(G, {
    mode: "play", hole: 0, total: 0, tick: 0,
    drag: null, aimLen: 0, aimW: null,
  });
  loadHole(0);
}
const clamp = (v, a, b) => Math.max(a, Math.min(v, b));
/* 圆对 AABB 碰撞(2D 版 bounceRect 的 x/z 平面版) */
function bounceRect(x1, z1, x2, z2, rest) {
  const b = G.ball;
  const cx = clamp(b.x, x1, x2), cz = clamp(b.z, z1, z2);
  const dx = b.x - cx, dz = b.z - cz;
  const d = Math.hypot(dx, dz);
  if (d >= BALL_R || d === 0) return;
  const nx = dx / d, nz = dz / d;
  b.x = cx + nx * BALL_R; b.z = cz + nz * BALL_R;
  const dot = b.vx * nx + b.vz * nz;
  if (dot < 0) {
    b.vx -= (1 + rest) * dot * nx;
    b.vz -= (1 + rest) * dot * nz;
    if (Math.hypot(b.vx, b.vz) > 1.2) {
      sfx.wall();
      spawn(b.x, 8, b.z, 4, 0xffffff, 1.6, 2, 0.25, 16);
    }
  }
}
function update() {
  if (G.mode !== "play") return;
  G.tick++;
  if (G.msgT > 0) G.msgT--;
  const h = HOLES[G.hole], b = G.ball;

  /* —— 进洞动画:毛线球被吸进碗 —— */
  if (G.sinkT > 0) {
    const k = G.sinkT / 75;
    ballMesh.scale.setScalar(Math.max(0.05, k));
    ballMesh.position.x += (h.cup[0] - ballMesh.position.x) * 0.18;
    ballMesh.position.z += (h.cup[1] - ballMesh.position.z) * 0.18;
    ballMesh.position.y += (2 - ballMesh.position.y) * 0.14;
    ballMesh.rotation.y += 0.25;
    if (--G.sinkT === 0) nextHole();
    return;
  }

  if (b.moving) {
    const grounded = !b.air;
    const inSand = grounded && h.sands.some(s => b.x > s[0] && b.x < s[0] + s[2] && b.z > s[1] && b.z < s[1] + s[3]);
    if (inSand && !b.sandT) { sfx.sand(); spawn(b.x, 4, b.z, 6, 0xe0c98d, 1.4, 2, 0.2, 18); b.sandT = 1; }
    else if (!inSand) b.sandT = 0;
    if (grounded) {
      const fr = inSand ? 0.90 : 0.9855;                     // 沙地急刹
      b.vx *= fr; b.vz *= fr;
      /* 洞口吸力:慢球靠近时被轻轻拉进去 */
      const dxC = h.cup[0] - b.x, dzC = h.cup[1] - b.z, dC = Math.hypot(dxC, dzC);
      const sp0 = Math.hypot(b.vx, b.vz);
      if (dC < 26 && sp0 < 3.4) { b.vx += dxC / dC * 0.22; b.vz += dzC / dC * 0.22; }
    }
    b.x += b.vx; b.z += b.vz;
    /* 小跳(击球 juice):离地时受重力,落地轻微反弹 */
    if (b.air) {
      b.vy -= 0.4; b.y += b.vy;
      if (b.y <= BALL_R) {
        b.y = BALL_R;
        b.vy = -b.vy * 0.35;
        if (b.vy < 1) { b.vy = 0; b.air = false; }
      }
    }
    /* 四周围栏(物理边界) */
    bounceRect(-20, -20, 10, 500, 0.65);
    bounceRect(630, -20, 660, 500, 0.65);
    bounceRect(-20, -20, 660, 10, 0.65);
    bounceRect(-20, 470, 660, 500, 0.65);
    /* 球道砖墙(空中越过墙顶就不撞) */
    if (b.y < 26) for (const wl of h.walls) bounceRect(wl[0], wl[1], wl[0] + wl[2], wl[1] + wl[3], 0.82);
    /* 落水:罚 1 杆,退回上次击球点 */
    if (b.y <= 9 && h.waters.some(wt => b.x > wt[0] && b.x < wt[0] + wt[2] && b.z > wt[1] && b.z < wt[1] + wt[3])) {
      sfx.splash();
      spawn(b.x, 4, b.z, 16, 0x7fd4ff, 3.5, 4.5, 0.3, 34);
      G.strokes++;
      G.msg = "💧 落水!罚 1 杆"; G.msgT = 90;
      b.x = G.preShot.x; b.z = G.preShot.z;
      b.y = BALL_R; b.vx = b.vz = b.vy = 0; b.moving = false; b.air = false;
      return;
    }
    /* 进洞判定:距离够近且速度够慢 */
    const dC = Math.hypot(h.cup[0] - b.x, h.cup[1] - b.z);
    if (grounded && dC < CUP_R && Math.hypot(b.vx, b.vz) < 2.9) { sinkHole(); return; }
    /* 停球 */
    if (grounded && Math.hypot(b.vx, b.vz) < 0.08) { b.vx = b.vz = 0; b.moving = false; }
    /* 拖尾粒子 */
    if (G.tick % 3 === 0 && Math.hypot(b.vx, b.vz) > 2) spawn(b.x, 3, b.z, 1, 0xffffff, 0.3, 0.5, 0, 18);
  }
  updateParts();
}
/* 进洞!算成绩(低于标准杆有称号) */
function sinkHole() {
  sfx.sink();
  const h = HOLES[G.hole];
  spawn(h.cup[0], 8, h.cup[1], 24, 0xffd56b, 2.6, 6, 0.22, 40);
  spawn(h.cup[0], 8, h.cup[1], 16, 0xff6b9d, 2.2, 5, 0.22, 40);
  spawn(h.cup[0], 8, h.cup[1], 12, 0xffffff, 2, 5, 0.22, 40);
  G.total += G.strokes;
  const diff = G.strokes - h.par;
  G.msg = G.strokes === 1 ? "🎯 一杆进洞!!!" :
          diff <= -2 ? "🦅 老鹰球!" : diff === -1 ? "🐦 小鸟球!" :
          diff === 0 ? "👍 标准杆" : diff === 1 ? "😅 柏忌" : "🥲 再练练…";
  G.msgT = 200;
  G.sinkT = 75;
  G.ball.moving = false; G.ball.vx = G.ball.vz = 0;
}
function nextHole() {
  if (G.hole + 1 >= HOLES.length) return doWin();
  loadHole(G.hole + 1);
}
function doWin() {
  G.mode = "over"; sfx.win();
  const diff = G.total - TOTAL_PAR;
  const grade = diff <= -4 ? "🐱‍🏍 高尔夫猫神!" : diff <= 0 ? "🏆 职业水平!" : diff <= 4 ? "😊 不错不错" : "🧹 还需练球";
  const coins = Math.max(20, 100 + (TOTAL_PAR - G.total) * 25);
  Nikki.Wallet.add(coins);
  const gain = Nikki.Daily.report("golf", { holes: HOLES.length, score: G.total });
  const old = Nikki.jget("nikki_golf3d_best", 999);
  if (G.total < old) Nikki.jset("nikki_golf3d_best", G.total);
  const ov = document.getElementById("overlay");
  ov.innerHTML = `<h2>🏁 全场打完!</h2>
    <p>${grade}<br>总杆 <b>${G.total}</b> · 标准杆 ${TOTAL_PAR}(${diff === 0 ? "E" : diff > 0 ? "+" + diff : diff})<br>
    结算:<b>+${coins}</b> 金币${gain ? ` · 每日挑战完成 +${gain}!` : ""}</p>
    <button onclick="location.reload()">🔁 再打一轮</button>`;
  ov.style.display = "flex";
}

/* ═══════════════════════════════════════════════════════════
   十、输入:弹弓瞄准(屏幕任意处按住拖动,镜头跟着转)
   指针拖动向量按相机朝向投影到地面:往下拉=朝镜头前方打
   ═══════════════════════════════════════════════════════════ */
let camYaw = 0, camInit = false;
const camPos = new THREE.Vector3();
function aimFromDrag(dx, dy) {                                 // dx/dy:指针位移(css px)
  const fx = Math.cos(camYaw), fz = Math.sin(camYaw);          // 相机前向(地面投影)
  const rx = -fz, rz = fx;                                     // 相机右向
  let ax = rx * -dx + fx * dy, az = rz * -dx + fz * dy;
  const len = Math.hypot(ax, az) || 1;
  return { x: ax / len, z: az / len };
}
cv.addEventListener("pointerdown", ev => {
  if (G.mode !== "play" || G.sinkT > 0 || G.ball.moving || G.drag) return;
  G.drag = { sx: ev.clientX, sy: ev.clientY };
  try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
});
cv.addEventListener("pointermove", ev => {
  if (!G.drag) return;
  const sc = 640 / cv.clientWidth;                             // css px → 逻辑 px
  const dx = ev.clientX - G.drag.sx, dy = ev.clientY - G.drag.sy;
  G.aimLen = Math.min(Math.hypot(dx, dy) * sc, MAX_DRAG);
  if (G.aimLen > 2) G.aimW = aimFromDrag(dx * sc, dy * sc);
});
cv.addEventListener("pointerup", () => {
  if (!G.drag) return;
  G.drag = null;
  if (G.aimLen > 14 && G.aimW) {                               // 太短视为取消
    const pow = G.aimLen / MAX_DRAG * MAX_POW;
    const b = G.ball;
    b.vx = G.aimW.x * pow; b.vz = G.aimW.z * pow;
    b.vy = Math.min(2.0, pow * 0.16); b.air = true;            // 小跳
    b.moving = true; b.sandT = 0;
    G.strokes++;
    G.preShot = { x: b.x, z: b.z };
    sfx.tee();
  }
  G.aimLen = 0; G.aimW = null; aimGroup.visible = false;
});

/* ═══════════════════════════════════════════════════════════
   十一、瞄准可视化:虚线 + 箭头 + 力量环
   ═══════════════════════════════════════════════════════════ */
const aimGroup = new THREE.Group(); aimGroup.visible = false;
const aimLineGeo = new THREE.BufferGeometry();
aimLineGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(6), 3));
const aimLine = new THREE.Line(aimLineGeo,
  new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 7, gapSize: 6, transparent: true, opacity: 0.95 }));
const aimCone = new THREE.Mesh(new THREE.ConeGeometry(5, 13, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
const ringGroup = new THREE.Group();                              // 力量环独立成组:只转环,不带动线/箭头
const aimRing = new THREE.Mesh(new THREE.TorusGeometry(15.5, 2.4, 8, 40, 0.01),
  new THREE.MeshBasicMaterial({ color: 0x8ef58e }));
aimRing.rotation.x = -Math.PI / 2;
ringGroup.add(aimRing);
let ringFrac = -1;
aimGroup.add(aimLine, aimCone, ringGroup);
scene.add(aimGroup);
const UP = new THREE.Vector3(0, 1, 0);
function updateAim() {
  const show = G.drag && G.aimLen > 14 && G.aimW;
  aimGroup.visible = !!show;
  if (!show) return;
  const b = G.ball, w = G.aimW, frac = G.aimLen / MAX_DRAG;
  const px = b.x + w.x * (30 + G.aimLen * 0.9), pz = b.z + w.z * (30 + G.aimLen * 0.9);
  const pa = aimLineGeo.attributes.position;
  pa.setXYZ(0, b.x, BALL_R, b.z); pa.setXYZ(1, px, BALL_R, pz);
  pa.needsUpdate = true; aimLine.computeLineDistances();
  aimCone.position.set(px, BALL_R, pz);
  aimCone.quaternion.setFromUnitVectors(UP, new THREE.Vector3(w.x, 0, w.z));
  ringGroup.position.set(b.x, BALL_R, b.z);
  if (Math.abs(frac - ringFrac) > 0.02) {                      // 力量环只在变化时重建
    aimRing.geometry.dispose();
    aimRing.geometry = new THREE.TorusGeometry(15.5, 2.4, 8, 40, Math.max(0.02, frac * 6.283));
    aimRing.material.color.set(frac > 0.85 ? 0xff5b5b : frac > 0.5 ? 0xffb03a : 0x8ef58e);
    ringFrac = frac;
  }
  ringGroup.rotation.y = -(Math.atan2(w.z, w.x) + frac * 6.283);
}

/* ═══════════════════════════════════════════════════════════
   十二、相机跟随:镜头平滑追到瞄准/击球方向的后上方
   ═══════════════════════════════════════════════════════════ */
function updateCamera() {
  const b = G.ball;
  let target = null;
  if (G.drag && G.aimW) target = Math.atan2(G.aimW.z, G.aimW.x);
  else if (b.moving && Math.hypot(b.vx, b.vz) > 0.8) target = Math.atan2(b.vz, b.vx);
  if (target !== null) {
    let d = target - camYaw;
    d = ((d + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
    camYaw += d * 0.06;
  }
  const fx = Math.cos(camYaw), fz = Math.sin(camYaw);
  const want = new THREE.Vector3(b.x - fx * 115, 78, b.z - fz * 115);
  if (!camInit) { camPos.copy(want); camInit = true; }
  else camPos.lerp(want, 0.07);
  camera.position.copy(camPos);
  camera.position.y += Math.sin(G.tick * 0.008) * 1.2;         // 轻微呼吸感
  camera.lookAt(b.x + fx * 30, 0, b.z + fz * 30);
}

/* ═══════════════════════════════════════════════════════════
   十三、HUD 与中央提示
   ═══════════════════════════════════════════════════════════ */
const hudL = document.getElementById("hud-l"), hudM = document.getElementById("hud-m"),
      hudR = document.getElementById("hud-r"), msgEl = document.getElementById("msg");
function updateHUD() {
  const h = HOLES[G.hole], diff = G.total - TOTAL_PAR;
  hudL.textContent = `🏌️ 洞 ${G.hole + 1}/9 · ${h.name}`;
  hudM.textContent = `Par ${h.par} · 本洞 ${G.strokes} 杆`;
  hudR.textContent = `总杆 ${G.total}(${diff === 0 ? "E" : diff > 0 ? "+" + diff : diff})`;
  msgEl.textContent = G.msg;
  msgEl.style.opacity = G.msgT > 0 ? Math.min(1, G.msgT / 40) : 0;
}

/* ═══════════════════════════════════════════════════════════
   十四、主循环:物理(固定步长,和 2D 版同款手感)+ 场景动画
   ═══════════════════════════════════════════════════════════ */
function frame() {
  update();
  const b = G.ball, h = HOLES[G.hole];
  /* 球的位置与滚动自转 */
  if (G.sinkT <= 0) {
    ballMesh.position.set(b.x, b.y, b.z);
    const sp = Math.hypot(b.vx, b.vz);
    if (sp > 0.05) {
      const axis = new THREE.Vector3(b.vz, 0, -b.vx).normalize();   // up × v
      ballMesh.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(axis, sp / BALL_R));
    }
  }
  /* 灯光跟着球,保证影子始终清晰 */
  sun.position.set(b.x + 90, 150, b.z + 70);
  sun.target.position.set(b.x, 0, b.z);
  /* 场景小动画 */
  cupGroup.userData.flag.rotation.y = Math.sin(G.tick * 0.06) * 0.28;
  waterTexes.forEach(t => { t.offset.x += 0.0016; t.offset.y += 0.0009; });
  cats.forEach((c, i) => {
    if (!c.visible) return;
    c.position.y = Math.sin(G.tick * 0.03 + c.userData.phase) * 1.2;
    c.userData.tail.rotation.x = Math.sin(G.tick * 0.05 + i) * 0.18;
  });
  clouds.forEach(c => {
    c.position.x += c.userData.speed;
    if (c.position.x > 1100) c.position.x = -500;
  });
  updateCamera();
  updateAim();
  updateHUD();
  renderer.render(scene, camera);
}
/* 画布尺寸自适应 */
function resize() {
  const w = cv.clientWidth, hgt = cv.clientHeight;
  renderer.setSize(w, hgt, false);
  camera.aspect = w / hgt;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

document.getElementById("btn-start").onclick = () => {
  if (!AC) tone(1, 1, .01);                                    // 手势里解锁音频
  document.getElementById("overlay").style.display = "none";
  reset();
};

reset();
resize();
renderer.setAnimationLoop(frame);

/* ═══════════════════════════════════════════════════════════
   十五、自动化测试钩子(不影响正常游玩)
   __golf3d.autoAim():直线瞄碗并按摩擦模型配速(直线球道可进洞)
   __golf3d.ballScreen():球在页面上的 css 坐标(供合成指针事件用)
   ═══════════════════════════════════════════════════════════ */
window.__golf3d = {
  G, HOLES, loadHole, reset,
  /* 手动步进:后台标签 rAF 被冻结时也能确定性验证物理/进洞/结算 */
  step(n = 1) {
    for (let i = 0; i < n; i++) update();
    renderer.render(scene, camera);
    return G.tick;
  },
  autoAim() {
    if (G.mode !== "play" || G.sinkT > 0 || G.ball.moving) return false;
    const h = HOLES[G.hole], b = G.ball;
    const dx = h.cup[0] - b.x, dz = h.cup[1] - b.z, d = Math.hypot(dx, dz);
    const v = Math.min(MAX_POW, d * (1 - 0.9855) + 2.2);       // 到碗时剩余速度 ≈2.2,触发吸洞
    b.vx = dx / d * v; b.vz = dz / d * v;
    b.vy = Math.min(2.0, v * 0.16); b.air = true;
    b.moving = true; b.sandT = 0;
    G.strokes++; G.preShot = { x: b.x, z: b.z };
    sfx.tee();
    return true;
  },
  ballScreen() {
    const v = new THREE.Vector3(G.ball.x, G.ball.y, G.ball.z).project(camera);
    const r = cv.getBoundingClientRect();
    return [(v.x * 0.5 + 0.5) * r.width + r.left, (-v.y * 0.5 + 0.5) * r.height + r.top];
  },
};
</script>
