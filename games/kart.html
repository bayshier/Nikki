<script type="module">
import * as THREE from "three";
import { initRenderer, canvasTex } from "../shared/three-kit.js";

/* ═══════════════════════════════════════════════════════════
   一、常量:手感参数抄自 chinese-can-fly-kart(60Hz 每 tick 值)
   ═══════════════════════════════════════════════════════════ */
const TICK = 1 / 60;
const K = {
  accel: 0.009, brake: 0.022, revMax: -0.16,
  topSpeed: 0.52, aero: 0.02, roll: 0.0018,     // 单位:每 tick 位移(0.52 = 31 单位/秒)
  steerLo: 0.045, steerHi: 0.020,          // 低/高速每 tick 转向率
  driftGripOut: 0.62, driftGripIn: 0.99,   // 漂移中外/内侧抓地
  driftArmTicks: 48,                        // 0.8s 漂移起势
  hopV: 0.09, gravity: 0.0056,                  // 起跳高度约 0.7 单位
  boostTime: [0, 57, 108, 180],             // 0.95/1.8/3.0s
  boostMul: [1, 1.12, 1.25, 1.36],
  sparkTicks: [70, 140, 260],               // 蓝/橙/红蓄力阈值
  spinTicks: 96,                             // 中招打转 1.6s
  rocketTicks: 180,                          // 火箭 3s
  laps: 3, itemRespawn: 150,                 // 2.5s
};
const CATS = [
  { id: "chenpi", name: "陈皮", body: 0xfbf7ee, patch: 0x23232c },
  { id: "baozi", name: "包子", body: 0xfff5f0 },
  { id: "niannian", name: "年年", body: 0xffb38a },
  { id: "songlu", name: "松露", body: 0x6b4a3a },
  { id: "youyu", name: "有鱼", body: 0xffc9a0 },
  { id: "jinzhang", name: "警长", body: 0x9aa7b8 },
  { id: "daer", name: "大儿", body: 0xff9e5e },
  { id: "ali", name: "阿狸", body: 0xd9776e },
];

/* ═══════════════════════════════════════════════════════════
   二、赛道:猫岛环线(中心样条 + 路宽)
   ═══════════════════════════════════════════════════════════ */
const PTS = [
  [0, -52], [30, -38], [36, -10], [22, 14], [34, 40], [8, 54],
  [-24, 46], [-38, 22], [-24, -2], [-44, -20], [-30, -46], [-12, -40],
].map(p => new THREE.Vector2(p[0], p[1]));
const curve = new THREE.CatmullRomCurve3(
  PTS.map(p => new THREE.Vector3(p.x, 0, p.y)), true, "catmullrom", 0.5);
const TRACK_LEN = curve.getLength();
const HALF_W = 4.2;                          // 半路宽
/* 赛道取样缓存:progress → {pos, tangent} */
const SAMPLES = 420;
const trackPts = [], trackTan = [];
for (let i = 0; i < SAMPLES; i++) {
  const u = i / SAMPLES;
  trackPts.push(curve.getPointAt(u));
  trackTan.push(curve.getTangentAt(u).normalize());
}
function nearestProgress(pos, hint = -1) {   // hint:上一帧进度,省全扫
  let best = -1, bd = 1e9;
  const from = hint < 0 ? 0 : Math.floor(hint * SAMPLES - 30 + SAMPLES) % SAMPLES;
  const span = hint < 0 ? SAMPLES : 60;
  for (let k = 0; k < span; k++) {
    const i = (from + k) % SAMPLES;
    const d = pos.distanceToSquared(trackPts[i]);
    if (d < bd) { bd = d; best = i; }
  }
  return best / SAMPLES;
}

/* ═══════════════════════════════════════════════════════════
   三、three.js 场景(粉紫晚霞色板,对齐猫岛)
   ═══════════════════════════════════════════════════════════ */
const cv = document.getElementById("cv");
const renderer = initRenderer(cv, { exposure: 1.08 });
const scene = new THREE.Scene();
scene.background = canvasTex(4, 256, (g) => {
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, "#b48ae0"); gr.addColorStop(0.4, "#e8a8d8");
  gr.addColorStop(0.66, "#ffc9d8"); gr.addColorStop(1, "#ffe3b8");
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
});
scene.background.colorSpace = THREE.SRGBColorSpace;
scene.fog = new THREE.Fog(0xe8c8ec, 90, 260);
const camera = new THREE.PerspectiveCamera(56, 16 / 9, 0.5, 500);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffe9f3, 0x7fb8d0, 1.0));
const sun = new THREE.DirectionalLight(0xffd9a8, 1.5);
sun.position.set(60, 80, -40);
scene.add(sun);

/* 地面 */
{
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(220, 40),
    new THREE.MeshStandardMaterial({ color: 0x8ed07a, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
}
/* 赛道带:TubeGeometry 压扁成柏油路面 + 红白条路缘 + 中央虚线 */
{
  const roadTex = canvasTex(128, 128, (g) => {
    g.fillStyle = "#6f6878"; g.fillRect(0, 0, 128, 128);
    for (let i = 0; i < 260; i++) {
      g.fillStyle = `rgba(${Math.random() < 0.5 ? "255,255,255" : "30,25,40"},${0.05 + Math.random() * 0.07})`;
      g.fillRect(Math.random() * 128, Math.random() * 128, 2 + Math.random() * 3, 2 + Math.random() * 3);
    }
  }, { wrap: true });
  roadTex.repeat.set(6, 40);
  const roadGeo = new THREE.TubeGeometry(curve, 420, HALF_W, 10, true);
  const pos = roadGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    if (pos.getY(i) > 0) pos.setY(i, 0.05);      // 地面以上全部压平(旧版留 0~2.1 肩部会成一圈灰墙)
  }
  const road = new THREE.Mesh(roadGeo,
    new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.95 }));
  scene.add(road);
  /* 红白条路缘:两侧交替色块(InstancedMesh ×2 色) */
  const curbGeo = new THREE.BoxGeometry(0.55, 0.22, 2.2);
  const curbRed = new THREE.MeshStandardMaterial({ color: 0xe05a5a, roughness: 0.9 });
  const curbWhite = new THREE.MeshStandardMaterial({ color: 0xf5efe4, roughness: 0.9 });
  const NCURB = 120;
  const curbsR = new THREE.InstancedMesh(curbGeo, curbRed, NCURB * 2);
  const curbsW = new THREE.InstancedMesh(curbGeo, curbWhite, NCURB * 2);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0);
  let ri = 0, wi = 0;
  for (let i = 0; i < SAMPLES; i += 3) {
    const sI = i % SAMPLES;
    const tp = trackPts[sI], tt = trackTan[sI];
    const yawQ = q.setFromAxisAngle(up, Math.atan2(tt.x, tt.z));
    for (const side of [-1, 1]) {
      const px = tp.x - tt.z * side * (HALF_W + 0.3), pz = tp.z + tt.x * side * (HALF_W + 0.3);
      const bucket = (i / 3 | 0) % 2 ? curbsR : curbsW;
      const idx = bucket === curbsR ? ri++ : wi++;
      bucket.setMatrixAt(idx, m4.compose(
        new THREE.Vector3(px, 0.1, pz), yawQ, new THREE.Vector3(1, 1, 1)));
    }
  }
  curbsR.count = ri; curbsW.count = wi;
  scene.add(curbsR, curbsW);
  /* 中央虚线 */
  const dashGeo = new THREE.BoxGeometry(0.18, 0.02, 1.6);
  const dashM = new THREE.MeshBasicMaterial({ color: 0xfff6ea });
  const dashes = new THREE.InstancedMesh(dashGeo, dashM, 100);
  let di = 0;
  for (let i = 0; i < SAMPLES && di < 100; i += 4) {
    const sI = i % SAMPLES;
    const tp = trackPts[sI], tt = trackTan[sI];
    dashes.setMatrixAt(di++, m4.compose(
      new THREE.Vector3(tp.x, 0.08, tp.z),
      q.setFromAxisAngle(up, Math.atan2(tt.x, tt.z)),
      new THREE.Vector3(1, 1, 1)));
  }
  dashes.count = di;
  scene.add(dashes);
}
/* 起跑线 + 日式门楼(两柱一梁,灯笼两盏) */
{
  const p0 = trackPts[0], t0 = trackTan[0];
  const line = new THREE.Mesh(new THREE.PlaneGeometry(HALF_W * 2, 1.6),
    new THREE.MeshBasicMaterial({ color: 0xffffff }));
  line.rotation.x = -Math.PI / 2;
  line.rotation.z = -Math.atan2(t0.z, t0.x);
  line.position.set(p0.x, 0.06, p0.z);
  scene.add(line);
  /* 棋盘格贴在起跑线上 */
  const checkTex = canvasTex(64, 16, (g) => {
    for (let x = 0; x < 8; x++) for (let y = 0; y < 2; y++) {
      g.fillStyle = (x + y) % 2 ? "#2b2233" : "#f5efe4";
      g.fillRect(x * 8, y * 8, 8, 8);
    }
  });
  const check = new THREE.Mesh(new THREE.PlaneGeometry(HALF_W * 2, 1.6),
    new THREE.MeshBasicMaterial({ map: checkTex }));
  check.rotation.x = -Math.PI / 2;
  check.rotation.z = line.rotation.z;
  check.position.set(p0.x, 0.07, p0.z);
  scene.add(check);
  /* 门楼 */
  const gateYaw = Math.atan2(t0.x, t0.z);
  const gx = p0.x, gz = p0.z;
  const postM = new THREE.MeshStandardMaterial({ color: 0xe06a5a, roughness: 0.8 });
  const beamM = new THREE.MeshStandardMaterial({ color: 0xd45a4a, roughness: 0.8 });
  const postG = new THREE.CylinderGeometry(0.28, 0.34, 6.4, 8);
  for (const side of [-1, 1]) {
    const post = new THREE.Mesh(postG, postM);
    post.position.set(gx - t0.z * side * (HALF_W + 0.9), 3.2, gz + t0.x * side * (HALF_W + 0.9));
    scene.add(post);
  }
  const beam = new THREE.Mesh(new THREE.BoxGeometry((HALF_W + 1.2) * 2, 0.5, 0.7), beamM);
  beam.position.set(gx, 6.4, gz);
  beam.rotation.y = gateYaw;
  scene.add(beam);
  const beam2 = beam.clone(); beam2.position.y = 5.6; beam2.scale.set(0.85, 0.7, 0.7);
  scene.add(beam2);
  /* 门楼灯笼 ×2 */
  const lanM = new THREE.MeshStandardMaterial({ color: 0xffe2a8, emissive: 0xffc878, emissiveIntensity: 0.75, roughness: 0.7 });
  const lanG = new THREE.CylinderGeometry(0.34, 0.34, 0.7, 8);
  for (const off of [-2.2, 2.2]) {
    const lan = new THREE.Mesh(lanG, lanM);
    lan.position.set(gx + t0.x * off, 5.0, gz - t0.z * off * -1);
    lan.position.x = gx + Math.sin(gateYaw) * off; lan.position.z = gz + Math.cos(gateYaw) * off;
    scene.add(lan);
  }
}
/* 街町房屋 + 灯笼柱(沿赛道外撒,避让赛道与树木) */
{
  const wallCols = [0xffe0ec, 0xe0f0ff, 0xfff3d9, 0xe8ffe0, 0xf3e0ff];
  const roofM = new THREE.MeshStandardMaterial({ color: 0x5a7a9a, roughness: 0.9 });
  const wallMats = wallCols.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.95 }));
  const NH = 29;
  const houseG = new THREE.BoxGeometry(1, 1, 1);
  const roofG = new THREE.ConeGeometry(0.78, 0.75, 4);
  const houses = wallMats.map(m => new THREE.InstancedMesh(houseG, m, 8));
  const roofs = new THREE.InstancedMesh(roofG, roofM, NH);
  const roofByHouse = [];
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0);
  const v = new THREE.Vector3(), s = new THREE.Vector3();
  const slot = new Array(wallMats.length).fill(0);
  let ri2 = 0;
  for (let i = 0; i < NH; i++) {
    if (i < 3) continue;                                // 起跑门楼附近不放房
    const side = i % 2 ? 1 : -1;
    const tp = trackPts[(i * 16 + 6) % SAMPLES], tt = trackTan[(i * 16 + 6) % SAMPLES];
    const dist = HALF_W + 10.5 + (i * 13 % 12);          // 房子离路远一档,别挡相机
    const x = tp.x + -tt.z * side * dist, z = tp.z + tt.x * side * dist;
    const wScl = 3 + (i % 3), hScl = 2.2 + (i % 4) * 0.7, dScl = 3 + ((i + 1) % 3);
    const mi = i % wallMats.length;
    houses[mi].setMatrixAt(slot[mi]++, m4.compose(
      v.set(x, hScl / 2, z), q.setFromAxisAngle(up, i * 1.3), s.set(wScl, hScl, dScl)));
    roofs.setMatrixAt(ri2, m4.compose(
      v.set(x, hScl + 0.34, z), q.setFromAxisAngle(up, i * 1.3 + Math.PI / 4),
      s.set(wScl * 0.82, 1, dScl * 0.82)));
    roofByHouse[ri2] = mi; ri2++;
  }
  houses.forEach((h, i) => h.count = slot[i]);
  roofs.count = ri2;
  scene.add(...houses, roofs);
  /* 灯笼柱:沿赛道每 40 样本一根 */
  const poleM = new THREE.MeshStandardMaterial({ color: 0x8a6a52, roughness: 1 });
  const lanM = new THREE.MeshStandardMaterial({ color: 0xffe2a8, emissive: 0xffc878, emissiveIntensity: 0.8, roughness: 0.7 });
  const poleG = new THREE.CylinderGeometry(0.08, 0.1, 2.4, 6);
  const lanG = new THREE.CylinderGeometry(0.22, 0.26, 0.42, 8);
  const poles = new THREE.InstancedMesh(poleG, poleM, 12);
  const lans = new THREE.InstancedMesh(lanG, lanM, 12);
  let li = 0;
  for (let i = 6; i < SAMPLES && li < 12; i += 35) {
    const sI = i % SAMPLES;
    const tp = trackPts[sI], tt = trackTan[sI];
    const side = (li % 2) ? 1 : -1;
    const x = tp.x - tt.z * side * (HALF_W + 1.4), z = tp.z + tt.x * side * (HALF_W + 1.4);
    poles.setMatrixAt(li, m4.compose(new THREE.Vector3(x, 1.2, z), q.identity(), s.set(1, 1, 1)));
    lans.setMatrixAt(li, m4.compose(new THREE.Vector3(x, 2.5, z), q, s.set(1, 1, 1)));
    li++;
  }
  poles.count = lans.count = li;
  scene.add(poles, lans);
}
/* 场景装点:樱树/松树剪影 + 几朵云(全是低模) */
{
  const trunkG = new THREE.CylinderGeometry(0.18, 0.26, 2, 6);
  const trunkM = new THREE.MeshStandardMaterial({ color: 0x8a6a52, roughness: 1 });
  const pinkM = new THREE.MeshStandardMaterial({ color: 0xffc4dd, roughness: 1 });
  const greenM = new THREE.MeshStandardMaterial({ color: 0x5da052, roughness: 1 });
  const ballG = new THREE.SphereGeometry(1, 10, 8);
  const trunks = new THREE.InstancedMesh(trunkG, trunkM, 46);
  const crownsP = new THREE.InstancedMesh(ballG, pinkM, 92);
  const crownsG = new THREE.InstancedMesh(ballG, greenM, 46);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), v = new THREE.Vector3();
  let ti = 0, pi = 0, gi = 0;
  for (let i = 0; i < 46; i++) {
    const side = i % 2 ? 1 : -1;
    const tp = trackPts[(i * 9 + 20) % SAMPLES];
    const tt = trackTan[(i * 9 + 20) % SAMPLES];
    const dist = HALF_W + 3.5 + (i * 7 % 9);
    const x = tp.x + -tt.z * side * dist, z = tp.z + tt.x * side * dist;
    const sc = 1 + (i % 3) * 0.3;
    trunks.setMatrixAt(ti++, m4.compose(v.set(x, 1, z), q, s.set(1, sc, 1)));
    const cm = i % 3 === 0 ? (gi++, crownsG) : (pi++, crownsP);
    cm.setMatrixAt((cm === crownsG ? gi - 1 : pi - 1),
      m4.compose(v.set(x, 2 + sc, z), q, s.set(sc * 1.6, sc * 1.2, sc * 1.6)));
  }
  crownsP.count = pi; crownsG.count = gi;
  scene.add(trunks, crownsP, crownsG);
}

/* ═══════════════════════════════════════════════════════════

  const pipeG = new THREE.CylinderGeometry(0.09, 0.12, 0.5, 8);

  const pipeL = new THREE.Mesh(pipeG, rimM);
  pipeL.position.set(-0.35, 0.45, -1.42);

  /* 车轮(带浅色轮毂盖) */
  const wheelG = new THREE.CylinderGeometry(0.34, 0.34, 0.26, 10);
  wheelG.rotateZ(Math.PI / 2);
  const hubG = new THREE.CylinderGeometry(0.17, 0.17, 0.28, 8);

  /* 座椅靠背 + 方向盘 */
  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.14), darkM);
  seat.position.set(0, 0.72, -0.35); seat.rotation.x = -0.12;

  const stWheel = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.035, 6, 14), darkM);
  stWheel.position.set(0, 0.74, 0.56); stWheel.rotation.x = 1.05;
  /* 骑手:小方块猫 + 圆头盔(带面罩条) */

  const head = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.52, 0.52), bodyM);
  head.position.set(0, 0.95, 0.1);
  if (cat.patch) {
    const patch = new THREE.Mesh(new THREE.BoxGeometry(0.64, 0.14, 0.54),

    patch.position.set(0, 1.2, 0.08); rider.add(patch);
  }
  const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.44, 12, 10),
    new THREE.MeshStandardMaterial({ color: isPlayer ? 0xffd56b : 0x5a7a9a, roughness: 0.35 }));
  helmet.position.set(0, 1.12, 0.05);

    new THREE.MeshStandardMaterial({ color: 0x8ad8e8, roughness: 0.2 }));

  g.add(chassis, nose, bumper, sideL, sideR, spoiler, spPostL, spPostR, pipeL, pipeR, seat, wheelPost, stWheel, rider);

/* ═══════════════════════════════════════════════════════════
   五、比赛状态与物理(固定 60Hz)
   ═══════════════════════════════════════════════════════════ */
const G = { mode: "menu", tick: 0, countdown: 4.4 * 60, raceT: 0, finished: [] };
function makeRacer(cat, isPlayer, gridIdx) {
  const u = (2.5 + gridIdx * 2.2) / TRACK_LEN;              // 起跑线前排队,发车即算第 1 圈
  const p = curve.getPointAt(((u % 1) + 1) % 1);
  const t = curve.getTangentAt(((u % 1) + 1) % 1);
  const side = (gridIdx % 2 ? 1 : -1) * 1.6;
  const vis = buildKart(cat, isPlayer);
  scene.add(vis.group);
  return {
    cat, isPlayer, vis,
    pos: new THREE.Vector3(p.x - t.z * side, 0, p.z + t.x * side),
    yaw: Math.atan2(t.x, t.z),
    vx: 0, vz: 0, speed: 0, y: 0, vy: 0, air: 0,
    steer: 0, drifting: false, driftT: 0, driftDir: 0, driftCharge: 0,
    boostT: 0, boostMul: 1, spinT: 0, rocketT: 0,
    item: null, itemCount: 0, itemCD: 0,
    lap: 0, prog: nearestProgress(new THREE.Vector3(p.x, 0, p.z)), lastProg: 0,
    aiTargetOff: (gridIdx % 3 - 1) * 1.1, aiSkill: 0.93 + (gridIdx % 5) * 0.015,
    gasCD: 0, bananas: [], gasClouds: [],
  };
}
let racers = [], player = null;
function startRace() {
  racers.forEach(r => scene.remove(r.vis.group));
  racers = []; G.finished = [];
  projectiles.length = 0; gasZones.length = 0;   // 清上一场的香蕉/尾气
  itemBoxes.forEach(ib => { ib.cooldown = 0; ib.mesh.visible = true; });
  const order = [...CATS.keys()];
  // 玩家固定陈皮,其余七猫电脑
  racers.push(makeRacer(CATS[0], true, 0));
  for (let i = 1; i < 8; i++) racers.push(makeRacer(CATS[i], false, i));
  player = racers[0];
  G.mode = "countdown"; G.tick = 0; G.countdown = 4.4 * 60; G.raceT = 0;
}

/* 道具定义 */
function rollItem(r) {
  const pool = ["rocket", "banana", "banana", "gas", "gas"];
  r.item = pool[(Math.random() * pool.length) | 0];
  r.itemCount = r.item === "rocket" ? 1 : 3;
  r.itemCD = 36;                                          // 0.6s 准备
  if (r.isPlayer) sfx.item();
}
const projectiles = [];   // {kind:'banana', x, z, vx, vz, owner, t}
const gasZones = [];      // {x, z, r, t, owner}

/* 物理 tick */
const tmpV = new THREE.Vector3();
function stepRacer(r, input) {
  if (r.spinT > 0) { r.spinT--; input = { gas: 0, steer: 0, drift: false, brake: 0 }; }
  /* —— 漂移状态机(致敬:arm→charge→release)—— */
  const spd = r.speed;
  if (r.rocketT > 0) {
    r.rocketT--;
    r.speed = Math.max(r.speed, K.topSpeed * 1.35);
    if (r.rocketT === 0) r.vy = -0.12;                    // 开始落回
  }
  const steerRate = spd > 0.3 ? K.steerHi : K.steerLo;
  let target = input.steer * steerRate;
  /* 漂移:Shift+转向 且有速度 */
  if (input.drift && spd > 0.2 && input.steer !== 0 && !r.drifting) {
    r.drifting = true; r.driftT = 0; r.driftDir = Math.sign(input.steer);
    r.vy = K.hopV;                                        // 起漂小跳
    if (r.isPlayer) sfx.hop();
  }
  if (r.drifting) {
    r.driftT++;
    target = r.driftDir * steerRate * (1.7 + input.steer * r.driftDir * 0.5);
    const charging = input.drift || r.driftT < K.driftArmTicks;
    if (!charging || spd < 0.15) {                           // 松 Shift:按蓄力放加速
      const lvl = r.driftCharge >= K.sparkTicks[2] ? 3 :
                  r.driftCharge >= K.sparkTicks[1] ? 2 :
                  r.driftCharge >= K.sparkTicks[0] ? 1 : 0;
      if (lvl > 0) {
        r.boostT = K.boostTime[lvl]; r.boostMul = K.boostMul[lvl];
        if (r.isPlayer) { sfx.boost(lvl); Nikki.Feel.hitStop(3); Nikki.Feel.shake(0.25); }
      }
      r.drifting = false; r.driftCharge = 0;
    } else {
      r.driftCharge = Math.min(K.sparkTicks[2] + 40, r.driftCharge + Math.abs(input.steer) * (spd / K.topSpeed) * 2.2);
    }
  }
  r.steer += (target - r.steer) * 0.25;
  /* —— 纵向 —— */
  let acc = 0;
  const boosting = r.boostT > 0;
  if (boosting) { r.boostT--; if (r.boostT === 0) r.boostMul = 1; }
  const top = K.topSpeed * r.boostMul * (r.isPlayer ? 1 : r.aiSkill);
  if (input.gas) acc = K.accel * (boosting ? 1.8 : 1);   // 漂移中照样给油(参考原作手感)
  if (input.brake) acc = spd > 0.03 ? -K.brake : (spd > K.revMax ? -K.accel * 0.6 : 0);
  acc -= K.roll * spd;
  acc -= K.aero * spd * spd * (boosting ? 0.55 : 1);
  if (spd < top || acc < 0) r.speed = Math.max(K.revMax, spd + acc);
  else r.speed = top;
  /* —— 车身朝向与位移(漂移侧滑简化:速度方向滞后车头)—— */
  r.yaw += r.steer * (0.6 + Math.min(0.4, spd / K.topSpeed * 0.4));
  if (r.spinT > 0) r.yaw += 0.24;
  const grip = r.drifting ? K.driftGripOut : (r.spinT > 0 ? 0.02 : 0.14);
  const cos = Math.cos(r.yaw), sin = Math.sin(r.yaw);
  const vHeadX = sin * r.speed, vHeadZ = cos * r.speed;
  r.vx += (vHeadX - r.vx) * (r.drifting ? K.driftGripOut : 0.22);
  r.vz += (vHeadZ - r.vz) * (r.drifting ? K.driftGripOut : 0.22);
  if (r.spinT > 0) { r.vx *= 0.94; r.vz *= 0.94; }
  r.pos.x += r.vx; r.pos.z += r.vz;
  /* —— 垂直:跳/火箭 —— */
  if (r.y > 0 || r.vy !== 0) {
    r.vy -= K.gravity * 60 * TICK; r.y += r.vy;
    if (r.y <= 0) { r.y = 0; r.vy = 0; }
  }
  /* —— 赛道边界:软墙拉回 —— */
  const prog = nearestProgress(r.pos, r.prog);
  const i = Math.floor(prog * SAMPLES) % SAMPLES;
  const cp = trackPts[i], ct = trackTan[i];
  const dx = r.pos.x - cp.x, dz = r.pos.z - cp.z;
  const lateral = dx * -ct.z + dz * ct.x;
  if (Math.abs(lateral) > HALF_W - 0.6 && r.y < 0.5) {
    const over = Math.abs(lateral) - (HALF_W - 0.6);
    const sign = Math.sign(lateral);
    r.pos.x -= -ct.z * sign * over * 0.4;
    r.pos.z -= ct.x * sign * over * 0.4;
    r.speed *= 0.985;
    if (r.isPlayer && over > 0.5 && G.tick % 9 === 0) sfx.wall();
  }
  /* —— 圈数 —— */
  const d = prog - r.lastProg;
  if (d < -0.5 && r.lastProg > 0.75) {                  // 正向跨线(带迟滞:须先远离线)
    r.lap++;
    if (r.isPlayer) {
      sfx.lap(r.lap);
      if (r.lap >= K.laps) finishRacer(r);
    } else if (r.lap >= K.laps) finishRacer(r);
  } else if (d > 0.5 && r.lap > 0) r.lap--;                  // 倒穿修正(未完成首圈不扣)
  r.lastProg = prog; r.prog = prog;
  /* —— 道具盒拾取 —— */
  if (r.itemCD > 0) r.itemCD--;
  if (!r.item && r.itemCD === 0) {
    for (const ib of itemBoxes) {
      if (ib.cooldown > 0) continue;
      if (Math.hypot(r.pos.x - ib.x, r.pos.z - ib.z) < 1.5 && r.y < 1) {
        ib.cooldown = K.itemRespawn; ib.mesh.visible = false;
        rollItem(r);
        break;
      }
    }
  }
}
function finishRacer(r) {
  if (G.finished.includes(r)) return;
  G.finished.push(r);
  if (r.isPlayer) {
    G.mode = "over";
    const place = G.finished.length;
    const coins = Math.max(20, 260 - place * 45);
    Nikki.Wallet.add(coins);
    const gain = Nikki.Daily.report("kart", { place });
    const old = Nikki.jget("nikki_kart_best", 99);
    if (place < old) Nikki.jset("nikki_kart_best", place);
    sfx.win();
    const ov = document.getElementById("overlay");
    ov.innerHTML = `<h2>${place === 1 ? "🏆 冠军猫!" : place <= 3 ? "🥈🥉 上领奖台!" : "🏁 完赛!"}</h2>
      <p>${r.cat.name} 获得 <b>第 ${place} 名</b> · 全场 ${G.finished.length}/8<br>
      结算:<b>+${coins}</b> 金币${gain ? ` · 每日挑战完成 +${gain}!` : ""}</p>
      <button onclick="location.reload()">🔁 再跑一场</button>`;
    ov.style.display = "flex";
  }
}

/* AI:沿赛道目标点开 + 会用香蕉(简化:不用道具) */
function aiInput(r) {
  const look = (Math.floor(r.prog * SAMPLES) + 26) % SAMPLES;
  const tp = trackPts[look], tt = trackTan[look];
  const tx = tp.x + -tt.z * r.aiTargetOff, tz = tp.z + tt.x * r.aiTargetOff;
  const want = Math.atan2(tx - r.pos.x, tz - r.pos.z);
  let d = want - r.yaw;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  const steer = Math.max(-1, Math.min(1, d * 2.2));
  const sharp = Math.abs(steer) > 0.35 && r.speed > 0.34; // 平滑赛道阈值放宽,电脑猫也会漂
  return { gas: 1, steer, drift: sharp,
           brake: (Math.abs(steer) > 0.9 && r.speed > 0.4) ? 1 : 0 };
}

/* 道具使用与弹道 */
function useItem(r) {
  if (!r.item || r.itemCD > 0 || r.itemCount <= 0) return;
  r.itemCount--;
  const cos = Math.cos(r.yaw), sin = Math.sin(r.yaw);
  if (r.item === "rocket") {
    r.rocketT = K.rocketTicks; r.vy = 0.09;
    if (r.isPlayer) { sfx.rocket(); Nikki.Feel.shake(0.4); }
  } else if (r.item === "banana") {
    projectiles.push({ kind: "banana", x: r.pos.x + sin * 2.5, z: r.pos.z + cos * 2.5, vx: sin * r.speed * 0.8, vz: cos * r.speed * 0.8, owner: r, t: 0 });
    if (r.isPlayer) sfx.throw();
  } else if (r.item === "gas") {
    r.gasCD = K.rocketTicks;                               // 1.5s 内持续放
    if (r.isPlayer) sfx.gas();
  }
  if (r.itemCount <= 0) { r.item = null; r.itemCD = 0; }
}
function stepProjectiles() {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.t++;
    if (p.t < 40) { p.x += p.vx * 0.06; p.z += p.vz * 0.06; p.vx *= 0.965; p.vz *= 0.965; }
    /* 命中判定 */
    for (const r of racers) {
      if (r === p.owner || r.y > 1.2) continue;
      if (Math.hypot(r.pos.x - p.x, r.pos.z - p.z) < 1.4) {
        r.spinT = K.spinTicks;
        if (r.isPlayer) { sfx.hit(); Nikki.Feel.shake(0.5); Nikki.Feel.hitStop(4); }
        projectiles.splice(i, 1);
        break;
      }
    }
    if (projectiles[i] === p && p.t > 360) projectiles.splice(i, 1);
  }
  /* 尾气带 */
  for (let i = gasZones.length - 1; i >= 0; i--) {
    if (--gasZones[i].t <= 0) gasZones.splice(i, 1);
  }
  for (const r of racers) {
    if (r.gasCD > 0) {
      r.gasCD--;
      if (G.tick % 6 === 0) gasZones.push({ x: r.pos.x, z: r.pos.z, r: 2.2, t: 120, owner: r });
    }
    for (const gz of gasZones) {
      if (gz.owner === r || r.y > 1.2 || r.spinT > 0) continue;
      if (Math.hypot(r.pos.x - gz.x, r.pos.z - gz.z) < gz.r + 0.8) {
        r.spinT = K.spinTicks; if (r.isPlayer) sfx.hit();
      }
    }
  }
  /* 车车碰撞(轻推) */
  for (let a = 0; a < racers.length; a++) for (let b = a + 1; b < racers.length; b++) {
    const A = racers[a], B = racers[b];
    if (A.y > 1 || B.y > 1) continue;
    const dx = B.pos.x - A.pos.x, dz = B.pos.z - A.pos.z;
    const d = Math.hypot(dx, dz);
    if (d < 1.7 && d > 0.01) {
      const push = (1.7 - d) / 2;
      A.pos.x -= dx / d * push; A.pos.z -= dz / d * push;
      B.pos.x += dx / d * push; B.pos.z += dz / d * push;
      if ((A.isPlayer || B.isPlayer) && G.tick % 12 === 0) sfx.wall();
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   六、音效(Web Audio 合成)
   ═══════════════════════════════════════════════════════════ */
let AC = null;
function tone(f0, f1, dur, type = "square", vol = 0.12) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}
const sfx = {
  hop: () => tone(300, 500, .08, "square", .08),
  boost: lvl => tone(220 + lvl * 120, 880 + lvl * 200, .25, "sawtooth", .1),
  wall: () => tone(180, 120, .05, "square", .07),
  item: () => [520, 660, 780].forEach((f, i) => setTimeout(() => tone(f, f, .07, "triangle", .1), i * 60)),
  rocket: () => tone(120, 720, .5, "sawtooth", .12),
  throw: () => tone(500, 300, .1, "triangle", .1),
  gas: () => tone(200, 90, .3, "sawtooth", .06),
  hit: () => tone(400, 80, .3, "square", .13),
  lap: n => [660, 880].forEach((f, i) => setTimeout(() => tone(f, f, .1, "triangle", .12), i * 110)),
  win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, f, .18, "triangle", .13), i * 130)),
};

/* ═══════════════════════════════════════════════════════════
   七、主循环:Nikki.Feel 固定 60Hz + 渲染
   ═══════════════════════════════════════════════════════════ */
const lapEl = document.getElementById("lap"), spdEl = document.getElementById("spd"),
      posEl = document.getElementById("pos"), msgEl = document.getElementById("msg"),
      itemEl = document.getElementById("item");
function update() {
  if (G.mode !== "race" && G.mode !== "countdown") return;
  G.tick++;
  if (G.mode === "countdown") {
    G.countdown--;
    const n = Math.ceil(G.countdown / 60);
    msgEl.textContent = G.countdown > 60 ? `${n - 1}...` : "GO!🐱💨";
    if (G.countdown === 60) sfx.boost(3);
    if (G.countdown <= 0) { G.mode = "race"; msgEl.textContent = ""; }
    return;
  }
  G.raceT++;
  /* 输入 */
  const pIn = {
    gas: keys["arrowup"] || keys["w"] || keys["gas"] ? 1 : 0,
    brake: keys["arrowdown"] || keys["s"] ? 1 : 0,
    steer: (keys["arrowright"] || keys["d"] || keys["right"] ? 1 : 0) - (keys["arrowleft"] || keys["a"] || keys["left"] ? 1 : 0),
    drift: !!(keys["shift"] || keys["drift"]),
  };
  if ((keys[" "] || keys["e"]) && player.item && !G._itemKey) useItem(player);
  G._itemKey = !!(keys[" "] || keys["e"]);
  stepRacer(player, pIn);
  for (let i = 1; i < racers.length; i++) stepRacer(racers[i], aiInput(racers[i]));
  stepProjectiles();
  for (const ib of itemBoxes) {
    if (ib.cooldown > 0 && --ib.cooldown === 0) ib.mesh.visible = true;
  }
}
function draw(alpha) {
  if (!player) return;
  /* 车体可视 */
  for (const r of racers) {
    const v = r.vis;
    v.group.position.set(r.pos.x, r.y, r.pos.z);
    v.group.rotation.y = r.yaw;
    const sp = r.speed;
    v.wheels.forEach(w => w.rotation.x += sp * 0.09);
    const lean = r.drifting ? r.driftDir * 0.14 : -r.steer * 0.5 * 0.1;
    v.group.rotation.z += (lean - v.group.rotation.z) * 0.2;
    if (r.rocketT > 0) v.group.rotation.x = -0.18; else v.group.rotation.x += (0 - v.group.rotation.x) * 0.2;
    /* 漂移火花色:骑手头顶光点 */
  }
  /* 相机追尾 */
  const p = player;
  const back = 7.2, height = 3.4;
  const cx = p.pos.x - Math.sin(p.yaw) * back, cz = p.pos.z - Math.cos(p.yaw) * back;
  camera.position.lerp(tmpV.set(cx, p.y + height, cz), 0.12);
  camera.lookAt(p.pos.x + Math.sin(p.yaw) * 6, p.y + 1, p.pos.z + Math.cos(p.yaw) * 6);
  /* boost 视野踢(速度感) */
  const wantFov = (p.boostT > 0 || p.rocketT > 0) ? 64 : (Math.abs(p.speed) > K.topSpeed * 0.92 ? 59 : 56);
  camera.fov += (wantFov - camera.fov) * 0.08;
  camera.updateProjectionMatrix();
  /* 弹道可视(香蕉/尾气挂到场景 lazily) */
  syncVisuals();
  updateFX();
  drawMinimap();
  /* HUD */
  lapEl.textContent = `🏁 圈 ${Math.min(p.lap + 1, K.laps)}/${K.laps}`;
  spdEl.textContent = `${Math.round(Math.abs(p.speed) * 216)} km/h`;   // tick 速度 → km/h
  const rank = 1 + racers.filter(o =>
    o !== p && (o.lap > p.lap || (o.lap === p.lap && o.prog > p.prog))).length;
  posEl.textContent = `第 ${rank} 名`;
  const iconName = { rocket: "🚀", banana: "🍌", gas: "💨" }[p.item] || "?";
  itemEl.textContent = p.item ? iconName + (p.itemCount > 1 ? p.itemCount : "") : "?";
  itemEl.classList.toggle("ready", !!p.item && p.itemCD === 0);
}
/* 香蕉/尾气可视化(实例化简单 mesh) */
let bananaIM = null, gasIM = null;
function syncVisuals() {
  if (!bananaIM) {
    bananaIM = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.22, 0.28, 1.1, 7),
      new THREE.MeshStandardMaterial({ color: 0xffe135, roughness: 0.7 }), 12);
    gasIM = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0xd9c26a, transparent: true, opacity: 0.4, roughness: 1 }), 60);
    bananaIM.count = 0; gasIM.count = 0;
    scene.add(bananaIM, gasIM);
  }
  const m4 = new THREE.Matrix4(), s = new THREE.Vector3(1, 1, 1), q = new THREE.Quaternion();
  let bi = 0;
  for (const p of projectiles) {
    if (bi >= 12) break;
    bananaIM.setMatrixAt(bi++, m4.compose(new THREE.Vector3(p.x, 0.4, p.z), q, s));
  }
  bananaIM.count = bi; bananaIM.instanceMatrix.needsUpdate = true;
  let gi = 0;
  for (const gz of gasZones) {
    if (gi >= 60) break;
    gasIM.setMatrixAt(gi++, m4.compose(new THREE.Vector3(gz.x, 0.5, gz.z), q,
      new THREE.Vector3(gz.r * 0.8, 0.5, gz.r * 0.8)));
  }
  gasIM.count = gi; gasIM.instanceMatrix.needsUpdate = true;
}

/* ═══════════════════════════════════════════════════════════
   六.5、漂移特效:三段火花环 + 轮烟 + boost 尾焰 + 小地图 + 引擎声
   ═══════════════════════════════════════════════════════════ */
/* 火花环:贴在玩家车底,蓄力变色(蓝→橙→红) */
const sparkRing = new THREE.Mesh(
  new THREE.TorusGeometry(1.15, 0.09, 8, 24),
  new THREE.MeshBasicMaterial({ color: 0x8ad8ff, transparent: true, opacity: 0 }));
sparkRing.rotation.x = -Math.PI / 2;
sparkRing.visible = false;
scene.add(sparkRing);
const TIER_COL = [0x8ad8ff, 0x8ad8ff, 0xffb03a, 0xff5b5b];
/* 轮烟池:24 片 sprite,漂移时从后轮冒 */
const smokeTex = canvasTex(64, 64, (g) => {
  const rg = g.createRadialGradient(32, 32, 4, 32, 32, 30);
  rg.addColorStop(0, "rgba(245,240,250,.75)"); rg.addColorStop(1, "rgba(245,240,250,0)");
  g.fillStyle = rg; g.fillRect(0, 0, 64, 64);
});
const smokes = [];
for (let i = 0; i < 24; i++) {
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex, transparent: true, opacity: 0, depthWrite: false }));
  spr.visible = false;
  scene.add(spr);
  smokes.push({ spr, life: 0, x: 0, z: 0, vy: 0 });
}
let smokeCur = 0;
function puffSmoke(x, z) {
  const s = smokes[smokeCur = (smokeCur + 1) % smokes.length];
  s.life = 36; s.x = x + (Math.random() - 0.5) * 1.2; s.z = z + (Math.random() - 0.5) * 1.2;
  s.vy = 0.5 + Math.random() * 0.4;
  s.spr.visible = true;
}
/* boost 尾焰:两锥挂在排气位置,仅 boost 时可见 */
const flameM = new THREE.MeshBasicMaterial({ color: 0xffb03a, transparent: true, opacity: 0.85 });
const flameG = new THREE.ConeGeometry(0.16, 0.9, 8);
flameG.rotateX(Math.PI / 2);
const flames = [new THREE.Mesh(flameG, flameM.clone()), new THREE.Mesh(flameG, flameM.clone())];
flames.forEach(f => { f.visible = false; scene.add(f); });
let flameT = 0;
/* 小地图:静态赛道路径 + 动态车点 */
const mmCv = document.getElementById("minimap"), mmCtx = mmCv.getContext("2d");
let mmBase = null;
function drawMinimap() {
  if (!mmBase) {
    mmBase = document.createElement("canvas"); mmBase.width = mmBase.height = 150;
    const g = mmBase.getContext("2d");
    let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
    for (const p of trackPts) {
      minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
      minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z);
    }
    const pad = 12, sc = Math.min((150 - pad * 2) / (maxX - minX), (150 - pad * 2) / (maxZ - minZ));
    window.__mmMap = (x, z) => [pad + (x - minX) * sc + (150 - pad * 2 - (maxX - minX) * sc) / 2,
                                pad + (z - minZ) * sc + (150 - pad * 2 - (maxZ - minZ) * sc) / 2];
    g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = 5; g.lineCap = "round";
    g.beginPath();
    trackPts.forEach((p, i) => {
      const [mx, my] = window.__mmMap(p.x, p.z);
      i ? g.lineTo(mx, my) : g.moveTo(mx, my);
    });
    g.closePath(); g.stroke();
    g.fillStyle = "#ffd76e";
    const [sx, sy] = window.__mmMap(trackPts[0].x, trackPts[0].z);
    g.fillRect(sx - 3, sy - 3, 6, 6);
  }
  mmCtx.clearRect(0, 0, 150, 150);
  mmCtx.drawImage(mmBase, 0, 0);
  if (!racers.length) return;
  const cols = { chenpi: "#ff6b9d", baozi: "#fff5f0", niannian: "#ffb38a", songlu: "#6b4a3a", youyu: "#ffc9a0", jinzhang: "#9aa7b8", daer: "#ff9e5e", ali: "#d9776e" };
  for (const r of racers) {
    const [mx, my] = window.__mmMap(r.pos.x, r.pos.z);
    mmCtx.fillStyle = cols[r.cat.id] || "#fff";
    mmCtx.beginPath(); mmCtx.arc(mx, my, r.isPlayer ? 5 : 3.2, 0, 6.29); mmCtx.fill();
    if (r.isPlayer) { mmCtx.strokeStyle = "#fff"; mmCtx.lineWidth = 1.6; mmCtx.stroke(); }
  }
}
/* 引擎声:锯齿波随速爬升 + 漂移嘶嘶声 */
let engineOsc = null, engineGain = null;
function ensureEngine() {
  if (engineOsc || !AC) return;
  try {
    engineOsc = AC.createOscillator(); engineGain = AC.createGain();
    engineOsc.type = "sawtooth"; engineOsc.frequency.value = 50;
    engineGain.gain.value = 0;
    const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 480;
    engineOsc.connect(lp).connect(engineGain).connect(AC.destination);
    engineOsc.start();
  } catch (e) { engineOsc = null; }
}
function updateEngine() {
  if (!engineGain || !player) return;
  const on = G.mode === "race" || G.mode === "countdown";
  const f = 55 + Math.abs(player.speed) * 11 + (player.boostT > 0 ? 40 : 0);
  engineOsc.frequency.value = f;
  engineGain.gain.value += ((on && Math.abs(player.speed) > 0.3 ? 0.045 : 0) - engineGain.gain.value) * 0.1;
}
let lastScreech = 0;
function updateFX() {
  const p = player;
  if (!p) return;
  /* 火花环 */
  const tier = p.driftCharge >= K.sparkTicks[2] ? 3 : p.driftCharge >= K.sparkTicks[1] ? 2 : p.driftCharge >= K.sparkTicks[0] ? 1 : 0;
  sparkRing.visible = p.drifting;
  if (p.drifting) {
    sparkRing.position.set(p.pos.x, 0.12, p.pos.z);
    sparkRing.material.color.setHex(TIER_COL[tier]);
    sparkRing.material.opacity = 0.55 + Math.sin(G.tick * 0.4) * 0.25;
    sparkRing.rotation.z = G.tick * 0.15;
    if (G.tick % 4 === 0) puffSmoke(p.pos.x - Math.sin(p.yaw) * 1.1, p.pos.z - Math.cos(p.yaw) * 1.1);
    if (G.tick - lastScreech > 10) { lastScreech = G.tick; tone(160 + tier * 40, 120, 0.08, "square", 0.04); }
  }
  /* 轮烟 */
  for (const s of smokes) {
    if (s.life <= 0) continue;
    s.life--;
    s.spr.position.set(s.x, 0.35 + (36 - s.life) * 0.02, s.z);
    const sc = 0.6 + (36 - s.life) * 0.045;
    s.spr.scale.set(sc, sc, 1);
    s.spr.material.opacity = s.life / 36 * 0.5;
    if (s.life === 0) s.spr.visible = false;
  }
  /* 尾焰 */
  const boosting = p.boostT > 0 || p.rocketT > 0;
  flames.forEach((f, i) => {
    f.visible = boosting;
    if (boosting) {
      const lx = i ? 0.35 : -0.35;                        // 排气局部横向位置
      f.position.set(p.pos.x + Math.sin(p.yaw) * -1.4 + Math.cos(p.yaw) * lx,
                     0.45 + p.y, p.pos.z + Math.cos(p.yaw) * -1.4 - Math.sin(p.yaw) * lx);
      f.rotation.y = p.yaw;
      f.scale.setScalar(0.8 + Math.sin(G.tick * 0.8 + i) * 0.25);
      f.material.color.setHex(p.rocketT > 0 ? 0x8ad8ff : 0xffb03a);
    }
  });
  if (boosting && G.tick % 2 === 0) puffSmoke(p.pos.x - Math.sin(p.yaw) * 1.6, p.pos.z - Math.cos(p.yaw) * 1.6);
  updateEngine();
}

Nikki.Feel.play(update, () => { draw(); renderer.render(scene, camera); });

/* 开始 */
document.getElementById("btn-start").onclick = () => {
  if (!AC) tone(1, 1, .01);
  ensureEngine();
  document.getElementById("overlay").style.display = "none";
  startRace();
};

/* ═══════════════════════════════════════════════════════════
   八、测试钩子:rAF 冻结时确定性驱动
   __kart.step(n):跑 n 个逻辑 tick(含渲染一次)
   __kart.G / racers / autopilot():自动驾驶完赛
   ═══════════════════════════════════════════════════════════ */
window.__kart = {
  G, get racers() { return racers; }, get player() { return player; },
  startRace, trackPts, trackTan, HALF_W,
  autopilot: true,
  step(n = 1) {
    for (let i = 0; i < n; i++) {
      if (window.__kart.autopilot && player && G.mode === "race") {
        const inp = aiInput(player); inp.gas = 1;
        keys["arrowup"] = false;                          // 防真输入干扰
        Object.assign(keys, {});
        // 直接调 stepRacer 绕过输入层
        stepRacer(player, inp);
        for (let k = 1; k < racers.length; k++) stepRacer(racers[k], aiInput(racers[k]));
        stepProjectiles();
        G.raceT++; G.tick++;
        for (const ib of itemBoxes) if (ib.cooldown > 0 && --ib.cooldown === 0) ib.mesh.visible = true;
      } else update();
    }
    draw(); renderer.render(scene, camera);
    return { mode: G.mode, tick: G.tick };
  },
};
</script>
