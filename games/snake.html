<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐍 猫吃小鱼 · Nikki 游戏合集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8E%80%3C/text%3E%3C/svg%3E">
<style>
  :root { --hk-pink: #ff9ec4; --hk-deep: #ff6b9d; --hk-red: #e94560; --hk-muted: #c98ba0; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
  body {
    font-family: "Nunito", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #8b4a5e;
    background: linear-gradient(135deg, #ffd6e8 0%, #ffeef4 40%, #fff9fb 100%) fixed;
    min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding: 14px;
  }
  .top { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
  .hud {
    background: rgba(255,255,255,0.9); border: 2px solid rgba(255,158,196,0.5);
    border-radius: 14px; padding: 5px 16px; text-align: center;
    box-shadow: 0 3px 0 -1px #f3b7cc;
  }
  .hud .l { font-size: 10px; color: var(--hk-muted); font-weight: 800; }
  .hud .v { font-size: 18px; font-weight: 800; color: var(--hk-deep); }
  .home {
    text-decoration: none; font-size: 13px; font-weight: 800; color: var(--hk-deep);
    background: #fff; border: 2px solid rgba(255,158,196,0.5); border-radius: 12px; padding: 8px 14px;
    box-shadow: 0 3px 0 -1px #f3b7cc;
  }
  canvas {
    border-radius: 20px;
    border: 4px solid rgba(255,158,196,0.6);
    box-shadow: 0 8px 0 -2px #f3b7cc, 0 18px 30px rgba(255,158,196,0.35);
    background: #fff6fa;
    touch-action: none;
  }
  .tip { margin-top: 12px; font-size: 12px; font-weight: 800; color: var(--hk-muted); text-align: center; line-height: 1.7; }
  /* 方向键(移动端) */
  .pad { margin-top: 14px; display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 48px); gap: 8px; }
  .pad button {
    border: none; cursor: pointer; font-size: 20px;
    border-radius: 14px; color: #fff;
    background: linear-gradient(135deg, var(--hk-deep), var(--hk-pink));
    box-shadow: 0 4px 0 -1px #d15683;
  }
  .pad button:active { transform: translateY(3px); box-shadow: none; }
  .pad .blank { visibility: hidden; }
  .pad .wide { grid-column: span 3; font-size: 14px; }
  /* 弹窗 */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(255,158,196,0.4); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
  }
  .overlay.show { display: flex; }
  .modal {
    background: linear-gradient(160deg, #fff5f8, #fff);
    border: 3px solid rgba(255,158,196,0.6);
    border-radius: 24px; padding: 30px 36px; text-align: center;
    box-shadow: 0 16px 40px rgba(255,107,157,0.35);
    animation: pop 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop { from { transform: scale(0.7); } }
  .modal .e { font-size: 52px; }
  .modal h2 { color: var(--hk-deep); margin: 6px 0; }
  .modal p { color: var(--hk-muted); font-size: 14px; margin-bottom: 16px; }
  .btn {
    border: none; cursor: pointer; font-family: inherit;
    font-size: 14px; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, var(--hk-deep), var(--hk-pink));
    padding: 10px 26px; border-radius: 99px; margin: 0 5px;
    box-shadow: 0 4px 0 -1px #d15683;
  }
  .btn.sec { background: #fff; color: var(--hk-deep); border: 2px solid var(--hk-pink); box-shadow: 0 3px 0 -1px #f3b7cc; text-decoration: none; display: inline-block; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="top">
    <a class="home" href="../index.html">🏠 大厅</a>
    <div class="hud"><div class="l">分数</div><div class="v" id="hud-score">0</div></div>
    <div class="hud"><div class="l">最高</div><div class="v" id="hud-best">0</div></div>
  </div>

  <canvas id="cv" width="360" height="360"></canvas>
  <div class="tip">方向键 / WASD / 滑动屏幕 控制 · 空格暂停</div>

  <div class="pad">
    <button class="blank"></button>
    <button onclick="setDir(0,-1)">⬆</button>
    <button class="blank"></button>
    <button onclick="setDir(-1,0)">⬅</button>
    <button onclick="setDir(1,0)">➡</button>
    <button onclick="setDir(0,1)">⬇</button>
    <button class="wide" onclick="togglePause()">⏸ 暂停 / 继续</button>
  </div>

  <div class="overlay" id="over">
    <div class="modal">
      <div class="e">😿</div>
      <h2>游戏结束</h2>
      <p id="over-detail"></p>
      <button class="btn" onclick="restart()">🔄 再来一局</button>
      <a class="btn sec" href="../index.html">🏠 回大厅</a>
    </div>
  </div>

<script src="../shared/common.js"></script>
<script>
// ===== 猫吃小鱼(贪吃蛇)=====
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const N = 18, CELL = 20;                    // 18×18 格,每格 20px
let snake, dir, nextDir, food, score, speed, loop, paused, dead;

function get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function reset() {
  snake = [{ x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 }];
  dir = { x: 1, y: 0 }; nextDir = dir;
  score = 0; speed = 160; paused = false; dead = false;
  placeFood();
  document.getElementById("hud-score").textContent = 0;
  document.getElementById("over").classList.remove("show");
  clearInterval(loop);
  loop = setInterval(step, speed);
  draw();
}

function placeFood() {
  do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}

function setDir(x, y) {
  // 禁止 180° 掉头
  if (dir.x + x === 0 && dir.y + y === 0) return;
  nextDir = { x, y };
}

function togglePause() { if (!dead) paused = !paused; }

function step() {
  if (paused || dead) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  // 撞墙 / 撞自己
  if (head.x < 0 || head.x >= N || head.y < 0 || head.y >= N ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    // 吃到鱼:加分 + 变速
    score += 10;
    document.getElementById("hud-score").textContent = score;
    placeFood();
    if (speed > 80) { speed -= 4; clearInterval(loop); loop = setInterval(step, speed); }
    beep(900, 0.08, "triangle", 0.1);
  } else {
    snake.pop();
  }
  draw();
}

function gameOver() {
  dead = true;
  clearInterval(loop);
  beep(300, 0.25, "sawtooth", 0.12);
  const best = get("nikki_snake_best", 0);
  let isBest = false;
  if (score > best) { set("nikki_snake_best", score); isBest = true; document.getElementById("hud-best").textContent = score; }
  // 💰 金币入账 + 📅 每日挑战 + 🐱 图鉴
  const coins = Math.floor(score / 5);
  Nikki.Wallet.add(coins);
  const dailyGain = Nikki.Daily.report("snake", { score });
  const fresh = Nikki.Dex.check({ snakeScore: score });
  Nikki.announce(fresh);
  document.getElementById("over-detail").innerHTML =
    `本局 <b>${score}</b> 分 · 吃了 <b>${(score / 10) | 0}</b> 条小鱼 · 💰 <b>+${coins}</b><br>` +
    (dailyGain ? `📅 每日挑战完成!+${dailyGain.reward} 金币<br>` : "") +
    (isBest ? "🏆 <b>新纪录!</b>" : `最高纪录:${best} 分`);
  document.getElementById("over").classList.add("show");
}

// ===== 绘制 =====
function draw() {
  // 背景
  ctx.fillStyle = "#fff6fa";
  ctx.fillRect(0, 0, 360, 360);
  ctx.strokeStyle = "rgba(255,158,196,0.15)";
  for (let i = 1; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, 360); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(360, i * CELL); ctx.stroke();
  }
  // 小鱼(食物):身体 + 尾巴
  ctx.font = "16px serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("🐟", food.x * CELL + 10, food.y * CELL + 11);
  // 蛇身:粉色圆角串
  snake.forEach((s, i) => {
    const t = 1 - i / (snake.length + 4);
    ctx.fillStyle = i === 0 ? "#ff6b9d" : `rgba(255,${130 + Math.round(60 * t)},${170 + Math.round(40 * t)},0.95)`;
    ctx.beginPath();
    ctx.roundRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4, i === 0 ? 9 : 7);
    ctx.fill();
  });
  // 蛇头:猫耳 + 眼睛
  const h = snake[0], hx = h.x * CELL, hy = h.y * CELL;
  const ex = dir.x, ey = dir.y;
  ctx.fillStyle = "#ff6b9d";
  // 耳朵(朝运动方向两侧)
  const cx = hx + 10 + ex * 4, cy = hy + 10 + ey * 4;
  const px = -ey, py = ex;   // 垂直向量
  ctx.beginPath(); ctx.moveTo(cx + px * 6, cy + py * 6); ctx.lineTo(cx + px * 9, cy + py * 9 - 6); ctx.lineTo(cx + px * 1, cy + py * 1 - 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx - px * 6, cy - py * 6); ctx.lineTo(cx - px * 9, cy - py * 9 - 6); ctx.lineTo(cx - px * 1, cy - py * 1 - 2); ctx.fill();
  // 眼睛
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(cx + px * 4, cy + py * 4, 2.6, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(cx - px * 4, cy - py * 4, 2.6, 0, 7); ctx.fill();
  ctx.fillStyle = "#333";
  ctx.beginPath(); ctx.arc(cx + px * 4.6, cy + py * 4.6, 1.2, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(cx - px * 3.4, cy - py * 3.4, 1.2, 0, 7); ctx.fill();
  // 暂停遮罩
  if (paused) {
    ctx.fillStyle = "rgba(255,240,248,0.75)";
    ctx.fillRect(0, 0, 360, 360);
    ctx.fillStyle = "#ff6b9d";
    ctx.font = "bold 28px Nunito, sans-serif";
    ctx.fillText("⏸ 暂停中", 180, 180);
  }
}

// ===== 音效(Web Audio 简易) =====
let ac = null;
function ensureAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === "suspended") ac.resume(); }
function beep(f, d, t, v) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = t; o.frequency.value = f;
  g.gain.setValueAtTime(v, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + d);
}

// ===== 输入 =====
function keyHandler(e) {
  ensureAudio();
  const k = e.key.toLowerCase();
  if (k === "arrowup" || k === "w") setDir(0, -1);
  else if (k === "arrowdown" || k === "s") setDir(0, 1);
  else if (k === "arrowleft" || k === "a") setDir(-1, 0);
  else if (k === "arrowright" || k === "d") setDir(1, 0);
  else if (k === " ") { e.preventDefault(); togglePause(); }
}
window.addEventListener("keydown", keyHandler);
document.addEventListener("click", ensureAudio, { once: true });
// 触屏滑动
let ts = null;
cv.addEventListener("touchstart", e => { ensureAudio(); ts = e.touches[0]; }, { passive: true });
cv.addEventListener("touchend", e => {
  if (!ts) return;
  const dx = e.changedTouches[0].clientX - ts.clientX;
  const dy = e.changedTouches[0].clientY - ts.clientY;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
  else setDir(0, dy > 0 ? 1 : -1);
  ts = null;
}, { passive: true });

function restart() { reset(); }

// 启动
document.getElementById("hud-best").textContent = get("nikki_snake_best", 0);
reset();
</script>
</body>
</html>
