<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎨 陈皮穿越艺术史 · Nikki 游戏合集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%F0%9F%8E%A8%3C/text%3E%3C/svg%3E">
<!-- ═══════════════════════════════════════════════════════════════
     陈皮穿越艺术史 v2 · 代码驱动的长卷动画
     灵感致谢: alchaincyf/huashu-art-motion(MIT,"用代码让画动起来")
     主角:陈皮(黑白奶牛猫,黑斑从眼周向鼻梁 dip 成"八"字,黄绿大眼)
     真迹致谢(大都会博物馆开放访问,公有领域):
       北斋《神奈川冲浪里》 · 梵高《麦田与柏树》(49.30) · Menna 墓狩猎图摹本
     v2 画面工艺(对齐原版精美度的四个硬指标):
       ① 质感层:全片胶片颗粒 + 暗角 + 每世界专属纹理(岩壁/纸纤维/画布织纹/金箔)
       ② 空气层次:远景-中景-近景三层,远景加雾化(haze)
       ③ 元素密度:每场景成百笔触,带尺寸/透明度随机变化(固定种子不闪)
       ④ 造型功:猫为双层结构(白身+黑斑八开头),腿尾有锥度、爪、接触影,
          每个时代一套完整画法而非简单换色
     ═══════════════════════════════════════════════════════════════ -->
<style>
  :root { --hk-deep: #ff6b9d; --hk-muted: #c98ba0; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    font-family: "Nunito", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #1c1630 0%, #241d3e 50%, #2c2148 100%);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 12px; color: #efe6f5;
  }
  header { text-align: center; margin-bottom: 8px; }
  header h1 { font-size: 24px; color: #ffd76e; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
  header p { font-size: 12px; color: #b9a8d4; }
  #stage { position: relative; }
  canvas {
    display: block; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
    background: #000; touch-action: none; max-width: 96vw; cursor: pointer;
  }
  #tip { margin-top: 8px; font-size: 12px; color: #b9a8d4; text-align: center; line-height: 1.8; }
  /* 时代直达 + 控制按钮 */
  #jumps { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  #jumps button, #ctrl button {
    border: 1px solid #5a4a7a; background: rgba(255,255,255,.06); color: #d8cdef;
    border-radius: 999px; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  #jumps button.on { background: #ffd76e; color: #3a2a10; border-color: #ffd76e; font-weight: 800; }
  #jumps button:hover, #ctrl button:hover { border-color: #ffd76e; }
  #ctrl { margin-top: 8px; display: flex; gap: 8px; }
  .home { margin-top: 12px; font-size: 13px; }
  a { color: #ffd76e; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>🎨 陈皮穿越艺术史</h1>
  <p>灵感:huashu-art-motion · 用代码让画动起来 —— 点画面暂停,按住 → 快进</p>
</header>

<div id="stage"><canvas id="cv" width="960" height="540"></canvas></div>
<div id="jumps"></div>
<div id="ctrl">
  <button id="btn-pause">⏸ 暂停</button>
  <button id="btn-mute">🔊 声音</button>
  <button id="btn-photo">📷 拍下来</button>
  <button id="btn-restart">↺ 从头看</button>
</div>
<div id="tip">🐾 陈皮要走 10 个时代,画风随它一起变 —— 注意看每个世界里"活着"的元素</div>
<div class="home"><a href="index.html">🏠 回游戏合集</a></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   〇、总开关、画布、胶片颗粒贴图
   ═══════════════════════════════════════════════════════════════ */
const CV = document.getElementById("cv"), CTX = CV.getContext("2d");
const W = CV.width, H = CV.height, GY = 466;
const WORLD_W = 1400;
const SERIF = '"Songti SC","Noto Serif SC","STSong",serif';   // 字卡衬线体,更有"作品感"

/* 陈皮调色板:照照片取色(黑白奶牛猫 + 黄绿大眼) */
const CAT_PAL = {
  body:  "#fbf7ee",   // 白毛(暖白)
  patch: "#23232c",   // 黑斑(软黑,照照片偏碳色)
  eye:   "#b9cc3e",   // 黄绿大眼
  nose:  "#2a2a32",   // 鼻上黑点(照片同款)
};

/* 胶片颗粒:预生成噪点贴图,每帧平铺叠加(overlay 混合) */
const noiseCv = document.createElement("canvas");
noiseCv.width = 180; noiseCv.height = 120;
(() => {
  const nc = noiseCv.getContext("2d"), img = nc.createImageData(180, 120);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = img.data[i+1] = img.data[i+2] = v;
    img.data[i+3] = 34 + Math.random() * 40;
  }
  nc.putImageData(img, 0, 0);
})();
let noisePat = null;

/* ═══════════════════════════════════════════════════════════════
   一、状态
   ═══════════════════════════════════════════════════════════════ */
const ST = {
  t: 0, camX: 0, catX: 330, speed: 62,
  fast: false, paused: false, ended: false, endT: 0, muted: false,
  eraCard: { idx: -1, t: 9 },
};
const TOTAL_W = 10 * WORLD_W;

/* ═══════════════════════════════════════════════════════════════
   二、工具:圆角矩形 / 固定随机 / 雾化 / 颗粒 / 暗角 / 纹理
   ═══════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function srnd(i) { const s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); }
/* 雾化:远景画完后罩一层低透明雾色,拉开空气层次 */
function haze(color, a) { CTX.globalAlpha = a; CTX.fillStyle = color; CTX.fillRect(0, 0, W, H); CTX.globalAlpha = 1; }
/* 胶片颗粒(每帧调用一次) */
function grain(t) {
  if (!noisePat) noisePat = CTX.createPattern(noiseCv, "repeat");
  CTX.save();
  CTX.globalCompositeOperation = "overlay"; CTX.globalAlpha = 0.14;
  CTX.translate((t * 96) % 180, (t * 61) % 120);
  CTX.fillStyle = noisePat; CTX.fillRect(-180, -120, W + 360, H + 240);
  CTX.restore();
}
/* 暗角 */
function vignette() {
  const g = CTX.createRadialGradient(W/2, H/2, H * 0.44, W/2, H/2, H * 0.86);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(16,8,26,.34)");
  CTX.fillStyle = g; CTX.fillRect(0, 0, W, H);
}
/* 斑驳纹理(岩壁/灰泥/金箔共用):确定性软斑块 */
function mottle(x0, seed, n, colors, wMax, hMax) {
  for (let i = 0; i < n; i++) {
    CTX.globalAlpha = 0.05 + srnd(i + seed) * 0.09;
    CTX.fillStyle = colors[i % colors.length];
    CTX.beginPath();
    CTX.ellipse(x0 + srnd(i * 3 + seed) * 1400, srnd(i * 7 + seed) * H,
                20 + srnd(i) * wMax, 12 + srnd(i + 1) * hMax, srnd(i + 2) * 3, 0, TAU);
    CTX.fill();
  }
  CTX.globalAlpha = 1;
}
/* 接触影(给树木/人物/物件落地的"重量感") */
function groundShadow(x, y, rx, ry, a) {
  CTX.fillStyle = `rgba(10,8,20,${a})`;
  CTX.beginPath(); CTX.ellipse(x, y, rx, ry, 0, 0, TAU); CTX.fill();
}


/* ═══ 真迹世界:Met 开放访问名画装载与铺画 ═══
   ukiyo:  北斋《神奈川冲浪里》   Met JP 公版
   vangogh: 梵高《麦田与柏树》1889 Met 49.30 公版
   egypt:  底比斯 Menna 墓壁画摹本 Met 公版
   装载失败时回退为色块 + 提示,不影响流程 */
const ART_IMGS = {};
for (const k of ["ukiyo", "vangogh", "egypt"]) {
  const im = new Image(); im.src = "assets/art/" + k + ".jpg"; ART_IMGS[k] = im;
}
const PSTATE = {};
function paintBG(key, x0, t) {
  const im = ART_IMGS[key];
  if (!im.complete || !im.naturalWidth) {
    CTX.fillStyle = "#3a3050"; CTX.fillRect(x0, 0, 1400, H);
    CTX.fillStyle = "#cbb8e0"; CTX.font = "15px sans-serif"; CTX.textAlign = "center";
    CTX.fillText("正在装裱画作…", x0 + 700, H / 2);
    return false;
  }
  const iw = im.naturalWidth, ih = im.naturalHeight;
  const z = 1.035 + Math.sin(t * 0.09 + key.length) * 0.02;         // 呼吸变焦(Ken Burns)
  const sc = Math.max(1400 / iw, H / ih) * z;
  const dw = iw * sc, dh = ih * sc;
  const px = x0 + (1400 - dw) / 2 + Math.sin(t * 0.05 + key.charCodeAt(0)) * 12;
  const py = (H - dh) / 2 + Math.cos(t * 0.04) * 8;
  CTX.drawImage(im, px, py, dw, dh);
  PSTATE[key] = { px, py, sc, iw, ih };
  return true;
}
function anchor(key, u, v) { const s = PSTATE[key]; return [s.px + s.iw * s.sc * u, s.py + s.ih * s.sc * v]; }
function bottomScrim() {                                   // 底部就座暗带(把猫"放"进画里)
  const g = CTX.createLinearGradient(0, GY - 130, 0, H);
  g.addColorStop(0, "rgba(8,5,14,0)"); g.addColorStop(1, "rgba(8,5,14,.44)");
  CTX.fillStyle = g; CTX.fillRect(0, GY - 130, W, H - GY + 130);
}
function clawAt(ax, ay, t, sz) {                           // 活浪爪:指纹漩涡+爪指+泡沫
  CTX.strokeStyle = "rgba(248,243,230,.95)"; CTX.lineCap = "round";
  CTX.lineWidth = 5;
  CTX.beginPath();
  CTX.moveTo(ax - sz * 0.55, ay + sz * 0.35);
  CTX.quadraticCurveTo(ax - sz * 0.85, ay - sz * 0.55, ax - sz * 0.12, ay - sz * 0.65);
  CTX.quadraticCurveTo(ax + sz * 0.42, ay - sz * 0.7, ax + sz * 0.46, ay - sz * 0.26);
  CTX.stroke();
  CTX.lineWidth = 2.2;
  CTX.beginPath(); CTX.arc(ax - sz * 0.08, ay - sz * 0.48, sz * 0.17, 2.6 + Math.sin(t * 2) * 0.3, 6.5); CTX.stroke();
  CTX.beginPath(); CTX.arc(ax - sz * 0.08, ay - sz * 0.48, sz * 0.09, 3.0, 6.2); CTX.stroke();
  for (let b = 0; b < 5; b++) {
    CTX.fillStyle = `rgba(248,243,230,${0.45 + 0.4 * Math.sin(t * 3 + b)})`;
    CTX.beginPath(); CTX.arc(ax + Math.sin(b * 2.1 + t * 1.7) * sz * 0.75, ay + 12 + Math.cos(b * 1.7 + t * 1.3) * 9, 2 + (b % 3) * 1.2, 0, TAU); CTX.fill();
  }
}

/* ═══════════════════════════════════════════════════════════════
   三、十个世界(v2:三层深度 + 高密度 + 每世界纹理)
   ═══════════════════════════════════════════════════════════════ */
const WORLDS = [
/* ─────────── 1. 岩洞壁画 ─────────── */
{ key: "cave", label: "岩洞", era: "公元前 40000 年 · 岩洞壁画",
  note: "第一只猫被画在墙上,火光让轮廓一跳一跳",
  sky(x0) {
    const g = CTX.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#241610"); g.addColorStop(0.6, "#3d2918"); g.addColorStop(1, "#54371f");
    CTX.fillStyle = g; CTX.fillRect(0, 0, W, H);
  },
  draw(x0, t) {
    /* 远景:岩壁起伏 + 斑驳 + 雾化 */
    CTX.fillStyle = "#33210f";
    CTX.beginPath(); CTX.moveTo(x0, 0);
    for (let i = 0; i <= 16; i++) CTX.lineTo(x0 + i * 90, 46 + srnd(i + 3) * 74);
    CTX.lineTo(x0 + 1440, 0); CTX.closePath(); CTX.fill();
    mottle(x0, 11, 26, ["#241505", "#4a3018"], 60, 40);
    haze("#2a1808", 0.18);
    /* 火光(双色光晕呼吸) */
    const fx = x0 + 500, fl = 0.75 + Math.sin(t * 7) * 0.12 + Math.sin(t * 13.7) * 0.08;
    const rg = CTX.createRadialGradient(fx, GY - 46, 12, fx, GY - 46, 470);
    rg.addColorStop(0, `rgba(255,166,66,${0.42 * fl})`); rg.addColorStop(0.6, `rgba(255,120,40,${0.14 * fl})`); rg.addColorStop(1, "rgba(255,120,40,0)");
    CTX.fillStyle = rg; CTX.fillRect(fx - 480, 0, 960, H);
    /* 手印(远近两排,大小/浓淡不同) */
    for (let i = 0; i < 12; i++) {
      const far = i % 3 === 0;
      const hx = x0 + 90 + srnd(i) * 1260, hy = 100 + srnd(i + 40) * 250, s = (far ? 0.6 : 0.95) + srnd(i + 9) * 0.5;
      CTX.save(); CTX.translate(hx, hy); CTX.scale(s, s);
      CTX.globalAlpha = (far ? 0.32 : 0.5) + Math.sin(t * 2 + i) * 0.1;
      CTX.fillStyle = far ? "#b06f38" : "#d98a4a";
      CTX.beginPath(); CTX.arc(0, 0, 11, 0, TAU);
      for (let f = 0; f < 5; f++) { const a = -2.2 + f * 0.42; CTX.ellipse(Math.cos(a) * 17, Math.sin(a) * 17, 4.5, 11, a + 1.57, 0, TAU); }
      CTX.fill(); CTX.restore();
    }
    CTX.globalAlpha = 1;
    /* 中景:鹿群(两批,远近错落,腿有步态) */
    for (let batch = 0; batch < 2; batch++) {
      const far = batch === 1;
      haze("#2a1808", far ? 0.22 : 0);
      for (let i = 0; i < 6; i++) {
        const dx = x0 + 620 + i * 92 + batch * 40, dy = GY - (far ? 120 : 148) - i * 5 - batch * 26;
        const k = Math.sin(t * (far ? 4 : 5.2) + i * 1.7 + batch) * 4;
        const col = far ? "#3a2410" : "#20130a";
        CTX.strokeStyle = col; CTX.lineWidth = far ? 4 : 5.5; CTX.lineCap = "round";
        CTX.beginPath();
        CTX.moveTo(dx, dy); CTX.quadraticCurveTo(dx + 22, dy + 2, dx + 46, dy + 8);
        CTX.moveTo(dx + 8, dy + 4); CTX.lineTo(dx + 3 + k, dy + 46);
        CTX.moveTo(dx + 36, dy + 6); CTX.lineTo(dx + 42 - k, dy + 46);
        CTX.moveTo(dx - 4, dy - 12); CTX.quadraticCurveTo(dx - 6, dy - 6, dx + 2, dy + 2);
        CTX.stroke();
        CTX.fillStyle = col;
        CTX.beginPath(); CTX.arc(dx - 9, dy - 17, 7.5, 0, TAU); CTX.fill();
        CTX.lineWidth = 3;
        CTX.beginPath();
        CTX.moveTo(dx - 9, dy - 24); CTX.lineTo(dx - 17, dy - 44);
        CTX.moveTo(dx - 13, dy - 34); CTX.lineTo(dx - 23, dy - 38);
        CTX.moveTo(dx - 9, dy - 24); CTX.lineTo(dx - 1, dy - 44);
        CTX.moveTo(dx - 5, dy - 34); CTX.lineTo(dx + 3, dy - 38);
        CTX.stroke();
        groundShadow(dx + 18, dy + 50, 30, 5, far ? 0.12 : 0.2);
      }
    }
    /* 火堆:柴 + 三焰 + 火星上升 */
    groundShadow(fx, GY + 8, 52, 9, 0.3);
    CTX.strokeStyle = "#4a2c12"; CTX.lineWidth = 7; CTX.lineCap = "round";
    CTX.beginPath(); CTX.moveTo(fx - 26, GY + 2); CTX.lineTo(fx + 24, GY - 8); CTX.moveTo(fx - 22, GY - 8); CTX.lineTo(fx + 26, GY + 2); CTX.stroke();
    for (let i = 0; i < 3; i++) {
      const fh = 40 + Math.sin(t * 9 + i * 2.1) * 12;
      const fg = CTX.createLinearGradient(fx, GY, fx, GY - fh);
      fg.addColorStop(0, ["#e2572b", "#ff9a3c", "#ffc95c"][i]); fg.addColorStop(1, "rgba(255,220,120,0)");
      CTX.fillStyle = fg;
      CTX.beginPath(); CTX.moveTo(fx - 17 + i * 10, GY);
      CTX.quadraticCurveTo(fx - 7 + i * 8, GY - fh * 0.6, fx + 1 + i * 8, GY - fh);
      CTX.quadraticCurveTo(fx + 8 + i * 8, GY - fh * 0.5, fx + 12 + i * 8, GY);
      CTX.fill();
    }
    for (let i = 0; i < 9; i++) {                             // 火星
      const p = ((t * (26 + srnd(i) * 30) + srnd(i + 9) * 130) % 130);
      CTX.fillStyle = `rgba(255,${170 + srnd(i) * 60 | 0},80,${(1 - p / 130) * 0.8})`;
      CTX.beginPath(); CTX.arc(fx + Math.sin(t * 2.4 + i * 2.4) * 22, GY - 30 - p, 1.6 + srnd(i) * 1.6, 0, TAU); CTX.fill();
    }
    /* 近景地面 + 岩壁纹理 */
    const gg = CTX.createLinearGradient(0, GY, 0, H);
    gg.addColorStop(0, "#5d4226"); gg.addColorStop(1, "#46301a");
    CTX.fillStyle = gg; CTX.fillRect(x0, GY, 1400, H - GY);
    CTX.strokeStyle = "rgba(28,16,6,.5)"; CTX.lineWidth = 2;
    for (let i = 0; i < 40; i++) {
      const sx = x0 + srnd(i + 70) * 1400, sy = GY + 10 + srnd(i + 80) * 54;
      CTX.beginPath(); CTX.moveTo(sx, sy); CTX.lineTo(sx + 16 + srnd(i) * 30, sy + srnd(i) * 3); CTX.stroke();
    }
    mottle(x0, 77, 12, ["#2c1a08"], 40, 14);
  }},
/* ─────────── 2. 古埃及壁画(真迹:Met Menna 墓摹本) ─────────── */
{ key: "egypt", label: "埃及", era: "公元前 1350 年 · Menna 墓狩猎图",
  note: "真迹:大都会博物馆藏墓室摹本,火把光还在墙上晃",
  sky(x0) {
    const g = CTX.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#d8b878"); g.addColorStop(1, "#b8945a");
    CTX.fillStyle = g; CTX.fillRect(0, 0, W, H);
  },
  draw(x0, t) {
    if (!paintBG("egypt", x0, t)) return;
    for (let i = 0; i < 2; i++) {                            // 火把光晕(游移+颤)
      const gx = x0 + 350 + i * 700 + Math.sin(t * 0.4 + i * 2) * 90;
      const fl = 0.5 + Math.sin(t * (7 + i)) * 0.12;
      const rg = CTX.createRadialGradient(gx, 210, 20, gx, 210, 380);
      rg.addColorStop(0, `rgba(255,188,108,${0.2 * fl})`); rg.addColorStop(1, "rgba(255,188,108,0)");
      CTX.fillStyle = rg; CTX.fillRect(gx - 400, 0, 800, H);
    }
    for (let i = 0; i < 24; i++) {                           // 尘光上浮
      const p = (t * (10 + srnd(i) * 14) + srnd(i + 3) * 460) % 460;
      CTX.fillStyle = `rgba(255,236,190,${(1 - p / 460) * 0.5})`;
      CTX.beginPath(); CTX.arc(x0 + srnd(i + 8) * 1400 + Math.sin(t + i) * 8, p * H / 460, 1.1 + srnd(i) * 1.4, 0, TAU); CTX.fill();
    }
    bottomScrim();
  }},
/* ─────────── 3. 浮世绘(真迹:Met 藏北斋原版画) ─────────── */
{ key: "ukiyo", label: "浮世绘", era: "1831 年 · 神奈川冲浪里",
  note: "真迹:北斋原版画 —— 看好了,浪爪到现在还在爬!",
  sky(x0) {
    const g = CTX.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#e9dfc8"); g.addColorStop(1, "#8aa8b8");
    CTX.fillStyle = g; CTX.fillRect(0, 0, W, H);
  },
  draw(x0, t) {
    if (!paintBG("ukiyo", x0, t)) return;
    const claws = [[0.16, 0.30, 92], [0.33, 0.235, 118], [0.52, 0.32, 84]];   // 锚定真迹浪峰
    for (const [u, v, sz] of claws) {

/* ═══════════════════════════════════════════════════════════════

function catPose(t) {
  const ph = t * 7.4;
  return {
    ph, bob: Math.abs(Math.sin(ph)) * 3,
    legA: Math.sin(ph), legB: Math.sin(ph + Math.PI),
    tail: Math.sin(t * 3.1) * 0.3,
    blink: (t % 3.7) < 0.13,
  };

/* 身+头轮廓(填充/裁剪两用) */
function catPath(ctx, p) {
  ctx.beginPath();
  ctx.ellipse(-2, -30 - p.bob, 35, 21, 0, 0, TAU);
  ctx.ellipse(30, -52 - p.bob, 19, 17.5, 0, 0, TAU);

/* 锥度腿:两段圆头线(宽→窄)+ 爪 */
function leg(ctx, x, swing, w, color) {
  const kx = x + swing * 5, ky = -13 - 0;
  const fx = x + swing * 10;
  ctx.strokeStyle = color; ctx.lineCap = "round";
  ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x, -22); ctx.lineTo(kx, ky); ctx.stroke();
  ctx.lineWidth = w - 2.4;
  ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(fx, -3); ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(fx + 1.5, -2.5, 4.6, 3.4, 0, 0, TAU); ctx.fill();

/* 双段锥度尾 */
function tail(ctx, p, color, tipColor) {
  ctx.save(); ctx.translate(-33, -34 - p.bob); ctx.rotate(p.tail);

  ctx.lineWidth = 8;

  ctx.lineWidth = 5.4;
  ctx.beginPath(); ctx.moveTo(-19, -18); ctx.quadraticCurveTo(-24, -26, -22, -34); ctx.stroke();
  ctx.fillStyle = tipColor;

                 }
               } },
    vangogh: { body: "#e8e4da", patch: "#26304e", outline: "#e8d27a", olw: 2.6, tail: "#26304e", leg: "#4a5a7e", whisk: false,
               fx(c2, p2, t2) {                                      // 厚涂漩涡短笔
                 for (let i = 0; i < 40; i++) {
                   const a = srnd(i) * TAU, r = 6 + srnd(i + 3) * 27;
                   const sx = -33 + Math.cos(a) * r * 1.55, sy = -47 + Math.sin(a) * r;
                   c2.strokeStyle = i % 2 ? "rgba(126,200,227,.7)" : "rgba(242,232,122,.75)";
                   c2.lineWidth = 3; c2.lineCap = "round";
                   c2.beginPath(); c2.arc(sx, sy, 6.4, a, a + 2.3); c2.stroke();
                 }
               } },
    klimt:   { body: "#ece5d4", patch: "#b8892e", outline: "#5a4312", olw: 2.4, tail: "#b8892e", tailTip: "#f2d06b", leg: "#b8892e", whisk: false,
               fx(c2, p2) {                                          // 金箔斑 + 黑白几何纹
                 for (let i = 0; i < 14; i++) {
                   c2.fillStyle = "rgba(255,232,154,.5)";
                   c2.beginPath(); c2.arc(-30 + srnd(i) * 60, -60 + srnd(i + 7) * 44, 2 + srnd(i) * 3, 0, TAU); c2.fill();
                 }
                 for (let i = 0; i < 12; i++) {
                   c2.fillStyle = i % 3 ? "#1a1a1a" : "#fff";
                   const kx2 = -32 + srnd(i + 2) * 58, ky2 = -58 + srnd(i + 12) * 40;
                   i % 2 ? (c2.beginPath(), c2.arc(kx2, ky2, 3, 0, TAU), c2.fill())
                         : (c2.fillRect(kx2 - 3.6, ky2 - 1.4, 7.2, 2.8));
                 }
               } },
    bauhaus: {},                                                    // 包豪斯:几何另画
    pixel:   {},                                                    // 像素:另画
    vapor:   { body: "#f2e8f8", patch: "#ff5b9d", outline: "#39ffdd", olw: 2.4, tail: "#ff5b9d", leg: "#39ffdd", whisk: false, shadow: 0.3,
               fx(c2, p2, t2) {                                      // 霓虹辉光 + 身上扫描线
                 c2.fillStyle = "rgba(57,255,221,.22)";
                 c2.fillRect(-80, -90, 160, 100);
                 c2.fillStyle = "rgba(20,10,40,.4)";
                 for (let ly = -12 + ((t2 * 30) % 6); ly < 0; ly += 6) c2.fillRect(-80, ly, 160, 2);
               } },
    shinkai: { body: P.body, patch: P.patch, outline: "rgba(255,255,255,.85)", olw: 2, tail: P.patch, tailTip: "#fff", leg: P.patch, whisk: true,
               fx(c2, p2, t2) {                                      // 青蓝阴影 + 逆光弧
                 c2.fillStyle = "rgba(168,196,236,.5)";
                 c2.beginPath(); c2.ellipse(-8, -22 - p2.bob, 28, 8, 0, 0, TAU); c2.fill();
                 c2.beginPath(); c2.ellipse(30, -62 - p2.bob, 12, 5, 0.5, 0, TAU); c2.fill();
                 c2.fillStyle = `rgba(255,240,170,${0.3 + Math.sin(t2 * 3) * 0.18})`;
                 c2.beginPath(); c2.ellipse(16, -44 - p2.bob, 10, 5, 0.4, 0, TAU); c2.fill();
               } },
  };
  return M[s] || M.ukiyo;
}
/* 岩洞陈皮:整猫赭石剪影 + 炭色抖动轮廓 + 颜料滴痕 */
function drawCatCave(ctx, p) {
  for (const [jx, jy, col, lw] of [[0, 0, "#c9764a", 0], [2, 1, "rgba(58,31,14,.55)", 3], [-2, -1, "rgba(58,31,14,.3)", 1.6]]) {
    ctx.save(); ctx.translate(jx, jy);
    ctx.fillStyle = col || "#c9764a";
    catPath(ctx, p);
    if (lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; catPath(ctx, p); ctx.stroke(); }
    ctx.fill();
    ctx.strokeStyle = col || "#8a4a26"; ctx.lineCap = "round";
    for (const [lx, sw] of [[18, p.legA * 0.85], [10, p.legB * 0.85], [-18, p.legB], [-27, p.legA]])
      leg(ctx, lx, sw, 8, col || "#c9764a");
    tail(ctx, p, col || "#8a4a26", col || "#8a4a26");
    ctx.restore();
  }
  /* 眼点 + 滴痕 */
  ctx.fillStyle = "#3a1f0e";
  ctx.beginPath(); ctx.arc(26, -54 - p.bob, 1.8, 0, TAU); ctx.arc(36, -54 - p.bob, 1.8, 0, TAU); ctx.fill();
  for (let i = 0; i < 3; i++) {
    const dx = -20 + i * 18 + srnd(i) * 8;
    ctx.fillStyle = "rgba(138,74,38,.5)";
    ctx.fillRect(dx, -22, 2.2, 10 + srnd(i + 4) * 16);
  }
}
/* 包豪斯陈皮:几何件(黑白主调 + 红黄蓝点缀) */
function drawCatBauhaus(ctx, p) {
  const y = -p.bob;
  ctx.fillStyle = "rgba(26,26,26,.18)";
  ctx.beginPath(); ctx.ellipse(4, 0, 42, 7, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#1a1a1a";                                // 腿:直杆
  ctx.fillRect(15, -22 + y, 6, 22 + p.bob);
  ctx.fillRect(-23, -22 + y, 6, 22 + p.bob);
  ctx.fillStyle = "#f0ebde"; rr(ctx, -37, -46 + y, 74, 32, 7); ctx.fill();     // 身:米白圆角矩形
  ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = 3; rr(ctx, -37, -46 + y, 74, 32, 7); ctx.stroke();
  ctx.fillStyle = "#d93a2b"; ctx.beginPath(); ctx.arc(-8, -30 + y, 8, 0, TAU); ctx.fill();     // 红圆斑
  ctx.fillStyle = "#f0ebde"; ctx.beginPath(); ctx.arc(28, -52 + y, 17.5, 0, TAU); ctx.fill();  // 头
  ctx.strokeStyle = "#1a1a1a"; ctx.beginPath(); ctx.arc(28, -52 + y, 17.5, 0, TAU); ctx.stroke();
  ctx.fillStyle = "#1a1a1a";                                 // 黑帽(八字的帽)
  ctx.beginPath(); ctx.ellipse(27, -61 + y, 16.5, 10, 0.05, 0, TAU); ctx.fill();
  ctx.fillStyle = "#2b5ea7";                                 // 蓝:耳
  ctx.beginPath(); ctx.moveTo(16, -63 + y); ctx.lineTo(21, -80 + y); ctx.lineTo(28, -64 + y); ctx.fill();
  ctx.beginPath(); ctx.moveTo(32, -64 + y); ctx.lineTo(39, -80 + y); ctx.lineTo(44, -62 + y); ctx.fill();
  ctx.fillStyle = "#1a1a1a";
  ctx.beginPath(); ctx.arc(23, -54 + y, 2.4, 0, TAU); ctx.arc(34, -54 + y, 2.4, 0, TAU); ctx.fill();
  ctx.fillStyle = "#f2b705"; ctx.beginPath(); ctx.arc(28, -46 + y, 2.6, 0, TAU); ctx.fill();   // 黄鼻
  ctx.strokeStyle = "#2b5ea7"; ctx.lineWidth = 5.4; ctx.lineCap = "round";                     // 蓝尾折线
  ctx.beginPath(); ctx.moveTo(-35, -36 + y); ctx.lineTo(-49, -46 + y); ctx.lineTo(-46, -62 + y); ctx.stroke();
}
/* 8-bit 陈皮:黑白像素图(16×12,两帧步态) */
const CAT_PIX = [
  "....B....B......",
  "...BBBB.BBB.....",
  "...BBBBBBBB.....",
  "..BBBBBBBBBB....",
  "..BBBBBBBBBB....",
  "..BWEBBBBWEB....",
  "..BWWWPWWWWB....",
  "...WWWWWWWW.....",
  "..BBBBWWWWW.....",
  ".BBBBBBBWWWW....",
  ".BBBBBBBWWWW....",
  "................",
];
function drawCatPixel(ctx, p) {
  const S = 6.4, ox = -50, oy = -82 - Math.floor(p.bob / 3) * 2;
  for (let r = 0; r < CAT_PIX.length; r++)
    for (let c = 0; c < 16; c++) {
      const v = CAT_PIX[r][c];
      if (v === ".") continue;
      ctx.fillStyle = v === "B" ? "#23232c" : v === "E" ? "#b9cc3e" : v === "P" ? "#e88aa8" : "#fbf7ee";
      ctx.fillRect(ox + c * S, oy + r * S, S, S);
    }
  /* 两帧步态腿(黑) */
  ctx.fillStyle = "#23232c";
  const f = Math.floor(p.ph / Math.PI) % 2;
  ctx.fillRect(ox + (f ? 4 : 5) * S, oy + 12 * S, S * 1.6, S * 2.2);
  ctx.fillRect(ox + (f ? 11 : 10) * S, oy + 12 * S, S * 1.6, S * 2.2);
  /* 像素尾 */
  ctx.fillRect(ox + 0 * S, oy + 8 * S, S, S * 2);
  ctx.fillRect(ox - 1 * S, oy + 6 * S, S, S * 2);
}

/* ═══════════════════════════════════════════════════════════════
   五、主渲染:天空→世界→右缘预告→陈皮→字卡→进度→暗角颗粒
   ═══════════════════════════════════════════════════════════════ */
function worldIdxAt(x) { return clamp(Math.floor(x / WORLD_W), 0, 9); }
function render() {
  const t = ST.t;
  const wi = worldIdxAt(ST.catX);
  const wd = WORLDS[wi];
  const x0 = wi * WORLD_W - ST.camX;
  wd.sky(x0);
  wd.draw(x0, t);
  /* 过界预告:下一世界在右侧先露一条 */
  const rightEdge = x0 + WORLD_W;
  if (rightEdge < W && wi < 9) {
    CTX.save(); CTX.beginPath(); CTX.rect(rightEdge, 0, W - rightEdge, H); CTX.clip();
    WORLDS[wi + 1].sky(rightEdge - (wi + 1) * WORLD_W);
    WORLDS[wi + 1].draw(rightEdge - (wi + 1) * WORLD_W, t);
    CTX.restore();
    CTX.fillStyle = "rgba(8,5,14,.55)"; CTX.fillRect(rightEdge - 3, 0, 6, H);
  }
  /* 陈皮 */
  CTX.save();
  CTX.translate(ST.catX - ST.camX, GY);
  drawCat(CTX, wd.key, t);
  CTX.restore();
  /* 时代字卡(衬线体,进界 2.6s) */
  if (ST.eraCard.t > 0 && !ST.ended) {
    const card = WORLDS[ST.eraCard.idx];
    const a = clamp(ST.eraCard.t / 0.5, 0, 1) * clamp((2.6 - ST.eraCard.t) / 0.4, 0, 1);
    CTX.globalAlpha = a;
    CTX.fillStyle = "rgba(16,10,26,.72)";
    rr(CTX, 20, 24, 486, 76, 10); CTX.fill();
    CTX.strokeStyle = "rgba(255,215,110,.5)"; CTX.lineWidth = 1.4;
    rr(CTX, 20, 24, 486, 76, 10); CTX.stroke();
    CTX.fillStyle = "#ffd76e"; CTX.font = `600 22px ${SERIF}`; CTX.textAlign = "left";
    CTX.fillText(card.era, 38, 54);
    CTX.fillStyle = "#e6dcf2"; CTX.font = `13px ${SERIF}`;
    CTX.fillText(card.note, 38, 81);
    CTX.globalAlpha = 1;
  }
  /* 进度:细金条 + 爪印 */
  CTX.fillStyle = "rgba(0,0,0,.4)"; rr(CTX, 20, H - 15, W - 40, 6, 3); CTX.fill();
  const prog = clamp(ST.catX / TOTAL_W, 0, 1);
  CTX.fillStyle = "#ffd76e"; rr(CTX, 20, H - 15, (W - 40) * prog, 6, 3); CTX.fill();
  CTX.font = "12px serif"; CTX.textAlign = "center";
  CTX.fillText("🐾", 20 + (W - 40) * prog, H - 8);
  /* 终幕 */
  if (ST.ended) {
    CTX.fillStyle = `rgba(10,6,20,${clamp(ST.endT, 0, 0.78)})`;
    CTX.fillRect(0, 0, W, H);
    if (ST.endT > 0.5) {
      CTX.fillStyle = "#ffd76e"; CTX.font = `600 42px ${SERIF}`; CTX.textAlign = "center";
      CTX.fillText("十个时代,一只陈皮", W / 2, H / 2 - 30);
      CTX.fillStyle = "#e6dcf2"; CTX.font = `17px ${SERIF}`;
      CTX.fillText("从火堆旁的第一笔,到还没画完的最后一根线", W / 2, H / 2 + 12);
      CTX.fillStyle = "#b9a8d4"; CTX.font = "13px sans-serif";
      CTX.fillText("点画面 ↺ 从头再看 · 灵感致谢 huashu-art-motion (MIT)", W / 2, H / 2 + 46);
    }
  }
  /* 全片收尾工艺:暗角 + 胶片颗粒(压轴,统一质感) */
  vignette();
  grain(t);
}

/* ═══════════════════════════════════════════════════════════════
   六、主循环与交互
   ═══════════════════════════════════════════════════════════════ */
let lastTs = null;
function frame(ts) {
  if (lastTs === null) lastTs = ts;
  const dt = clamp((ts - lastTs) / 1000, 0, 0.06);
  lastTs = ts;
  if (!ST.paused && !ST.ended) {
    ST.t += dt;
    ST.catX += ST.speed * (ST.fast ? 2.6 : 1) * dt;
    ST.camX = Math.max(ST.camX, ST.catX - W * 0.34);
    const wi = worldIdxAt(ST.catX);
    if (wi !== ST.eraCard.idx) { ST.eraCard = { idx: wi, t: 2.6 }; sfxEra(wi); syncJumps(); }
    ST.eraCard.t -= dt;
    if (ST.catX >= TOTAL_W - 40) { ST.ended = true; ST.eraCard.t = 0; }
  } else if (ST.ended) {
    ST.endT += dt;
  }
  render();
  requestAnimationFrame(frame);
}
/* 点画面:暂停/继续;结束后重看 */
CV.addEventListener("pointerdown", () => {
  if (AC && AC.state === "suspended") AC.resume();
  tone(1, 1, 0.01, "sine", 0.001);
});
CV.addEventListener("click", () => {
  if (ST.ended) { resetAll(); return; }
  ST.paused = !ST.paused;
  lastTs = null;
  syncCtrl();
});
/* 控制按钮 */
document.getElementById("btn-pause").onclick = function () {
  ST.paused = !ST.paused; lastTs = null; syncCtrl();
};
document.getElementById("btn-mute").onclick = function () {
  ST.muted = !ST.muted;
  this.textContent = ST.muted ? "🔇 静音" : "🔊 声音";
};
document.getElementById("btn-photo").onclick = () => {
  const a = document.createElement("a");
  a.download = `陈皮艺术史-${WORLDS[worldIdxAt(ST.catX)].key}.png`;
  a.href = CV.toDataURL("image/png");
  a.click();
};
document.getElementById("btn-restart").onclick = () => resetAll();
function syncCtrl() { document.getElementById("btn-pause").textContent = ST.paused ? "▶ 继续" : "⏸ 暂停"; }
/* 键盘 */
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") ST.fast = true;
  if (e.key === " ") { ST.paused = !ST.paused; lastTs = null; syncCtrl(); e.preventDefault(); }
});
addEventListener("keyup", e => { if (e.key === "ArrowRight") ST.fast = false; });

/* ═══════════════════════════════════════════════════════════════
   七、时代直达 + 轻量 BGM(每时代换调式)
   ═══════════════════════════════════════════════════════════════ */
const jumpBox = document.getElementById("jumps");
WORLDS.forEach((wd, i) => {
  const b = document.createElement("button");
  b.textContent = `${i + 1}. ${wd.label}`;
  b.onclick = () => {
    ST.ended = false; ST.endT = 0; ST.paused = false; lastTs = null;
    ST.catX = i * WORLD_W + 120;
    ST.camX = Math.max(0, ST.catX - W * 0.34);
    ST.eraCard = { idx: i, t: 2.6 };
    syncJumps(); syncCtrl();
  };
  jumpBox.appendChild(b);
});
function syncJumps() {
  const wi = worldIdxAt(ST.catX);
  [...jumpBox.children].forEach((b, i) => b.classList.toggle("on", i === wi));
}
function resetAll() {
  ST.t = 0; ST.catX = 330; ST.camX = 0; ST.ended = false; ST.endT = 0;
  ST.paused = false; ST.eraCard = { idx: 0, t: 2.6 }; lastTs = null;
  syncJumps(); syncCtrl();
}
let AC = null;
function tone(f0, f1, dur, type, vol) {
  if (ST.muted) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}
const SCALES = [
  [220, 262, 294, 330, 392], [233, 277, 311, 349, 415], [262, 294, 330, 392, 440],
  [262, 311, 349, 392, 466], [247, 277, 330, 370, 415], [262, 330, 392, 523, 659],
  [262, 294, 330, 349, 392], [262, 330, 392, 523, 659], [220, 277, 330, 440, 554],
  [294, 330, 370, 440, 494],
];
function sfxEra(i) { tone(SCALES[i % 10][0], SCALES[i % 10][0] * 1.01, 0.3, "triangle", 0.12); }
setInterval(() => {
  if (ST.paused || ST.ended || ST.muted) return;
  const sc = SCALES[worldIdxAt(ST.catX) % 10];
  const n = sc[Math.floor(Math.random() * sc.length)] * (Math.random() < 0.3 ? 2 : 1);
  tone(n, n, 0.9, "triangle", 0.045);
}, 640);

resetAll();
requestAnimationFrame(frame);
</script>
