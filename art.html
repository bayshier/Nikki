<!DOCTYPE html>
<html lang="zh-CN">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%F0%9F%8E%A8%3C/text%3E%3C/svg%3E">
<!-- ═══════════════════════════════════════════════════════════════
     陈皮穿越艺术史 v2 · 代码驱动的长卷动画
     灵感致谢: alchaincyf/huashu-art-motion(MIT,"用代码让画动起来")
     主角:陈皮(黑白奶牛猫,黑斑从眼周向鼻梁 dip 成"八"字,黄绿大眼)
     真迹致谢(大都会博物馆开放访问,公有领域):
       北斋《神奈川冲浪里》 · 梵高《麦田与柏树》(49.30) · Menna 墓狩猎图摹本
     v2 画面工艺(对齐原版精美度的四个硬指标):
       ① 质感层:全片胶片颗粒 + 暗角 + 每世界专属纹理(岩壁/纸纤维/画布织纹/金箔)
       ② 空气层次:远景-中景-近景三层,远景加雾化(haze)
       ③ 元素密度:每场景成百笔触,带尺寸/透明度随机变化(固定种子不闪)
       ④ 造型功:猫为双层结构(白身+黑斑八开头),腿尾有锥度、爪、接触影,
          每个时代一套完整画法而非简单换色
     ═══════════════════════════════════════════════════════════════ -->
<style>
  :root { --hk-deep: #ff6b9d; --hk-muted: #c98ba0; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    font-family: "Nunito", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #1c1630 0%, #241d3e 50%, #2c2148 100%);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 12px; color: #efe6f5;
  }
  header { text-align: center; margin-bottom: 8px; }
  header h1 { font-size: 24px; color: #ffd76e; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
  header p { font-size: 12px; color: #b9a8d4; }
  #stage { position: relative; }
  canvas {
    display: block; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
    background: #000; touch-action: none; max-width: 96vw; cursor: pointer;
  }
  #tip { margin-top: 8px; font-size: 12px; color: #b9a8d4; text-align: center; line-height: 1.8; }
  /* 时代直达 + 控制按钮 */
  #jumps { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  #jumps button, #ctrl button {
    border: 1px solid #5a4a7a; background: rgba(255,255,255,.06); color: #d8cdef;
    border-radius: 999px; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  #jumps button.on { background: #ffd76e; color: #3a2a10; border-color: #ffd76e; font-weight: 800; }
  #jumps button:hover, #ctrl button:hover { border-color: #ffd76e; }
  #ctrl { margin-top: 8px; display: flex; gap: 8px; }
  .home { margin-top: 12px; font-size: 13px; }
  a { color: #ffd76e; font-weight: 700; text-decoration: none; }
  /* ═══ 3D 展馆覆盖层 ═══ */
  #gal { position: fixed; inset: 0; z-index: 99; background: #17112a; display: none; }
  #gal.on { display: block; }
  #gal-cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #gal-top {
    position: absolute; top: 14px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center; gap: 14px; pointer-events: none;
  }
  #gal-top b {
    font-family: "Songti SC","Noto Serif SC","STSong",serif;
    font-size: 17px; color: #ffd76e; letter-spacing: 2px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  #gal-exit {
    pointer-events: auto; position: absolute; right: 14px; top: 8px;
    border: 1px solid #5a4a7a; background: rgba(255,255,255,.08); color: #d8cdef;
    border-radius: 999px; padding: 6px 16px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  #gal-exit:hover { border-color: #ffd76e; }
  #gal-info {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(8px);
    max-width: 92%; text-align: center; pointer-events: none;
    font-family: "Songti SC","Noto Serif SC","STSong",serif;
    opacity: 0; transition: opacity .35s, transform .35s;
  }
  #gal-info.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #gal-info .era { font-size: 17px; color: #ffd76e; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  #gal-info .note { font-size: 12.5px; color: #d8cdef; margin-top: 3px; }
  #gal-hint {
    position: absolute; bottom: 20px; right: 16px; font-size: 11px; color: #8a7ab0; pointer-events: none;
  }
</style>
</head>
<body>
<header>
  <h1>🎨 陈皮穿越艺术史</h1>
  <p>灵感:huashu-art-motion · 用代码让画动起来 —— 点画面暂停,按住 → 快进</p>
</header>

<div id="stage"><canvas id="cv" width="960" height="540"></canvas></div>
<div id="jumps"></div>
<div id="ctrl">
  <button id="btn-pause">⏸ 暂停</button>
  <button id="btn-mute">🔊 声音</button>
  <button id="btn-photo">📷 拍下来</button>
  <button id="btn-restart">↺ 从头看</button>
  <button id="btn-gallery">🏛️ 3D 展馆</button>
</div>
<div id="tip">🐾 陈皮要走 10 个时代,画风随它一起变 —— 注意看每个世界里"活着"的元素</div>
<div class="home"><a href="index.html">🏠 回游戏合集</a></div>

<div id="gal">
  <canvas id="gal-cv"></canvas>
  <div id="gal-top"><b>🏛️ 陈皮艺术史 · 3D 展馆</b></div>
  <button id="gal-exit">✕ 回到长卷</button>
  <div id="gal-info"><div class="era"></div><div class="note"></div></div>
  <div id="gal-hint">拖动环视 · 点画走近看 · 画是活的</div>
</div>

<script src="shared/art-paint.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   〇、总开关、画布、胶片颗粒贴图
   ═══════════════════════════════════════════════════════════════ */
const CV = document.getElementById("cv");
let CTX = CV.getContext("2d");        // 3D 展馆截画 / 烘培时临时换到离屏画布
const W0 = CV.width, H = CV.height, GY = 466;
let W = W0;                            // 烘培时临时放宽到 WORLD_W
const WORLD_W = 1400;
const SERIF = '"Songti SC","Noto Serif SC","STSong",serif';   // 字卡衬线体,更有"作品感"

/* 陈皮调色板:照照片取色(黑白奶牛猫 + 黄绿大眼) */
const CAT_PAL = {
  body:  "#fbf7ee",   // 白毛(暖白)
  patch: "#23232c",   // 黑斑(软黑,照照片偏碳色)
  eye:   "#b9cc3e",   // 黄绿大眼
  nose:  "#2a2a32",   // 鼻上黑点(照片同款)
};

/* 胶片颗粒:预生成噪点贴图,每帧平铺叠加(overlay 混合) */
const noiseCv = document.createElement("canvas");
noiseCv.width = 180; noiseCv.height = 120;
(() => {
  const nc = noiseCv.getContext("2d"), img = nc.createImageData(180, 120);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = img.data[i+1] = img.data[i+2] = v;
    img.data[i+3] = 34 + Math.random() * 40;
  }
  nc.putImageData(img, 0, 0);
})();
let noisePat = null;

/* ═══════════════════════════════════════════════════════════════
   一、状态
   ═══════════════════════════════════════════════════════════════ */
const ST = {
  t: 0, camX: 0, catX: 330, speed: 62,
  fast: false, paused: false, ended: false, endT: 0, muted: false,
  eraCard: { idx: -1, t: 9 },
};
const TOTAL_W = 10 * WORLD_W;

/* ═══════════════════════════════════════════════════════════════
   二、工具:圆角矩形 / 固定随机 / 雾化 / 颗粒 / 暗角 / 纹理
   ═══════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function srnd(i) { const s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); }
/* 雾化:远景画完后罩一层低透明雾色,拉开空气层次 */
function haze(color, a) { CTX.globalAlpha = a; CTX.fillStyle = color; CTX.fillRect(0, 0, W, H); CTX.globalAlpha = 1; }
/* 胶片颗粒(每帧调用一次) */
function grain(t) {
  if (!noisePat) noisePat = CTX.createPattern(noiseCv, "repeat");
  CTX.save();
  CTX.globalCompositeOperation = "overlay"; CTX.globalAlpha = 0.14;
  CTX.translate((t * 96) % 180, (t * 61) % 120);
  CTX.fillStyle = noisePat; CTX.fillRect(-180, -120, W + 360, H + 240);
  CTX.restore();
}
/* 暗角 */
function vignette() {
  const g = CTX.createRadialGradient(W/2, H/2, H * 0.44, W/2, H/2, H * 0.86);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(16,8,26,.34)");
  CTX.fillStyle = g; CTX.fillRect(0, 0, W, H);
}
/* 斑驳纹理(岩壁/灰泥/金箔共用):确定性软斑块 */
function mottle(x0, seed, n, colors, wMax, hMax) {
  for (let i = 0; i < n; i++) {
    CTX.globalAlpha = 0.05 + srnd(i + seed) * 0.09;
    CTX.fillStyle = colors[i % colors.length];
    CTX.beginPath();
    CTX.ellipse(x0 + srnd(i * 3 + seed) * 1400, srnd(i * 7 + seed) * H,
                20 + srnd(i) * wMax, 12 + srnd(i + 1) * hMax, srnd(i + 2) * 3, 0, TAU);
    CTX.fill();
  }
  CTX.globalAlpha = 1;
}
/* 接触影(给树木/人物/物件落地的"重量感") */
function groundShadow(x, y, rx, ry, a) {
  CTX.fillStyle = `rgba(10,8,20,${a})`;
  CTX.beginPath(); CTX.ellipse(x, y, rx, ry, 0, 0, TAU); CTX.fill();
}


/* ═══ 真迹世界:Met 开放访问名画装载与铺画 ═══
   ukiyo:  北斋《神奈川冲浪里》   Met JP 公版
   vangogh: 梵高《麦田与柏树》1889 Met 49.30 公版
   egypt:  底比斯 Menna 墓壁画摹本 Met 公版
   装载失败时回退为色块 + 提示,不影响流程 */
const ART_IMGS = {};
for (const k of ["ukiyo", "vangogh", "egypt"]) {
  const im = new Image(); im.src = "assets/art/" + k + ".jpg"; ART_IMGS[k] = im;
}
const PSTATE = {};
function paintBG(key, x0, t) {
  const im = ART_IMGS[key];
  if (!im.complete || !im.naturalWidth) {
    CTX.fillStyle = "#3a3050"; CTX.fillRect(x0, 0, 1400, H);
    CTX.fillStyle = "#cbb8e0"; CTX.font = "15px sans-serif"; CTX.textAlign = "center";
    CTX.fillText("正在装裱画作…", x0 + 700, H / 2);
    return false;
  }
  const iw = im.naturalWidth, ih = im.naturalHeight;
  const z = 1.035 + Math.sin(t * 0.09 + key.length) * 0.02;         // 呼吸变焦(Ken Burns)
  const sc = Math.max(1400 / iw, H / ih) * z;
  const dw = iw * sc, dh = ih * sc;
  const px = x0 + (1400 - dw) / 2 + Math.sin(t * 0.05 + key.charCodeAt(0)) * 12;
  const py = (H - dh) / 2 + Math.cos(t * 0.04) * 8;
  CTX.drawImage(im, px, py, dw, dh);
  PSTATE[key] = { px, py, sc, iw, ih };
  return true;
}
function anchor(key, u, v) { const s = PSTATE[key]; return [s.px + s.iw * s.sc * u, s.py + s.ih * s.sc * v]; }
function bottomScrim() {                                   // 底部就座暗带(把猫"放"进画里)
  const g = CTX.createLinearGradient(0, GY - 130, 0, H);
  g.addColorStop(0, "rgba(8,5,14,0)"); g.addColorStop(1, "rgba(8,5,14,.44)");
  CTX.fillStyle = g; CTX.fillRect(0, GY - 130, W, H - GY + 130);
}
function clawAt(ax, ay, t, sz) {                           // 活浪爪:指纹漩涡+爪指+泡沫
  CTX.strokeStyle = "rgba(248,243,230,.95)"; CTX.lineCap = "round";
  CTX.lineWidth = 5;
  CTX.beginPath();
  CTX.moveTo(ax - sz * 0.55, ay + sz * 0.35);
  CTX.quadraticCurveTo(ax - sz * 0.85, ay - sz * 0.55, ax - sz * 0.12, ay - sz * 0.65);
  CTX.quadraticCurveTo(ax + sz * 0.42, ay - sz * 0.7, ax + sz * 0.46, ay - sz * 0.26);
  CTX.stroke();
  CTX.lineWidth = 2.2;
  CTX.beginPath(); CTX.arc(ax - sz * 0.08, ay - sz * 0.48, sz * 0.17, 2.6 + Math.sin(t * 2) * 0.3, 6.5); CTX.stroke();
  CTX.beginPath(); CTX.arc(ax - sz * 0.08, ay - sz * 0.48, sz * 0.09, 3.0, 6.2); CTX.stroke();
  for (let b = 0; b < 5; b++) {
    CTX.fillStyle = `rgba(248,243,230,${0.45 + 0.4 * Math.sin(t * 3 + b)})`;
    CTX.beginPath(); CTX.arc(ax + Math.sin(b * 2.1 + t * 1.7) * sz * 0.75, ay + 12 + Math.cos(b * 1.7 + t * 1.3) * 9, 2 + (b % 3) * 1.2, 0, TAU); CTX.fill();
  }
}

/* ═══════════════════════════════════════════════════════════════
   三、十个世界(v2:三层深度 + 高密度 + 每世界纹理)
   ═══════════════════════════════════════════════════════════════ */
const WORLDS = [
/* ─────────── 1. 岩洞壁画 ─────────── */
{ key: "cave", label: "岩洞", era: "公元前 40000 年 · 岩洞壁画",
  note: "第一只猫被画在墙上,火光让轮廓一跳一跳",
  sky(x0) {
    const g = CTX.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#241610"); g.addColorStop(0.6, "#3d2918"); g.addColorStop(1, "#54371f");
    CTX.fillStyle = g; CTX.fillRect(0, 0, W, H);
  },
  draw(x0, t) {
    /* 远景:岩壁起伏 + 斑驳 + 雾化 */
    CTX.fillStyle = "#33210f";
    CTX.beginPath(); CTX.moveTo(x0, 0);
    for (let i = 0; i <= 16; i++) CTX.lineTo(x0 + i * 90, 46 + srnd(i + 3) * 74);
    CTX.lineTo(x0 + 1440, 0); CTX.closePath(); CTX.fill();
    mottle(x0, 11, 26, ["#241505", "#4a3018"], 60, 40);
    haze("#2a1808", 0.18);
    /* 火光(双色光晕呼吸) */
    const fx = x0 + 500, fl = 0.75 + Math.sin(t * 7) * 0.12 + Math.sin(t * 13.7) * 0.08;
    const rg = CTX.createRadialGradient(fx, GY - 46, 12, fx, GY - 46, 470);
    rg.addColorStop(0, `rgba(255,166,66,${0.42 * fl})`); rg.addColorStop(0.6, `rgba(255,120,40,${0.14 * fl})`); rg.addColorStop(1, "rgba(255,120,40,0)");
    CTX.fillStyle = rg; CTX.fillRect(fx - 480, 0, 960, H);
    /* 手印(远近两排,大小/浓淡不同) */
    for (let i = 0; i < 12; i++) {
      const far = i % 3 === 0;
      const hx = x0 + 90 + srnd(i) * 1260, hy = 100 + srnd(i + 40) * 250, s = (far ? 0.6 : 0.95) + srnd(i + 9) * 0.5;
      CTX.save(); CTX.translate(hx, hy); CTX.scale(s, s);
      CTX.globalAlpha = (far ? 0.32 : 0.5) + Math.sin(t * 2 + i) * 0.1;
      CTX.fillStyle = far ? "#b06f38" : "#d98a4a";
      CTX.beginPath(); CTX.arc(0, 0, 11, 0, TAU);
      for (let f = 0; f < 5; f++) { const a = -2.2 + f * 0.42; CTX.ellipse(Math.cos(a) * 17, Math.sin(a) * 17, 4.5, 11, a + 1.57, 0, TAU); }
      CTX.fill(); CTX.restore();
    }
    CTX.globalAlpha = 1;
    /* 中景:鹿群(两批,远近错落,腿有步态) */
    for (let batch = 0; batch < 2; batch++) {
      const far = batch === 1;
      haze("#2a1808", far ? 0.22 : 0);
      for (let i = 0; i < 6; i++) {
        const dx = x0 + 620 + i * 92 + batch * 40, dy = GY - (far ? 120 : 148) - i * 5 - batch * 26;
        const k = Math.sin(t * (far ? 4 : 5.2) + i * 1.7 + batch) * 4;
        const col = far ? "#3a2410" : "#20130a";
        CTX.strokeStyle = col; CTX.lineWidth = far ? 4 : 5.5; CTX.lineCap = "round";
        CTX.beginPath();
        CTX.moveTo(dx, dy); CTX.quadraticCurveTo(dx + 22, dy + 2, dx + 46, dy + 8);
        CTX.moveTo(dx + 8, dy + 4); CTX.lineTo(dx + 3 + k, dy + 46);
        CTX.moveTo(dx + 36, dy + 6); CTX.lineTo(dx + 42 - k, dy + 46);
        CTX.moveTo(dx - 4, dy - 12); CTX.quadraticCurveTo(dx - 6, dy - 6, dx + 2, dy + 2);
        CTX.stroke();
        CTX.fillStyle = col;
        CTX.beginPath(); CTX.arc(dx - 9, dy - 17, 7.5, 0, TAU); CTX.fill();
        CTX.lineWidth = 3;
        CTX.beginPath();
        CTX.moveTo(dx - 9, dy - 24); CTX.lineTo(dx - 17, dy - 44);
        CTX.moveTo(dx - 13, dy - 34); CTX.lineTo(dx - 23, dy - 38);
        CTX.moveTo(dx - 9, dy - 24); CTX.lineTo(dx - 1, dy - 44);
        CTX.moveTo(dx - 5, dy - 34); CTX.lineTo(dx + 3, dy - 38);
        CTX.stroke();
        groundShadow(dx + 18, dy + 50, 30, 5, far ? 0.12 : 0.2);
      }
    }
    /* 火堆:柴 + 三焰 + 火星上升 */
    groundShadow(fx, GY + 8, 52, 9, 0.3);
    CTX.strokeStyle = "#4a2c12"; CTX.lineWidth = 7; CTX.lineCap = "round";
    CTX.beginPath(); CTX.moveTo(fx - 26, GY + 2); CTX.lineTo(fx + 24, GY - 8); CTX.moveTo(fx - 22, GY - 8); CTX.lineTo(fx + 26, GY + 2); CTX.stroke();
    for (let i = 0; i < 3; i++) {
      const fh = 40 + Math.sin(t * 9 + i * 2.1) * 12;
      const fg = CTX.createLinearGradient(fx, GY, fx, GY - fh);
      fg.addColorStop(0, ["#e2572b", "#ff9a3c", "#ffc95c"][i]); fg.addColorStop(1, "rgba(255,220,120,0)");
      CTX.fillStyle = fg;
      CTX.beginPath(); CTX.moveTo(fx - 17 + i * 10, GY);
      CTX.quadraticCurveTo(fx - 7 + i * 8, GY - fh * 0.6, fx + 1 + i * 8, GY - fh);
      CTX.quadraticCurveTo(fx + 8 + i * 8, GY - fh * 0.5, fx + 12 + i * 8, GY);
      CTX.fill();
    }
    for (let i = 0; i < 9; i++) {                             // 火星
      const p = ((t * (26 + srnd(i) * 30) + srnd(i + 9) * 130) % 130);
      CTX.fillStyle = `rgba(255,${170 + srnd(i) * 60 | 0},80,${(1 - p / 130) * 0.8})`;
      CTX.beginPath(); CTX.arc(fx + Math.sin(t * 2.4 + i * 2.4) * 22, GY - 30 - p, 1.6 + srnd(i) * 1.6, 0, TAU); CTX.fill();
    }
    /* 近景地面 + 岩壁纹理 */
    const gg = CTX.createLinearGradient(0, GY, 0, H);
    gg.addColorStop(0, "#5d4226"); gg.addColorStop(1, "#46301a");
    CTX.fillStyle = gg; CTX.fillRect(x0, GY, 1400, H - GY);
    CTX.strokeStyle = "rgba(28,16,6,.5)"; CTX.lineWidth = 2;
    for (let i = 0; i < 40; i++) {
      const sx = x0 + srnd(i + 70) * 1400, sy = GY + 10 + srnd(i + 80) * 54;
      CTX.beginPath(); CTX.moveTo(sx, sy); CTX.lineTo(sx + 16 + srnd(i) * 30, sy + srnd(i) * 3); CTX.stroke();
    }
    mottle(x0, 77, 12, ["#2c1a08"], 40, 14);
  }},
/* ─────────── 2. 古埃及壁画(真迹:Met Menna 墓摹本) ─────────── */

/* ═══════════════════════════════════════════════════════════════
   三·五、签名渲染器接入(T2 升级)
   方法论:huashu-art-motion「04 纯代码绘制」五层法 ——
     平涂底稿 → 风格渲染器整幅重画 → 小物件单独一层 → 角色 → 会动的母题。
   每个世界只有一种「签名语言」,不是一律刷笔触:
     洞穴=流场笔触吃进岩面 / 莫奈=色点 / 克里姆特=金箔纹样 /
     包豪斯=纯几何 / 8bit=真低分辨率 / 蒸汽波=VHS 后期 / 新海诚=泛光丁达尔
   ═══════════════════════════════════════════════════════════════ */
const PAINT_CFG = {
  cave: {
    // 岩画:方向场贴着岩壁起伏走,赭石色板,每笔带深色描边才有厚涂感
    angle: (x, y) => -0.15 + AP.noise2(x * 0.004, y * 0.006, 3) * 1.1,
    palette: ["#ce925a", "#8a5426", "#b6643a", "#6e4426", "#21150d", "#d9a86a"],
    cell: 13, len: 30, width: 5.2, density: 0.9, outline: "#1b1008", alpha: 0.7,
    veil: 0.82,                    // 岩面要盖住底稿,火光在后期补回来
  },
  monet: {
    // 印象派:横向短色点,冷暖偏移;不吸色板——吸了会把整幅洗白(实测)
    angle: (x, y) => (y > GY - 60 ? 0.03 : -0.22) + AP.noise2(x * 0.01, y * 0.01, 9) * 0.5,
    cell: 9, rx: 7, ry: 2.6,
    veil: 0.46,
  },
  klimt: { pattern: true },
  pixel: { pixel: true, fx: 3 },   // 320×180:再低就只剩色块,建筑细节会丢
};

/* 14 色 NES 风色板(8bit 世界专用) */
const PAL14 = ["#0a0a12", "#1c2a4a", "#2c5aa0", "#0856ef", "#47c4f8", "#aae9fb",
               "#fbe2a6", "#e8a048", "#c0522a", "#7a2a4a", "#f2f2e8", "#9aa0b0",
               "#5a8a5a", "#2a6a3a"];

const OVERLAYS = {};             // key → 已烘焙的绘画层(1400 宽)
const POST_CACHE = {};           // 后期缓存(丁达尔楔形等)

function bakeOverlay(wd) {
  if (OVERLAYS[wd.key]) return OVERLAYS[wd.key];
  const cfg = PAINT_CFG[wd.key];
  if (!cfg) { OVERLAYS[wd.key] = null; return null; }
  const cv = AP.mk(WORLD_W, H, true);
  const realCtx = CTX, realW = W;
  CTX = cv.getContext("2d", { willReadFrequently: true });
  W = WORLD_W;                                   // 烘培时世界铺满整幅
  try {
    wd.sky(0);
    wd.draw(0, 0);                               // t=0 的底稿:只要静态构图
    if (cfg.pattern) {
      /* 纹样只上墙(y < GY-140),地面留给原本的花毯——否则满屏图案读成壁纸 */
      AP.klimtPattern(CTX, 0, 0, WORLD_W, GY - 140, 0, 77, 130);
    } else if (cfg.pixel) {
      AP.pixelize(CTX, cv, WORLD_W, H, PAL14, cfg.fx);
    } else if (cfg.rx) {
      /* 印象派走色点,不走笔触(配方 28:莫奈是 dabs,不是 strokes) */
      AP.dabPass(CTX, {
        w: WORLD_W, h: H, seed: 43, cell: cfg.cell, rx: cfg.rx, ry: cfg.ry,
        palette: cfg.palette, angle: (x, y) => cfg.angle(x, y),
      });
    } else if (cfg.palette) {
      AP.flowPass(CTX, {
        w: WORLD_W, h: H, seed: 31, cell: cfg.cell, len: cfg.len, width: cfg.width,
        palette: cfg.palette, angle: (x, y) => cfg.angle(x, y),
        outline: cfg.outline, density: cfg.density, alpha: cfg.alpha,
      });
    }
  } finally { CTX = realCtx; W = realW; }
  OVERLAYS[wd.key] = cv;
  return cv;
}

/* ── 签名转场:九处边界各用"下一个世界"的母语咬合 ──
   接缝左侧是旧世界、右侧是新世界;抓一条带子,让两界像素按风格互相侵入 */
const SEAM = {
  cave:  (c, bx, bw, h, t, s) => AP.TRANS.stone(c, bx, bw, h, t, s),
  egypt: (c, bx, bw, h, t, s) => AP.TRANS.misreg(c, bx, bw, h, t, s),
  ukiyo: (c, bx, bw, h, t, s) => AP.TRANS.ink(c, bx, bw, h, t, s),
  monet: (c, bx, bw, h, t, s) => AP.TRANS.dabs(c, bx, bw, h, t, s),
  vangogh: (c, bx, bw, h, t, s) => AP.TRANS.shards(c, bx, bw, h, t, s),
  klimt: (c, bx, bw, h, t, s) => AP.TRANS.geo(c, bx, bw, h, t, s),
  bauhaus: (c, bx, bw, h, t, s) => AP.TRANS.pixel(c, bx, bw, h, t, s),
  pixel: (c, bx, bw, h, t, s) => AP.TRANS.scan(c, bx, bw, h, t, s),
  vapor: (c, bx, bw, h, t, s) => AP.TRANS.glow(c, bx, bw, h, t, s),
};
const SEAM_KEYS = ["cave", "egypt", "ukiyo", "monet", "vangogh", "klimt", "bauhaus", "pixel", "vapor"];

function seamFX(bx, idx, t) {
  const bw = 300;
  const left = bx - bw / 2;
  /* 边界还在画面外侧:画一层风格化的软过渡,避免"硬切"先露脸 */
  if (left + bw < 0 || left > W0) return;
  if (left < 0 || left + bw > W0) {
    const gx = clamp(bx, 0, W0);
    const g = CTX.createLinearGradient(gx - 90, 0, gx + 90, 0);
    g.addColorStop(0, "rgba(8,5,14,0)");
    g.addColorStop(0.5, "rgba(8,5,14,.42)");
    g.addColorStop(1, "rgba(8,5,14,0)");
    CTX.fillStyle = g; CTX.fillRect(gx - 90, 0, 180, H);
    return;
  }
  const snap = AP.mk(bw, H), sg = snap.getContext("2d");
  sg.drawImage(CV, left, 0, bw, H, 0, 0, bw, H);
  const fn = SEAM[SEAM_KEYS[idx % SEAM_KEYS.length]];
  if (fn) fn(CTX, bx, bw, H, t, snap);
  /* 接缝再压一层极淡的过渡光:两界硬切边不至于刺眼 */
  const g2 = CTX.createLinearGradient(bx - 46, 0, bx + 46, 0);
  g2.addColorStop(0, "rgba(10,7,16,0)");
  g2.addColorStop(0.5, "rgba(10,7,16,.2)");
  g2.addColorStop(1, "rgba(10,7,16,0)");
  CTX.fillStyle = g2; CTX.fillRect(bx - 46, 0, 92, H);
}

/* ── 世界专属后期:每帧,只作用于该世界可见区域 ── */
function postFX(wd, x0, t) {
  const k = wd.key;
  const vx = Math.max(0, x0), vw = Math.min(WORLD_W, W0 - x0) - Math.max(0, x0);
  if (k === "cave") {
    /* 火光要在颜料层之上重新打一遍(配方 01:用 overlay,用 lighter 会把赭石洗成粉白) */
    const fx = x0 + 500;
    const fl = 0.75 + Math.sin(t * 7) * 0.12 + Math.sin(t * 13.7) * 0.08;
    const g = CTX.createRadialGradient(fx, GY - 46, 12, fx, GY - 46, 470);
    g.addColorStop(0, `rgba(255,166,66,${0.46 * fl})`);
    g.addColorStop(0.6, `rgba(255,120,40,${0.16 * fl})`);
    g.addColorStop(1, "rgba(255,120,40,0)");
    CTX.save();
    CTX.globalCompositeOperation = "overlay";
    CTX.fillStyle = g; CTX.fillRect(x0, 0, WORLD_W, H);
    /* 余烬:亮核 + 光晕,首尾淡入淡出 */
    CTX.globalCompositeOperation = "lighter";
    const rnd = AP.rng(61);
    for (let i = 0; i < 40; i++) {
      const bx = x0 + 380 + rnd() * 620;
      const q = ((t * 0.22 + rnd()) % 1);
      const by = GY - 10 - q * 300;
      const a = Math.sin(q * Math.PI) * (0.35 + 0.65 * Math.abs(Math.sin(t * 6 + i * 1.9)));
      const r = 1.6 + rnd() * 2.2;
      CTX.fillStyle = `rgba(255,224,130,${a * 0.85})`;
      CTX.beginPath(); CTX.arc(bx + Math.sin(t * 1.7 + i) * 9, by, r, 0, TAU); CTX.fill();
      CTX.fillStyle = `rgba(255,180,80,${a * 0.22})`;
      CTX.beginPath(); CTX.arc(bx + Math.sin(t * 1.7 + i) * 9, by, r * 3.4, 0, TAU); CTX.fill();
    }
    CTX.restore();
  } else if (k === "klimt") {
    AP.goldShimmer(CTX, WORLD_W, H * 0.55, t, 13, 380);
    AP.goldShards(CTX, WORLD_W, H, t, 19, 26);
  } else if (k === "vapor" && vw > 60) {
    AP.vhs(CTX, vx, 0, vw, H, t, ST.t);
  } else if (k === "shinkai" && vw > 60) {
    AP.bloom(CTX, vx, 0, vw, H, 0.17);
    if (!POST_CACHE.shinkai) POST_CACHE.shinkai = {};
    AP.godRays(CTX, vx, 0, vw, H, t, 5, POST_CACHE.shinkai);
  }
}

/* ═══════════════════════════════════════════════════════════════
   四、陈皮:黑白奶牛猫骨架(锥度腿/双段尾/八开头/黄绿大眼)
   所有风格共用骨架参数,再按 key 换画法
   ═══════════════════════════════════════════════════════════════ */
function catPose(t) {
  const ph = t * 7.4;
  return {
    ph, bob: Math.abs(Math.sin(ph)) * 3,
    legA: Math.sin(ph), legB: Math.sin(ph + Math.PI),
    tail: Math.sin(t * 3.1) * 0.3,
    blink: (t % 3.7) < 0.13,
  };
}
/* 身+头轮廓(填充/裁剪两用):横向猫身 + 小一号的头 + 适度耳朵。
   v3 的猫只有两个椭圆、没有耳朵,读起来像仓鼠;耳朵过大又像兔子 —— 这里按照片比例收。 */
/* 猫体剪影:一条闭合轮廓(鼻→右耳→下巴→胸→腹→臀→背→左耳→头顶)。
   早期版本用"身体椭圆 + 头椭圆"两条路径合并,描边时会把颈部交线一起画出来,
   看起来像被绳子勒住;单一路径才只有外轮廓。 */
function catPath(ctx, p) {
  const b = p.bob, br = Math.sin(p.ph * 0.5) * 0.7;
  ctx.beginPath();
  ctx.moveTo(36, -70.5 - b);
  /* 右耳 */
  ctx.lineTo(42, -67 - b); ctx.lineTo(49, -77 - b); ctx.lineTo(50, -62 - b);
  /* 头右侧到下巴 */
  ctx.bezierCurveTo(50, -57 - b, 49, -51 - b, 46.5, -47 - b);
  ctx.bezierCurveTo(44, -44 - b, 41, -42.5 - b, 38, -43 - b);
  /* 颈前(短凹,不是长勒痕) */
  ctx.bezierCurveTo(36.5, -43.5 - b, 33.5, -44 - b, 31, -45 - b);
  /* 前胸(贴着头的下缘外侧走,别穿进头部,否则描边会在脸上划一道) */
  ctx.bezierCurveTo(28, -40 - b, 27.4, -35 - b, 28, -31 - b);
  /* 胸底到腹 */
  ctx.bezierCurveTo(25, -27 - b, 19, -25 - b, 12, -23 - b);
  ctx.bezierCurveTo(2, -21.0 - b, -12, -20.0 - b, -22, -21.0 - b);
  /* 后臀 */
  ctx.bezierCurveTo(-30, -22 - b, -36, -26 - b, -37, -33 - b);
  ctx.bezierCurveTo(-38, -41 - b, -33, -48 - b, -25, -51 - b);
  /* 脊背(带呼吸起伏) */
  ctx.bezierCurveTo(-14, -54.5 - b - br, 0, -56 - b - br, 12, -56.5 - b - br);
  /* 颈后接左耳 */
  ctx.bezierCurveTo(16, -57.5 - b, 21, -59.5 - b, 23.8, -63 - b);
  ctx.lineTo(27, -78 - b); ctx.lineTo(32, -68 - b);
  ctx.bezierCurveTo(32.5, -69 - b, 34.5, -70.5 - b, 36, -70.5 - b);
  ctx.closePath();
}
/* 躯干(风格笔触的裁剪用):不含头,避免点彩糊到脸上 */
function catBodyPath(ctx, p) {
  const b = p.bob, br = Math.sin(p.ph * 0.5) * 0.7;
  ctx.beginPath();
  ctx.moveTo(27, -27 - b);
  ctx.bezierCurveTo(24, -33 - b, 22, -40 - b, 22, -47 - b);
  ctx.bezierCurveTo(12, -54 - b - br, -4, -56 - b - br, -16, -53 - b - br);
  ctx.bezierCurveTo(-28, -50 - b - br, -37, -43 - b, -37, -32 - b);
  ctx.bezierCurveTo(-36, -27 - b, -31, -22 - b, -22, -21 - b);
  ctx.bezierCurveTo(-12, -20 - b, 2, -21 - b, 12, -22 - b);
  ctx.bezierCurveTo(19, -23 - b, 25, -25 - b, 27, -29 - b);
  ctx.closePath();
}
/* 耳内:粉色三角 + 一撮耳毛 */
function catEarInner(ctx, p, o, t) {
  const b = p.bob;
  ctx.fillStyle = o.earIn || "rgba(230,146,164,.9)";
  ctx.beginPath(); ctx.moveTo(29, -66 - b); ctx.lineTo(28.5, -74 - b); ctx.lineTo(34, -67.5 - b); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(44.5, -65 - b); ctx.lineTo(48.5, -73 - b); ctx.lineTo(50, -63 - b); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(250,246,238,.7)"; ctx.lineWidth = 1; ctx.lineCap = "round";
  const fw = Math.sin(t * 1.3) * 0.8;
  ctx.beginPath(); ctx.moveTo(30.5, -68 - b); ctx.lineTo(30.2 + fw, -72 - b); ctx.stroke();
}
/* 锥度腿:两段圆头线(宽→窄)+ 爪关节 */
function leg(ctx, x, swing, w, color) {
  const kx = x + swing * 4, ky = -9;
  const fx = x + swing * 8;
  ctx.strokeStyle = color; ctx.lineCap = "round";
  ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x, -22); ctx.lineTo(kx, ky); ctx.stroke();
  ctx.lineWidth = w - 2;
  ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(fx, -2); ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(fx + 1.2, -1.8, 4.4, 2.7, 0, 0, TAU); ctx.fill();
}
/* 双段锥度尾:从臀部向后上方甩出去,不压到背上 */
function tail(ctx, p, color, tipColor) {
  ctx.save();
  ctx.translate(-32, -40 - p.bob);
  ctx.rotate(p.tail * 0.5);
  ctx.strokeStyle = color; ctx.lineCap = "round";
  ctx.lineWidth = 8.2;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-10, -3, -17, -12, -18, -22); ctx.stroke();
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-18, -22); ctx.bezierCurveTo(-20, -34, -28, -44, -37, -46); ctx.stroke();
  ctx.fillStyle = tipColor;
  ctx.beginPath(); ctx.arc(-38.6, -46.4, 3, 0, TAU); ctx.fill();
  ctx.restore();
}
/* 主绘制:s = 世界 key */
function drawCat(ctx, s, t) {
  const p = catPose(t), P = CAT_PAL;
  const o = catOpts(s);
  if (s === "bauhaus") { drawCatBauhaus(ctx, p); return; }      // 几何猫自成比例
  const K = o.scale || 1.3;                                    // 放大:角色是视线落点
  ctx.save();
  ctx.scale(K, K);
  /* 接触影(随步伐微缩) */
  ctx.fillStyle = `rgba(8,6,16,${o.shadow ?? 0.24})`;
  ctx.beginPath(); ctx.ellipse(3, 1, 38 + Math.sin(p.ph) * 2, 7, 0, 0, TAU); ctx.fill();

  if (s === "pixel") { drawCatPixel(ctx, p); ctx.restore(); return; }
  if (s === "cave") { drawCatCave(ctx, p); ctx.restore(); return; }

  /* —— 尾巴(压在身体后) —— */
  tail(ctx, p, o.tail, o.tailTip || o.tail);
  /* —— 四条腿:后腿带踝,前腿直 —— */
  for (const [lx, sw, lw] of [[22, p.legA * 0.7, 8.2], [14, p.legB * 0.7, 8.2], [-22, p.legB * 0.8, 9], [-31, p.legA * 0.8, 9]])
    leg(ctx, lx, sw, lw, o.leg);
  /* —— 身体:先按两倍粗细描轮廓,再用身体色填充盖住内半圈 ——
     直接给合并路径描边会连带画出"头与身体的交线"(看着像被绳子勒住),
     先描后填只剩外轮廓,耳根也不会多一道横线。 */
  if (o.outline) {
    ctx.strokeStyle = o.outline; ctx.lineWidth = (o.olw || 2.6) * 2; ctx.lineJoin = "round";
    catPath(ctx, p); ctx.stroke();
  }
  ctx.fillStyle = o.body; catPath(ctx, p); ctx.fill();
  /* —— 斑块与风格笔触(裁剪进身形) —— */
  ctx.save(); catPath(ctx, p); ctx.clip();
  if (o.patch) {
    /* 背部鞍斑:三团叠出不规则边,像真猫的花斑(只盖背,不扫到肚皮) */
    ctx.fillStyle = o.patch;
    ctx.beginPath(); ctx.ellipse(-13, -50 - p.bob, 14.5, 6.4, -0.08, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-27, -44 - p.bob, 8, 5.6, 0.28, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-2, -53 - p.bob, 6, 3.8, -0.28, 0, TAU); ctx.fill();
    /* 头顶黑帽(只盖额头)+ 左耳整只黑 —— 眼睛必须露在帽沿下面 */
    ctx.beginPath(); ctx.ellipse(39.5, -66.5 - p.bob, 11.2, 5.8, 0.04, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(29, -66 - p.bob); ctx.lineTo(27, -78.5 - p.bob); ctx.lineTo(35, -68 - p.bob); ctx.closePath(); ctx.fill();
    /* 白口鼻 + 白胸腹(奶牛猫的大白脸) */
    ctx.fillStyle = o.body;
    ctx.beginPath(); ctx.ellipse(39.5, -49.5 - p.bob, 8.2, 5.2, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(24, -30 - p.bob, 8.5, 6.4, 0.06, 0, TAU); ctx.fill();
  }
  ctx.restore();
  /* 风格笔触只作用在躯干上,别糊到脸上 */
  if (o.fx) {
    ctx.save(); catBodyPath(ctx, p); ctx.clip(); o.fx(ctx, p, t); ctx.restore();
  }
  /* 耳内 */
  catEarInner(ctx, p, o, t);

  /* —— 脸部(在裁剪外,保持锐利) —— */
  const hy = -56 - p.bob, hx = 39;
  /* 大眼:杏仁形 + 竖瞳 + 双高光;眨眼变弯眼 */
  if (p.blink) {
    ctx.strokeStyle = "#1a1a20"; ctx.lineWidth = 1.7; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(hx - 11, hy); ctx.quadraticCurveTo(hx - 7.2, hy + 2.6, hx - 3.4, hy);
    ctx.moveTo(hx + 3.4, hy); ctx.quadraticCurveTo(hx + 7.2, hy + 2.6, hx + 11, hy);
    ctx.stroke();
  } else {
    for (const ex of [hx - 6.6, hx + 6.6]) {
      ctx.save();
      ctx.translate(ex, hy + 0.4); ctx.rotate(ex < hx ? -0.1 : 0.1);
      ctx.fillStyle = o.eyeC || P.eye;
      ctx.beginPath(); ctx.ellipse(0, 0, 4.7, 5.3, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#20202a";                        // 竖瞳
      ctx.beginPath(); ctx.ellipse(0, 0.4, 1.6, 3.6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(-1.8, -2.2, 1.35, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(1.7, 2.1, 0.7, 0, TAU); ctx.fill();
      ctx.strokeStyle = "rgba(34,30,38,.5)"; ctx.lineWidth = 1;   // 上眼睑
      ctx.beginPath(); ctx.ellipse(0, 0, 4.9, 5.5, 0, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
      ctx.restore();
    }
  }
  /* 鼻(圆角三角) + 人中 + 嘴 */
  ctx.fillStyle = o.noseC || P.nose;
  ctx.beginPath();
  ctx.moveTo(hx - 2.3, hy + 4.4); ctx.lineTo(hx + 2.3, hy + 4.4);
  ctx.quadraticCurveTo(hx + 1.9, hy + 6.8, hx, hy + 7.2);
  ctx.quadraticCurveTo(hx - 1.9, hy + 6.8, hx - 2.3, hy + 4.4);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(36,30,32,.6)"; ctx.lineWidth = 1.1; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(hx, hy + 7.2); ctx.lineTo(hx, hy + 8.4);
  ctx.moveTo(hx, hy + 8.4); ctx.quadraticCurveTo(hx - 1.8, hy + 9.8, hx - 3.2, hy + 8.3);
  ctx.moveTo(hx, hy + 8.4); ctx.quadraticCurveTo(hx + 1.8, hy + 9.8, hx + 3.2, hy + 8.3); ctx.stroke();
  /* 腮毛(两三根短弧,猫感全在这里) */
  ctx.strokeStyle = "rgba(60,54,58,.3)"; ctx.lineWidth = 0.9;
  for (const s2 of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(hx + s2 * 8.6, hy + 3.4); ctx.quadraticCurveTo(hx + s2 * 12.4, hy + 5, hx + s2 * 13.6, hy + 8.4);
    ctx.stroke();
  }
  /* 胡须(灰,微颤) */
  if (o.whisk) {
    ctx.strokeStyle = "rgba(58,56,62,.62)"; ctx.lineWidth = 1;
    for (const wy of [-0.6, 2, 4.6]) {
      const wob = Math.sin(t * 2.4 + wy) * 0.7;
      ctx.beginPath(); ctx.moveTo(hx + 3.4, hy + wy); ctx.quadraticCurveTo(hx + 11, hy + wy - 1.8, hx + 17, hy + wy - 3.4 + wob); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hx - 3.4, hy + wy); ctx.quadraticCurveTo(hx - 11, hy + wy - 1.8, hx - 17, hy + wy - 3.4 + wob); ctx.stroke();
    }
  }
  ctx.restore();
}
/* 各时代画法参数(身体色/斑块/腿尾/描边 + 风格笔触钩子 fx) */
function catOpts(s) {
  const P = CAT_PAL;
  const M = {
    cave:    {},                                                    // 岩洞:整猫另画
    egypt:   { body: "#f2e6c4", patch: "#1c1c22", outline: "#3a2a10", olw: 3, tail: "#1c1c22", leg: "#1c1c22", whisk: true,
               fx(c2, p2) {                                          // 金项圈 + 金耳环
                 c2.fillStyle = "#d9b23c";
                 for (let i = 0; i < 3; i++) { c2.beginPath(); c2.ellipse(28 + i * 7.2, -44 - p2.bob, 3.6, 12, 1.25, 0, TAU); c2.fill(); }
                 c2.fillStyle = "#f2d06b"; c2.beginPath(); c2.arc(47, -63 - p2.bob, 2.8, 0, TAU); c2.fill();
               }, eyeC: "#1c1c22", noseC: "#1c1c22" },
    ukiyo:   { body: "#f6f1e6", patch: "#1f1f26", outline: "#26303e", olw: 3.4, tail: "#1f1f26", leg: "#1f1f26", whisk: true,
               fx(c2, p2, t2) {                                      // 木版套印错位(斑块右侧淡蓝重影)
                 c2.fillStyle = "rgba(74,122,154,.3)";
                 c2.beginPath(); c2.ellipse(-9, -40 - p2.bob, 22, 12, -0.12, 0, TAU); c2.fill();
               } },
    monet:   { body: "#f4efe6", patch: "#3f3f4c", outline: null, tail: "#8a92a8", leg: "#8a92a8", whisk: false, shadow: 0.16,
               fx(c2, p2) {                                          // 点彩:影紫/天绿/暖白三层
                 for (let i = 0; i < 90; i++) {
                   c2.fillStyle = ["rgba(184,168,216,.55)", "rgba(168,205,180,.5)", "rgba(255,246,220,.6)", "rgba(122,176,192,.45)"][i % 4];
                   c2.beginPath();
                   c2.ellipse(-36 + srnd(i) * 70, -66 + srnd(i + 9) * 54, 4.6, 2.2, srnd(i) * 3, 0, TAU);
                   c2.fill();
                 }
               } },
    vangogh: { body: "#e8e4da", patch: "#26304e", outline: "#e8d27a", olw: 2.6, tail: "#26304e", leg: "#4a5a7e", whisk: false,
               fx(c2, p2, t2) {                                      // 厚涂漩涡短笔
                 for (let i = 0; i < 40; i++) {
                   const a = srnd(i) * TAU, r = 6 + srnd(i + 3) * 27;
                   const sx = -33 + Math.cos(a) * r * 1.55, sy = -47 + Math.sin(a) * r;
                   c2.strokeStyle = i % 2 ? "rgba(126,200,227,.7)" : "rgba(242,232,122,.75)";
                   c2.lineWidth = 3; c2.lineCap = "round";
                   c2.beginPath(); c2.arc(sx, sy, 6.4, a, a + 2.3); c2.stroke();
                 }
               } },
    klimt:   { body: "#ece5d4", patch: "#b8892e", outline: "#5a4312", olw: 2.4, tail: "#b8892e", tailTip: "#f2d06b", leg: "#b8892e", whisk: false,
               fx(c2, p2) {                                          // 金箔斑 + 黑白几何纹
                 for (let i = 0; i < 14; i++) {
                   c2.fillStyle = "rgba(255,232,154,.5)";
                   c2.beginPath(); c2.arc(-30 + srnd(i) * 60, -60 + srnd(i + 7) * 44, 2 + srnd(i) * 3, 0, TAU); c2.fill();
                 }
                 for (let i = 0; i < 12; i++) {
                   c2.fillStyle = i % 3 ? "#1a1a1a" : "#fff";
                   const kx2 = -32 + srnd(i + 2) * 58, ky2 = -58 + srnd(i + 12) * 40;
                   i % 2 ? (c2.beginPath(), c2.arc(kx2, ky2, 3, 0, TAU), c2.fill())
                         : (c2.fillRect(kx2 - 3.6, ky2 - 1.4, 7.2, 2.8));
                 }
               } },
    bauhaus: {},                                                    // 包豪斯:几何另画
    pixel:   {},                                                    // 像素:另画
    vapor:   { body: "#f2e8f8", patch: "#ff5b9d", outline: "#39ffdd", olw: 2.4, tail: "#ff5b9d", leg: "#39ffdd", whisk: false, shadow: 0.3,
               fx(c2, p2, t2) {                                      // 霓虹辉光 + 身上扫描线
                 c2.fillStyle = "rgba(57,255,221,.22)";
                 c2.fillRect(-80, -90, 160, 100);
                 c2.fillStyle = "rgba(20,10,40,.4)";
                 for (let ly = -12 + ((t2 * 30) % 6); ly < 0; ly += 6) c2.fillRect(-80, ly, 160, 2);
               } },
    shinkai: { body: P.body, patch: P.patch, outline: "rgba(255,255,255,.85)", olw: 2, tail: P.patch, tailTip: "#fff", leg: P.patch, whisk: true,
               fx(c2, p2, t2) {                                      // 青蓝阴影 + 逆光弧
                 c2.fillStyle = "rgba(168,196,236,.5)";
                 c2.beginPath(); c2.ellipse(-8, -22 - p2.bob, 28, 8, 0, 0, TAU); c2.fill();
                 c2.beginPath(); c2.ellipse(30, -62 - p2.bob, 12, 5, 0.5, 0, TAU); c2.fill();
                 c2.fillStyle = `rgba(255,240,170,${0.3 + Math.sin(t2 * 3) * 0.18})`;
                 c2.beginPath(); c2.ellipse(16, -44 - p2.bob, 10, 5, 0.4, 0, TAU); c2.fill();
               } },
  };
  return M[s] || M.ukiyo;
}
/* 岩洞陈皮:赭石剪影 + 一道深赭错位(代替三重抖动,三重会糊成一团) */
function drawCatCave(ctx, p) {
  /* 错位的深赭垫底:模仿颜料渗进岩缝 */
  ctx.save(); ctx.translate(2.2, 1.6);
  ctx.fillStyle = "rgba(88,44,20,.55)";

const CAT_PIX = [

function drawCatPixel(ctx, p) {

    const hit = ray.intersectObjects(paintMeshes)[0];
    if (hit) {
      focusIdx = hit.object.userData.idx;
      yawOff = pitchOff = 0;
      const wd = WORLDS[focusIdx];
      infoEl.querySelector(".era").textContent = wd.era;
      infoEl.querySelector(".note").textContent = wd.note;
      infoEl.classList.add("show");
    } else {                                            // 点空处:回到漫步
      focusIdx = -1;
      infoEl.classList.remove("show");
    }
  });
}

/* ---------- 相机 ---------- */
const camPos = new THREE.Vector3(0, 4.2, 27), camAim = new THREE.Vector3();
function updateCamera() {
  if (focusIdx >= 0) {
    const left = focusIdx % 2 === 0;
    const tx = left ? -HALL_X : HALL_X;
    const tz = PAIR_Z[(focusIdx / 2) | 0];
    camPos.lerp(new THREE.Vector3(left ? tx + 7.6 : tx - 7.6, PY, tz), 0.055);
    camAim.lerp(new THREE.Vector3(tx, PY, tz), 0.09);
  } else {
    glideZ += glideDir * 0.026;
    if (glideZ < -50) { glideZ = -50; glideDir = 1; }
    if (glideZ > 27) { glideZ = 27; glideDir = -1; }
    camPos.lerp(new THREE.Vector3(0, 4.2, glideZ), 0.08);
    camAim.lerp(new THREE.Vector3(0, 4.0, glideZ + glideDir * 14), 0.08);
  }
  camera.position.copy(camPos);
  camera.lookAt(camAim);
  camera.rotateY(-yawOff);
  camera.rotateX(-pitchOff);
}

/* ---------- 开馆 / 闭馆 ---------- */
let open = false, liveTimer = 0;
function openGallery() {
  if (open) return;
  open = true;
  ST.gallery = true;                                    // 长卷暂停重绘
  galEl.classList.add("on");
  paintMeshes = []; paintTex = [];
  glideZ = 27; glideDir = -1; yawOff = pitchOff = 0; focusIdx = -1; liveT = 0; liveIdx = 0;
  infoEl.classList.remove("show");
  buildGallery();
  bindInput();
  resize();
  let last = performance.now();
  (function loop(now) {
    if (!open) return;
    raf = requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    liveT += dt;
    updateCamera();
    renderer.render(scene, camera);
  })(last);
  liveTimer = setInterval(() => {                       // 活画:轮流派一幅保持动态
    if (!open || document.hidden) return;
    const i = liveIdx++ % 10;
    captureWorld(i, liveT);
    paintTex[i].cv.getContext("2d").drawImage(texCv, 0, 0, texW, texH);
    paintTex[i].tex.needsUpdate = true;
  }, 620);
}
function closeGallery() {
  open = false;
  ST.gallery = false;
  galEl.classList.remove("on");
  cancelAnimationFrame(raf);
  clearInterval(liveTimer);
  renderer.dispose();
}
function resize() {
  if (!open) return;
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
document.getElementById("btn-gallery").onclick = () => { tone(440, 660, 0.25, "triangle", 0.1); openGallery(); };
document.getElementById("gal-exit").onclick = closeGallery;
</script>
