<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>👑 Nikki 猫大王</title>
<!-- 引入圆润可爱字体: Fredoka(标题) + Nunito(正文) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  /* ============ 全局重置与变量 ============ */
  /* Hello Kitty 主题配色:
     --hk-pink   樱花粉(主色,按钮/强调)
     --hk-deep   草莓粉(深,渐变另一端)
     --hk-light  婴儿粉(背景大面积)
     --hk-cream  奶油白(卡片底)
     --hk-red    蝴蝶结红(点缀,得分高亮)
     --hk-text   深棕粉(文字,比纯黑柔和) */
  :root {
    --cell-size: 56px;
    --board-cols: 8;
    --board-rows: 8;
    --hk-pink:   #ff9ec4;   /* 樱花粉 主色 */
    --hk-deep:   #ff6b9d;   /* 草莓粉 深色 */
    --hk-light:  #ffeef4;   /* 婴儿粉 浅背景 */
    --hk-cream:  #fff5f8;   /* 奶油白 */
    --hk-red:    #e94560;   /* 蝴蝶结红 强调 */
    --hk-yellow: #ffd56b;   /* 鹅黄点缀 */
    --hk-text:   #8b4a5e;   /* 深棕粉 文字 */
    --hk-muted:  #c98ba0;   /* 暗粉 次要文字 */
    --good:      #6ee7a8;   /* 进度条绿 */
    --gap: 4px;
    /* 兼容旧代码引用 */
    --accent:   var(--hk-red);
    --accent-2: var(--hk-deep);
    --text:     var(--hk-text);
    --muted:    var(--hk-muted);
    --board-bg: rgba(255,255,255,0.7);
    --cell-bg:  rgba(255,255,255,0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    /* 圆润字体:Nunito 正文,中文兜底 */
    font-family: "Nunito", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--hk-text);
    /* 粉色渐变背景:从浅粉到白 */
    background: linear-gradient(135deg, #ffd6e8 0%, var(--hk-light) 40%, #fff9fb 100%) fixed;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    user-select: none;
  }
  /* 背景波点纹理(Hello Kitty 经典波点) */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image: radial-gradient(circle, rgba(255,158,196,0.25) 2px, transparent 2.5px);
    background-size: 28px 28px;
    pointer-events: none; z-index: 0;
  }
  /* 背景漂浮的蝴蝶结/爱心(替换原来猫爪) */
  body::after {
    content: "🎀 💕 ✨ 🌸 🎀 💕 ✨ 🌸 🎀 💕";
    position: fixed; inset: 0;
    color: rgba(255,158,196,0.12);
    font-size: 36px; line-height: 100px;
    pointer-events: none; z-index: 0;
    animation: drift 35s linear infinite;
    word-spacing: 80px;
  }
  @keyframes drift { from { transform: translateY(-120px);} to { transform: translateY(120px);} }

  /* ============ 布局容器 ============ */
  .app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; gap: 14px;
    padding: 16px;
    width: 100%;
    max-width: 560px;
  }
  .title {
    font-family: "Fredoka", "Nunito", sans-serif;  /* 圆润标题字体 */
    font-size: 30px; font-weight: 700; letter-spacing: 1px;
    background: linear-gradient(90deg, var(--hk-red), var(--hk-deep));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 2px 10px rgba(255,107,157,0.25);
    display: flex; align-items: center; gap: 6px;
    filter: drop-shadow(0 3px 6px rgba(255,158,196,0.4));
  }
  .subtitle { font-size: 13px; color: var(--hk-muted); margin-top: -10px; font-weight: 600; }

  /* ============ HUD ============ */
  .hud {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: 100%;
  }
  .hud-card {
    /* 半透明白底卡片,粉色描边,圆润大圆角 */
    background: rgba(255,255,255,0.85);
    border: 2px solid rgba(255,158,196,0.4);
    border-radius: 16px;
    padding: 8px 6px;
    text-align: center;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 12px rgba(255,158,196,0.2);
  }
  .hud-label { font-size: 10px; color: var(--hk-muted); letter-spacing: 1px; font-weight: 700; }
  .hud-value { font-size: 20px; font-weight: 800; margin-top: 2px; color: var(--hk-deep); }
  .hud-value.warn { color: var(--hk-red); animation: pulse 0.6s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.12);} }

  /* 目标进度条 */
  .progress-wrap {
    width: 100%; height: 12px;
    background: rgba(255,255,255,0.6);
    border-radius: 99px; overflow: hidden;
    border: 2px solid rgba(255,158,196,0.35);
  }
  .progress-bar {
    height: 100%; width: 0%;
    /* 粉色渐变进度条 */
    background: linear-gradient(90deg, var(--hk-pink), var(--hk-deep));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 0 10px rgba(255,107,157,0.5);
  }

  /* ============ 棋盘 ============ */
  .board-frame {
    position: relative;
    padding: 12px;
    background: rgba(255,255,255,0.75);
    border: 3px solid rgba(255,158,196,0.5);
    border-radius: 24px;
    backdrop-filter: blur(8px);
    box-shadow: 0 12px 36px rgba(255,158,196,0.35), inset 0 1px 0 rgba(255,255,255,0.8);
  }
  .board {
    position: relative;
    width: calc(var(--cell-size) * var(--board-cols) + var(--gap) * (var(--board-cols) - 1));
    height: calc(var(--cell-size) * var(--board-rows) + var(--gap) * (var(--board-rows) - 1));
  }
  .cell {
    position: absolute;
    width: var(--cell-size);
    height: var(--cell-size);
    border-radius: 12px;
    background: rgba(255,255,255,0.35);
    box-shadow: inset 0 0 0 1px rgba(255,158,196,0.15);
  }

  /* 猫咪方块 */
  .cat {
    position: absolute;
    width: var(--cell-size);
    height: var(--cell-size);
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--cell-size) * 0.72);
    cursor: pointer;
    transition: left 0.32s cubic-bezier(.34,1.56,.64,1), top 0.34s cubic-bezier(.34,1.2,.64,1), transform 0.15s;
    will-change: top, left, transform;
    filter: drop-shadow(0 3px 5px rgba(255,158,196,0.4));
    z-index: 2;
  }
  .cat:hover { transform: scale(1.06); }
  .cat.selected {
    transform: scale(1.18);
    z-index: 5;
    /* 选中:粉色发光圈 */
    filter: drop-shadow(0 0 12px var(--hk-deep)) drop-shadow(0 3px 5px rgba(255,158,196,0.4));
  }
  .cat.selected::after {
    content: "";
    position: absolute; inset: -4px;
    border: 3px solid var(--hk-deep);
    border-radius: 14px;
    animation: ring 0.8s ease-in-out infinite alternate;
  }
  @keyframes ring { to { box-shadow: 0 0 16px var(--hk-pink);} }

  /* 提示高亮:醒目的弹跳放大 + 粉色描边发光 + 旋转 */
  .cat.hint-glow {
    z-index: 7;
    animation: hintBounce 0.6s ease-in-out infinite alternate !important;
  }
  .cat.hint-glow::before {
    content: "👆";
    position: absolute;
    top: -20px; left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    z-index: 8;
    animation: hintPoint 0.6s ease-in-out infinite alternate;
    pointer-events: none;
    filter: drop-shadow(0 0 4px var(--hk-red));
  }
  @keyframes hintBounce {
    0% { transform: scale(1.1); filter: drop-shadow(0 0 8px var(--hk-deep)) drop-shadow(0 0 16px var(--hk-pink)); }
    100% { transform: scale(1.25) rotate(-3deg); filter: drop-shadow(0 0 14px var(--hk-red)) drop-shadow(0 0 24px var(--hk-deep)); }
  }
  @keyframes hintPoint {
    0% { transform: translateX(-50%) translateY(0); }
    100% { transform: translateX(-50%) translateY(4px); }
  }

  /* 猫咪背景色块(增强区分度) */
  .cat-bg {
    position: absolute; inset: 4px;
    border-radius: 10px;
    opacity: 0.85;
    z-index: -1;
  }
  .cat .emoji { position: relative; z-index: 1; }

  /* 猫咪头像图片 */
  .cat-img {
    position: absolute; inset: 4px;
    border-radius: 10px;
    width: calc(100% - 8px); height: calc(100% - 8px);
    object-fit: cover;
    z-index: 0;
    background: var(--cell-bg);
  }
  /* 图片加载失败时的兜底:显示名字 */
  .cat-fallback {
    position: absolute; inset: 4px;
    border-radius: 10px;
    display: none; /* 默认隐藏,img 加载失败时显示 */
    align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    color: rgba(0,0,0,0.75);
    text-align: center; line-height: 1.1;
    padding: 2px;
    z-index: 1;
  }
  .cat.no-img .cat-img { display: none; }
  .cat.no-img .cat-fallback { display: flex; }
  .cat.no-img .cat-bg { opacity: 1; }

  /* 特殊道具:脉冲光圈 */
  .cat.special .cat-bg { animation: specialGlow 1.4s ease-in-out infinite alternate; }
  @keyframes specialGlow { to { box-shadow: 0 0 18px #fff, 0 0 30px var(--accent); filter: brightness(1.3);} }

  /* 消除动画 */
  .cat.popping { animation: pop 0.34s ease-in forwards; pointer-events: none; }
  @keyframes pop {
    0% { transform: scale(1) rotate(0);}
    40% { transform: scale(1.3) rotate(12deg);}
    100% { transform: scale(0) rotate(180deg); opacity: 0;}
  }
  /* 出生动画(下落到位) */
  .cat.spawning { animation: spawn 0.3s ease-out; }
  @keyframes spawn { from { transform: scale(0.6); opacity: 0;} to { transform: scale(1); opacity: 1;} }

  /* ============ 粒子 & 飘字 ============ */
  .particle {
    position: absolute; pointer-events: none;
    width: 8px; height: 8px; border-radius: 50%;
    z-index: 10;
  }
  .float-score {
    position: absolute; pointer-events: none; z-index: 12;
    font-weight: 800; font-size: 18px;
    color: var(--hk-red);
    text-shadow: 0 2px 6px rgba(255,255,255,0.8);
    animation: floatUp 0.9s ease-out forwards;
  }
  @keyframes floatUp {
    0% { transform: translate(-50%, 0) scale(0.6); opacity: 0;}
    20% { transform: translate(-50%, -10px) scale(1.1); opacity: 1;}
    100% { transform: translate(-50%, -50px) scale(1); opacity: 0;}
  }

  /* 大连击文字 */
  .combo-text {
    position: absolute; top: 40%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-family: "Fredoka", sans-serif;
    font-size: 40px; font-weight: 700;
    background: linear-gradient(90deg, var(--hk-red), var(--hk-deep));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    z-index: 20; pointer-events: none;
    filter: drop-shadow(0 3px 8px rgba(255,158,196,0.6));
  }
  .combo-text.show { animation: comboShow 0.9s ease-out forwards; }
  @keyframes comboShow {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg);}
    40% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg);}
    70% { transform: translate(-50%, -50%) scale(1) rotate(0);}
    100% { transform: translate(-50%, -80%) scale(0.9); opacity: 0;}
  }

  /* ============ 底部按钮 ============ */
  .controls {
    display: flex; gap: 10px; width: 100%;
    justify-content: center;
  }
  .btn {
    flex: 1; max-width: 160px;
    padding: 11px 16px;
    border: 2px solid rgba(255,255,255,0.7);
    border-radius: 16px;
    font-size: 14px; font-weight: 700;
    color: #fff;
    /* 粉色渐变按钮 */
    background: linear-gradient(135deg, var(--hk-deep), var(--hk-pink));
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.2s;
    box-shadow: 0 4px 14px rgba(255,107,157,0.4);
    text-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,107,157,0.5); }
  .btn:active { transform: translateY(0); }
  .btn.secondary {
    /* 次要按钮:白底粉字 */
    background: rgba(255,255,255,0.85);
    color: var(--hk-deep);
    box-shadow: 0 3px 10px rgba(255,158,196,0.25);
    border: 2px solid rgba(255,158,196,0.4);
    text-shadow: none;
  }
  .btn.secondary.on { background: var(--hk-yellow); color: #fff; border-color: #fff; }

  /* 额度徽章:粉底白字小圆 */
  .btn .quota {
    display: inline-block;
    min-width: 18px;
    padding: 0 5px;
    margin-left: 2px;
    font-size: 12px;
    font-weight: 800;
    color: var(--hk-deep);
    background: #fff;
    border-radius: 99px;
    line-height: 1.5;
  }
  .btn .quota.zero {
    color: #fff;
    background: var(--hk-red);
    animation: pulse 0.8s ease-in-out infinite alternate;
  }

  /* ============ 弹窗 ============ */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(255,158,196,0.35);   /* 粉色半透明遮罩 */
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    /* 奶油白底 + 粉色描边的可爱弹窗 */
    background: linear-gradient(160deg, var(--hk-cream), #fff);
    border: 3px solid rgba(255,158,196,0.5);
    border-radius: 24px;
    padding: 32px 28px;
    width: 88%; max-width: 360px;
    text-align: center;
    box-shadow: 0 16px 48px rgba(255,107,157,0.3);
    transform: scale(0.85);
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  .overlay.show .modal { transform: scale(1); }
  .modal-emoji { font-size: 56px; }
  .modal h2 { font-family: "Fredoka", sans-serif; font-size: 24px; margin: 8px 0 4px; color: var(--hk-deep); }
  .modal p { color: var(--hk-muted); font-size: 14px; margin-bottom: 18px; line-height: 1.6; }
  .modal .stat { font-size: 15px; color: var(--hk-red); font-weight: 800; margin: 6px 0 16px; }

  /* ============ 重排弹窗:二维码 + 密码 ============ */
  .shuffle-modal { padding: 24px 22px; }
  .qr-img {
    width: 170px; height: 170px; object-fit: cover;
    border-radius: 18px; margin: 4px auto 6px;
    display: block;
    background: #fff; padding: 6px;
    border: 2px solid rgba(255,158,196,0.4);
    box-shadow: 0 6px 20px rgba(255,158,196,0.3);
  }
  .qr-hint { font-size: 12px; color: var(--hk-muted); margin-bottom: 10px; font-weight: 700; }

  /* 4 位密码输入框 */
  .pwd-row {
    display: flex; gap: 10px; justify-content: center;
    margin: 4px 0 6px;
  }
  .pwd-box {
    width: 48px; height: 56px;
    text-align: center;
    font-family: "Fredoka", sans-serif;
    font-size: 26px; font-weight: 700;
    color: var(--hk-deep);
    background: rgba(255,255,255,0.9);
    border: 2px solid rgba(255,158,196,0.4);
    border-radius: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .pwd-box:focus {
    border-color: var(--hk-deep);
    box-shadow: 0 0 0 3px rgba(255,107,157,0.2);
    background: #fff;
  }
  .pwd-box.filled { border-color: var(--hk-deep); background: var(--hk-light); }
  .pwd-box.error-shake { animation: shake 0.4s; border-color: var(--hk-red); }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .pwd-error {
    font-size: 13px; color: var(--hk-red); font-weight: 700;
    min-height: 18px; margin: 2px 0 8px;
  }
  .shuffle-modal-btns {
    display: flex; gap: 10px;
  }
  .shuffle-modal-btns .btn { flex: 1; }

  /* ============ 帮助图鉴弹窗 ============ */
  .help-modal {
    text-align: left;
    max-width: 400px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px 22px;
  }
  .help-modal .modal-emoji,
  .help-modal h2,
  .help-modal .help-intro { text-align: center; }
  .help-intro {
    font-size: 13px; color: var(--hk-muted);
    margin: 4px 0 14px;
  }
  .help-section { margin-bottom: 14px; }
  .help-section-title {
    font-family: "Fredoka", sans-serif;
    font-size: 13px; font-weight: 700; color: var(--hk-deep);
    margin-bottom: 8px; letter-spacing: 0.5px;
  }
  .help-item {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,238,244,0.8);
    border: 1px solid rgba(255,158,196,0.25);
    border-radius: 14px;
    padding: 9px 12px;
    margin-bottom: 6px;
  }
  .help-icon {
    flex-shrink: 0;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    background: linear-gradient(135deg, rgba(255,158,196,0.3), rgba(255,107,157,0.2));
    border-radius: 12px;
  }
  .help-icon.small { font-size: 20px; }
  .help-text { flex: 1; min-width: 0; }
  .help-name {
    font-size: 14px; font-weight: 700; color: var(--hk-deep);
    display: flex; align-items: center; gap: 6px;
  }
  .help-tag {
    font-size: 10px; font-weight: 700;
    background: rgba(255,213,107,0.3);
    color: #c98a00;
    padding: 1px 7px; border-radius: 99px;
  }
  .help-desc {
    font-size: 12px; color: var(--hk-muted);
    margin-top: 2px; line-height: 1.4;
  }
  .help-modal .btn { margin-top: 10px; width: 100%; }

  /* ============ 大儿倔强(生气)状态 ============ */
  .cat.stubborn {
    animation: angryShake 0.5s ease-in-out infinite alternate;
    z-index: 6;
  }
  @keyframes angryShake {
    from { transform: rotate(-4deg) scale(1.05); }
    to   { transform: rotate(4deg) scale(1.08); }
  }
  .cat .stubborn-badge {
    position: absolute;
    top: -8px; right: -6px;
    font-size: 20px;
    z-index: 3;
    pointer-events: none;
    animation: badgePop 0.6s ease-out;
    filter: drop-shadow(0 0 4px #ff5a5a);
  }
  @keyframes badgePop {
    0% { transform: scale(0); }
    60% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  /* ============ 大儿攻击特效 ============ */
  .attack-flash {
    position: fixed; inset: 0; z-index: 150;
    background: radial-gradient(circle at center, rgba(255,40,40,0.55), rgba(180,0,0,0.3));
    opacity: 0; pointer-events: none;
    animation: flashRed 0.6s ease-out;
  }
  @keyframes flashRed {
    0% { opacity: 0; }
    15% { opacity: 1; }
    100% { opacity: 0; }
  }
  .cat.attacking {
    z-index: 8;
    animation: attackPulse 0.5s ease-out;
  }
  @keyframes attackPulse {
    0% { transform: scale(1); filter: brightness(1); }
    30% { transform: scale(1.5) rotate(-10deg); filter: brightness(2) drop-shadow(0 0 16px #ff2020); }
    60% { transform: scale(1.3) rotate(10deg); filter: brightness(1.8) drop-shadow(0 0 12px #ff5500); }
    100% { transform: scale(1) rotate(0); filter: brightness(1); }
  }
  .float-damage {
    position: absolute; pointer-events: none; z-index: 14;
    font-weight: 900; font-size: 26px;
    color: #ff3838;
    text-shadow: 0 0 10px #ff0000, 0 2px 4px rgba(0,0,0,0.8);
    animation: damageUp 1.1s ease-out forwards;
  }
  @keyframes damageUp {
    0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
    15% { transform: translate(-50%, -8px) scale(1.3); opacity: 1; }
    100% { transform: translate(-50%, -70px) scale(1); opacity: 0; }
  }
  /* HUD 分数受击抖动 */
  .hud-value.damaged { animation: hudShake 0.4s; }
  @keyframes hudShake {
    0%,100% { transform: translateX(0); color: #fff; }
    25% { transform: translateX(-5px); color: #ff3838; }
    75% { transform: translateX(5px); color: #ff3838; }
  }

  /* ============ 响应式 ============ */
  @media (max-width: 480px) {

<script>
"use strict";

/* ============================================================
   猫咪消消乐 — 核心逻辑
   ============================================================ */

const COLS = 8, ROWS = 8, GAP = 4;
// 8 只猫咪:名字 + 拼音文件名 + 配色底块
const CAT_TYPES = [
  { name: "陈皮", file: "chenpi",   color: "#ff9a9e" }, // 0
  { name: "包子", file: "baozi",    color: "#a18cd1" }, // 1
  { name: "年年", file: "niannian", color: "#fbc2eb" }, // 2
  { name: "松露", file: "songlu",   color: "#84fab0" }, // 3
  { name: "大儿", file: "daer",     color: "#fda085" }, // 4
  { name: "警长", file: "jinzhang", color: "#a1c4fd" }, // 5
  { name: "有鱼", file: "youyu",    color: "#ffd93d" }, // 6
  { name: "阿狸", file: "ali",      color: "#ff6ec7" }, // 7
];
const IMG_EXT = "png"; // 图片格式,支持改 jpg/webp

const boardEl   = document.getElementById("board");
const comboEl   = document.getElementById("combo-text");
const overlay   = document.getElementById("overlay");
const $ = id => document.getElementById(id);

/* ---- 游戏状态 ---- */
let grid = [];                 // grid[r][c] = {type, special} | null
let catEls = [];               // catEls[r][c] = DOM 元素 | null
let score = 0, level = 1, moves = 20, target = 1000;
let selected = null;           // {r, c}
let busy = false;              // 动画锁
// 每关免费额度:提示 5 次,重排 2 次;用完后需扫码解锁
const FREE_QUOTA = { hint: 5, shuffle: 2 };
let hintLeft = FREE_QUOTA.hint;
let shuffleLeft = FREE_QUOTA.shuffle;
let usedPasswords = new Set(); // 本关已使用过的密码(防止复用)
// 当前正在解锁的动作:'hint' | 'shuffle'
let unlockAction = null;
// 大儿(调皮猫):空闲 5 秒后随机乱跑
const NAUGHTY_TYPE = 4;        // 大儿在 CAT_TYPES 中的索引
const IDLE_TIMEOUT = 5000;     // 空闲触发时长
let idleTimer = null;          // 空闲计时器
let naughtyLock = false;       // 大儿乱跑动画锁(独立于 busy)
// 大儿(倔强猫):被消除时有概率拒绝消失;交换时拒绝移动
const STUBBORN_RATE = 0.5;          // 倔强概率 50%
// ⚠️ 倔强状态用「DOM 元素」记录,而非坐标。
//    因为大儿会调皮乱跑、会下落,坐标会变;若用坐标记录,
//    大儿移走后旧坐标残留的倔强标记会误伤移动过来的其他猫。
let stubbornEls = new Set();        // 当前处于倔强(生气)状态的大儿 DOM 元素
// 大儿(攻击性):交换时有概率反击扣分
const ATTACK_RATE = 0.3;            // 攻击概率 30%
const ATTACK_MIN = 200;             // 单次攻击最少扣分
const ATTACK_MAX = 500;             // 单次攻击最多扣分
let soundOn = true;
let audioCtx = null;

/* ============================================================
   音效(Web Audio 合成,无需外部文件)
   ============================================================ */
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function beep(freq, dur = 0.1, type = "sine", vol = 0.15) {
  if (!soundOn || !audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
const sfx = {
  select: () => beep(660, 0.06, "square", 0.08),
  swap:   () => beep(880, 0.08, "sine", 0.12),
  bad:    () => beep(180, 0.15, "sawtooth", 0.1),
  match:  (combo) => beep(440 + combo * 120, 0.12, "triangle", 0.15),
  special:() => { beep(800,0.1,"square",0.12); setTimeout(()=>beep(1200,0.15,"square",0.12),80); },
  win:    () => { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.2,"triangle",0.15),i*120)); },
  lose:   () => { [400,300,200].forEach((f,i)=>setTimeout(()=>beep(f,0.25,"sawtooth",0.12),i*150)); },
};

/* ============================================================
   坐标 & 元素定位
   ============================================================ */
function posOf(r, c) {
  return { left: c * (CELL + GAP), top: r * (CELL + GAP) };
}
let CELL = 56; // 会从 CSS 读取实际值

function readCellSize() {
  const v = getComputedStyle(document.documentElement).getPropertyValue("--cell-size");
  CELL = parseInt(v) || 56;
}

/* 创建格子背景 */
function buildCells() {
  boardEl.innerHTML = "";
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const p = posOf(r, c);
      cell.style.left = p.left + "px";
      cell.style.top  = p.top + "px";
      boardEl.appendChild(cell);
    }
}

/* 创建猫咪 DOM */
function makeCatEl(r, c, data) {
  const el = document.createElement("div");
  el.className = "cat";
  if (data.special) el.classList.add("special");
  const p = posOf(r, c);
  el.style.left = p.left + "px";
  el.style.top  = p.top + "px";

  // 底色块(图片透明边缘 / 兜底时可见)
  const bg = document.createElement("div");
  bg.className = "cat-bg";
  bg.style.background = CAT_TYPES[data.type].color;
  el.appendChild(bg);

  // 猫咪头像图片
  const img = document.createElement("img");
  img.className = "cat-img";
  img.src = `assets/cats/${CAT_TYPES[data.type].file}.${IMG_EXT}`;
  img.alt = CAT_TYPES[data.type].name;
  img.draggable = false;
  img.loading = "lazy";
  // 加载失败 → 切换到名字兜底
  img.addEventListener("error", () => el.classList.add("no-img"));
  el.appendChild(img);

  // 兜底:显示猫咪名字(图片没放时)
  const fb = document.createElement("div");
  fb.className = "cat-fallback";
  fb.textContent = CAT_TYPES[data.type].name;
  el.appendChild(fb);

  // 特殊道具叠加符号
  if (data.special === "stripe-h" || data.special === "stripe-v") {
    const tag = document.createElement("span");
    tag.className = "emoji";
    tag.textContent = "⚡";
    tag.style.cssText = "position:absolute;z-index:2;font-size:1.2em;top:-2px;right:0;text-shadow:0 0 6px #fff,0 0 10px #ffd93d;pointer-events:none;";
    el.appendChild(tag);
  } else if (data.special === "rainbow") {
    const tag = document.createElement("span");
    tag.className = "emoji";
    tag.textContent = "🌈";
    tag.style.cssText = "position:absolute;z-index:2;font-size:1.1em;top:-4px;right:-2px;text-shadow:0 0 6px #fff;pointer-events:none;";
    el.appendChild(tag);
  }

  // 注意:不再把坐标写死进闭包。点击时从 dataset 实时读取,
  // 这样下落后 data-r/data-c 会被同步更新,不会漂移。
  el.dataset.r = r;
  el.dataset.c = c;
  el.addEventListener("click", (ev) => {
    const cr = +el.dataset.r, cc = +el.dataset.c;
    onCatClick(cr, cc);
  });
  return el;
}

/* 同步更新某格猫咪元素的坐标标签(下落/交换后调用) */
function syncCatPos(r, c) {
  const el = catEls[r] && catEls[r][c];
  if (!el) return;
  el.dataset.r = r;
  el.dataset.c = c;
}

/* 根据 grid 重建所有猫咪元素 */
function renderAll() {
  // 清除现有 .cat(保留 .cell)
  boardEl.querySelectorAll(".cat").forEach(e => e.remove());
  catEls = Array.from({length: ROWS}, () => Array(COLS).fill(null));
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c]) {
        const el = makeCatEl(r, c, grid[r][c]);
        boardEl.appendChild(el);
        catEls[r][c] = el;
      }
}

/* ============================================================
   初始化棋盘(避免开局就有三连)
   ============================================================ */
function randomType(exclude = []) {
  let t;
  do { t = Math.floor(Math.random() * CAT_TYPES.length); }
  while (exclude.includes(t));
  return t;
}
function initBoard() {
  grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const exclude = [];
      if (c >= 2 && grid[r][c-1]?.type === grid[r][c-2]?.type && grid[r][c-1])
        exclude.push(grid[r][c-1].type);
      if (r >= 2 && grid[r-1][c]?.type === grid[r-2][c]?.type && grid[r-1][c])
        exclude.push(grid[r-1][c].type);
      grid[r][c] = { type: randomType(exclude), special: null };
    }
  // 确保至少有一步可行,否则重排
  if (!hasPossibleMove()) initBoard();
}

/* ============================================================
   匹配检测
   ============================================================ */
// 找出所有三连及以上的位置,返回需要消除的格子集合 Set<"r,c">
function findMatches() {
  const matched = new Set();

  // 横向
  for (let r = 0; r < ROWS; r++) {
    let runStart = 0;
    for (let c = 1; c <= COLS; c++) {
      const same = c < COLS && grid[r][c] && grid[r][runStart] &&
                   grid[r][c].type === grid[r][runStart].type;
      if (!same) {
        if (c - runStart >= 3)
          for (let k = runStart; k < c; k++) matched.add(`${r},${k}`);
        runStart = c;
      }
    }
  }
  // 纵向
  for (let c = 0; c < COLS; c++) {
    let runStart = 0;
    for (let r = 1; r <= ROWS; r++) {
      const same = r < ROWS && grid[r][c] && grid[runStart][c] &&
                   grid[r][c].type === grid[runStart][c].type;
      if (!same) {
        if (r - runStart >= 3)
          for (let k = runStart; k < r; k++) matched.add(`${k},${c}`);
        runStart = r;
      }
    }
  }
  return matched;
}

// 判断是否存在可行的消除交换
function hasPossibleMove() {
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      // 尝试与右、下交换
      if (c + 1 < COLS) {
        swapData(r, c, r, c + 1);
        if (findMatches().size > 0) { swapData(r, c, r, c + 1); return true; }
        swapData(r, c, r, c + 1);
      }
      if (r + 1 < ROWS) {
        swapData(r, c, r + 1, c);
        if (findMatches().size > 0) { swapData(r, c, r + 1, c); return true; }
        swapData(r, c, r + 1, c);
      }
    }
  return false;
}
function swapData(r1, c1, r2, c2) {
  const t = grid[r1][c1]; grid[r1][c1] = grid[r2][c2]; grid[r2][c2] = t;
}

/* ============================================================
   交互:点击选中 & 交换
   ============================================================ */
function onCatClick(r, c) {
  if (busy || !grid[r][c]) return;
  ensureAudio();
  pokeIdle();  // 用户有操作,重置大儿空闲计时
  if (!selected) {
    selected = { r, c };
    catEls[r][c]?.classList.add("selected");
    sfx.select();
    return;
  }
  // 点到同一个:取消
  if (selected.r === r && selected.c === c) {
    catEls[r][c]?.classList.remove("selected");
    selected = null; return;
  }
  // 判断是否相邻
  const dr = Math.abs(selected.r - r), dc = Math.abs(selected.c - c);
  if (dr + dc !== 1) {
    // 重新选中
    catEls[selected.r]?.[selected.c]?.classList.remove("selected");
    selected = { r, c };
    catEls[r][c]?.classList.add("selected");
    sfx.select();
    return;
  }
  // 相邻:尝试交换
  const from = selected;
  catEls[from.r]?.[from.c]?.classList.remove("selected");
  selected = null;
  attemptSwap(from.r, from.c, r, c);
}

async function attemptSwap(r1, c1, r2, c2) {
  // —— 大儿三连判定的入口(优先级:倔强 > 攻击 > 正常) ——

  // ① 倔强检查:如果交换涉及「正在生气(倔强)中的大儿」,它拒绝移动
  //    判断依据是 DOM 元素(不是坐标),避免误伤其他猫
  const el1 = catEls[r1][c1], el2 = catEls[r2][c2];
  const stubbornEl = isStubbornEl(el1) ? el1 : (isStubbornEl(el2) ? el2 : null);
  if (stubbornEl) {
    // 倔强大儿拒绝移动:抖一下 + 提示,不扣步数
    sfx.bad();
    showToast("😤 大儿不想动,别碰我!");
    stubbornEl.style.animation = "none";
    void stubbornEl.offsetWidth;  // 强制重排,重启动画
    stubbornEl.style.animation = "angryShake 0.3s ease-in-out 2";
    setTimeout(() => { stubbornEl.style.animation = ""; }, 700);
    return;  // 交换中断
  }

  // ② 攻击检查:交换涉及大儿时,大儿有概率反击(扣分)
  //    攻击不扣步数、不移动猫咪,只扣分 + 视觉特效
  if (daerAttack(r1, c1, r2, c2)) {
    return;  // 被攻击了,交换中断
  }

  // ③ 正常交换流程
  busy = true;
  sfx.swap();
  // 处理特殊道具:彩虹猫与任意猫交换,清除该色所有
  const a = grid[r1][c1], b = grid[r2][c2];
  if (a?.special === "rainbow" || b?.special === "rainbow") {
    await animateMove(r1, c1, r2, c2);
    swapData(r1, c1, r2, c2); swapEls(r1, c1, r2, c2);
    const rainbowAt = grid[r1][c1]?.special === "rainbow" ? {r:r1,c:c1} : {r:r2,c:c2};
    const otherAt   = rainbowAt.r === r1 ? {r:r2,c:c2} : {r:r1,c:c1};
    const targetType = grid[otherAt.r][otherAt.c].type;
    const toClear = new Set([`${rainbowAt.r},${rainbowAt.c}`]);
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (grid[r][c] && grid[r][c].type === targetType)
          toClear.add(`${r},${c}`);
    sfx.special();
    await resolveCascades(toClear, 1);
    afterMove();
    busy = false;
    return;
  }

  await animateMove(r1, c1, r2, c2);
  swapData(r1, c1, r2, c2);
  swapEls(r1, c1, r2, c2);
  const matches = findMatches();
  if (matches.size === 0) {
    // 无效交换,换回去
    await sleep(120);
    sfx.bad();
    await animateMove(r1, c1, r2, c2);
    swapData(r1, c1, r2, c2);
    swapEls(r1, c1, r2, c2);
    busy = false;
    return;
  }
  // 有效:扣步数,连锁消除
  clearAllStubborn();  // 玩家有效操作,大儿消气了
  moves--;
  updateHUD();
  await resolveCascades(matches, 1);
  afterMove();
  busy = false;
}

/* 移动两个格子的元素到对方位置(仅视觉),不动数据 */
function animateMove(r1, c1, r2, c2) {
  const e1 = catEls[r1][c1], e2 = catEls[r2][c2];
  const p1 = posOf(r1, c1), p2 = posOf(r2, c2);
  if (e1) { e1.style.left = p2.left + "px"; e1.style.top = p2.top + "px"; }
  if (e2) { e2.style.left = p1.left + "px"; e2.style.top = p1.top + "px"; }
  return sleep(330);
}
function swapEls(r1, c1, r2, c2) {
  const t = catEls[r1][c1]; catEls[r1][c1] = catEls[r2][c2]; catEls[r2][c2] = t;
  // 交换后同步两个元素的坐标标签
  if (catEls[r1][c1]) { catEls[r1][c1].dataset.r = r1; catEls[r1][c1].dataset.c = c1; }
  if (catEls[r2][c2]) { catEls[r2][c2].dataset.r = r2; catEls[r2][c2].dataset.c = c2; }
}

/* ============================================================
   连锁消除主循环
   matched: 本次需要清除的 Set<"r,c">;combo: 第几连
   ============================================================ */
async function resolveCascades(matched, combo) {
  while (matched.size > 0) {
    // 大连击提示
    if (combo >= 2) showCombo(combo);
    sfx.match(combo);

    // 大儿倔强:本轮 matched 中的大儿有概率拒绝消除,从列表里摘出来
    matched = handleStubborn(matched);

    // 1. 生成特殊道具(仅 combo==1 即首次命中且匹配数为4/5)
    const specialsToPlace = combo === 1 ? detectSpecials(matched) : [];

    // 2. 计分 & 粒子 & 消除动画
    const gained = matched.size * 60 * combo;
    addScore(gained);
    floatScoreAt(matched, gained);

    // 触发特殊道具的连锁清除(条纹猫清整行/列)
    const extra = expandSpecials(matched);

    // 标记要消除的元素
    for (const key of matched) {
      const [r, c] = key.split(",").map(Number);
      const el = catEls[r][c];
      if (el) {
        spawnParticles(el);
        el.classList.add("popping");
      }
    }
    await sleep(340);

    // 3. 真正删除数据 & 元素
    for (const key of matched) {
      const [r, c] = key.split(",").map(Number);
      grid[r][c] = null;
      catEls[r][c]?.remove();
      catEls[r][c] = null;
    }

    // 4. 放置生成的特殊道具
    for (const sp of specialsToPlace) {
      grid[sp.r][sp.c] = { type: sp.type, special: sp.kind };
      const el = makeCatEl(sp.r, sp.c, grid[sp.r][sp.c]);
      el.classList.add("spawning");
      boardEl.appendChild(el);
      catEls[sp.r][sp.c] = el;
    }

    // 5. 下落
    await dropAndFill();

    // 6. 检查新的匹配
    combo++;
    matched = findMatches();
  }
}

/* ============================================================
   大儿三大性格(只有 type===NAUGHTY_TYPE 的猫才有)
   ① 调皮:空闲 5 秒乱跑(见 naughtyRun)
   ② 倔强:被消除时有概率拒绝消失(见 handleStubborn)
   ③ 攻击:被玩家交换时有概率反击扣分(见 daerAttack)
   ⚠️ 倔强状态绑定到 DOM 元素,不绑定坐标,避免误伤其他猫
   ============================================================ */

/* ② 倔强:本轮 matched 中的大儿有概率拒绝消除
   把倔强的大儿从 matched 摘出来,它们不会被消除,并加上 😤 生气标记
   返回处理后的 matched 集合(已剔除倔强大儿) */
function handleStubborn(matched) {
  const rescued = [];  // 本轮倔强成功的大儿 {r, c, key, el}
  for (const key of matched) {
    const [r, c] = key.split(",").map(Number);
    const cell = grid[r] && grid[r][c];
    // 只有大儿才倔强,其他猫直接 continue
    if (!cell || cell.type !== NAUGHTY_TYPE) continue;
    // 特殊道具大儿(⚡/🌈)不倔强,它是道具了
    if (cell.special) continue;
    // 投骰子:倔强概率
    if (Math.random() < STUBBORN_RATE) {
      rescued.push({ r, c, key, el: catEls[r][c] });
    }
  }
  if (rescued.length > 0) {
    // 从 matched 中移除倔强的大儿,它们不会被消除
    for (const { r, c, key, el } of rescued) {
      matched.delete(key);          // 从消除名单剔除
      markStubborn(el);             // 给这只大儿加 😤 生气标记(绑元素)
    }
    sfx.bad();
    showToast("😤 大儿不想消失,别碰我!");
  }
  return matched;
}

/* 给某只大儿(的 DOM 元素)加生气标记:😤 角标 + 左右摇晃
   绑定到元素本身,大儿乱跑/下落后标记依然跟随,不会误伤其他猫 */
function markStubborn(el) {
  if (!el) return;
  stubbornEls.add(el);              // 记入倔强集合(元素级)
  el.classList.add("stubborn");     // 触发摇晃动画
  // 添加 😤 角标(若尚未有)
  if (!el.querySelector(".stubborn-badge")) {
    const badge = document.createElement("span");
    badge.className = "stubborn-badge";
    badge.textContent = "😤";
    el.appendChild(badge);
  }
}

/* 清除所有大儿的倔强(生气)状态
   在玩家「有效操作」后调用——大儿被哄好了,全部消气 */
function clearAllStubborn() {
  if (stubbornEls.size === 0) return;
  for (const el of stubbornEls) {
    if (el) {
      el.classList.remove("stubborn");
      const badge = el.querySelector(".stubborn-badge");
      if (badge) badge.remove();
    }
  }
  stubbornEls.clear();
}

/* 判断某个 DOM 元素是不是倔强(生气)中的大儿 */
function isStubbornEl(el) {
  return el && stubbornEls.has(el);
}

/* ③ 攻击:玩家试图交换涉及大儿时,大儿有概率反击
   返回 true=发动了攻击(应中断交换), false=未攻击(继续交换)
   攻击效果:扣 200~500 分 + 屏幕红闪 + 爆炸特效 + 扣分飘字
   不扣步数、不移动猫咪,保证不卡死游戏 */
function daerAttack(r1, c1, r2, c2) {
  // 找出本次交换涉及的大儿元素(发起攻击的就是它)
  let attackerEl = null, attackerPos = null;
  const a = grid[r1][c1], b = grid[r2][c2];
  if (a && a.type === NAUGHTY_TYPE && !a.special) {
    attackerEl = catEls[r1][c1]; attackerPos = { r: r1, c: c1 };
  } else if (b && b.type === NAUGHTY_TYPE && !b.special) {
    attackerEl = catEls[r2][c2]; attackerPos = { r: r2, c: c2 };
  }
  if (!attackerEl) return false;    // 没大儿参与,不攻击
  // 投骰子:攻击概率
  if (Math.random() >= ATTACK_RATE) return false;

  // —— 发动攻击!——
  const damage = ATTACK_MIN + Math.floor(Math.random() * (ATTACK_MAX - ATTACK_MIN + 1));
  score = Math.max(0, score - damage);   // 扣分(不低于 0)
  updateHUD();

  // ① 屏幕红闪(全屏覆盖层,动画结束自动移除)
  const flash = document.createElement("div");
  flash.className = "attack-flash";
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 600);

  // ② 攻击者爆炸放大特效
  attackerEl.classList.add("attacking");
  setTimeout(() => attackerEl.classList.remove("attacking"), 500);
  // 在攻击者位置撒红色粒子
  spawnAttackParticles(attackerEl);

  // ③ 扣分飘字(-XXX)显示在攻击者头顶
  showDamage(attackerPos, damage);

  // ④ HUD 分数抖动变红
  const hudScore = $("hud-score");
  hudScore.classList.add("damaged");
  setTimeout(() => hudScore.classList.remove("damaged"), 400);

  // ⑤ 音效:低沉警告音 + toast
  sfx.bad();
  showToast(`😾 大儿反击了你!扣除 ${damage} 分!`);
  return true;
}

/* 在指定棋盘坐标显示扣分飘字 */
function showDamage(pos, damage) {
  const p = posOf(pos.r, pos.c);
  const el = document.createElement("div");
  el.className = "float-damage";
  el.textContent = "-" + damage;
  el.style.left = (p.left + CELL / 2) + "px";
  el.style.top = p.top + "px";
  boardEl.appendChild(el);
  setTimeout(() => el.remove(), 1150);
}

/* 攻击专属红色粒子爆炸(8 方向) */
function spawnAttackParticles(el) {
  const rect = el.getBoundingClientRect();
  const boardRect = boardEl.getBoundingClientRect();
  const cx = rect.left - boardRect.left + rect.width / 2;
  const cy = rect.top - boardRect.top + rect.height / 2;
  for (let i = 0; i < 10; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = cx + "px";
    p.style.top = cy + "px";
    // 红橙渐变粒子
    p.style.background = i % 2 ? "#ff2020" : "#ff7700";
    const ang = (Math.PI * 2 * i) / 10;
    const dist = 35 + Math.random() * 25;
    p.style.transition = "transform 0.55s ease-out, opacity 0.55s";
    boardEl.appendChild(p);
    requestAnimationFrame(() => {
      p.style.transform = `translate(${Math.cos(ang) * dist}px, ${Math.sin(ang) * dist}px) scale(0)`;
      p.style.opacity = "0";
    });
    setTimeout(() => p.remove(), 580);
  }
}

/* 检测4连/5连,返回要放置的特殊道具列表
   只在同一坐标同时属于横/纵 4+ 连时才生成,避免重复/泛滥 */
function detectSpecials(matched) {
  const result = [];
  const used = new Set(); // 已经放置道具的格子,避免一格放多个

  // 把 matched 按行/列分组
  const byRow = {}; // r -> Set<c>
  const byCol = {}; // c -> Set<r>
  for (const key of matched) {
    const [r, c] = key.split(",").map(Number);
    (byRow[r] = byRow[r] || new Set()).add(c);
    (byCol[c] = byCol[c] || new Set()).add(r);
  }

  // 从一个排序数组中提取连续段(长度>=minLen),返回 [[start, end]...]
  function runs(arr, minLen) {
    const out = [];
    const s = [...arr].sort((a,b)=>a-b);
    let start = s[0], prev = s[0];
    for (let i = 1; i <= s.length; i++) {
      if (i < s.length && s[i] === prev + 1) { prev = s[i]; }
      else {
        const len = prev - start + 1;
        if (len >= minLen) out.push([start, prev, len]);
        if (i < s.length) { start = s[i]; prev = s[i]; }
      }
    }
    return out;
  }

  // 横向段(5连→彩虹,4连→横向条纹)
  for (const r in byRow) {
    for (const [cStart, cEnd, len] of runs(byRow[r], 4)) {
      const mid = Math.floor((cStart + cEnd) / 2);
      const key = `${r},${mid}`;
      if (used.has(key)) continue;
      const type = grid[r][mid]?.type ?? 0;
      if (len >= 5) {
        result.push({ r: +r, c: mid, type, kind: "rainbow" });
        used.add(key);
      } else {
        result.push({ r: +r, c: mid, type, kind: "stripe-h" });
        used.add(key);
      }
    }
  }
  // 纵向段(5连→彩虹,4连→纵向条纹)
  for (const c in byCol) {
    for (const [rStart, rEnd, len] of runs(byCol[c], 4)) {
      const mid = Math.floor((rStart + rEnd) / 2);
      const key = `${mid},${c}`;
      if (used.has(key)) continue;
      const type = grid[mid][c]?.type ?? 0;
      if (len >= 5) {
        result.push({ r: mid, c: +c, type, kind: "rainbow" });
        used.add(key);
      } else {
        result.push({ r: mid, c: +c, type, kind: "stripe-v" });
        used.add(key);
      }
    }
  }
  return result;
}

/* 处理被消除格子中的特殊道具,扩展清除范围(条纹清行列),返回无(直接加入matched) */
function expandSpecials(matched) {
  const toAdd = new Set();
  for (const key of matched) {
    const [r, c] = key.split(",").map(Number);
    const cell = grid[r][c];
    if (!cell || !cell.special) continue;
    sfx.special();
    if (cell.special === "stripe-h") {
      for (let cc = 0; cc < COLS; cc++) if (!matched.has(`${r},${cc}`)) toAdd.add(`${r},${cc}`);
    } else if (cell.special === "stripe-v") {
      for (let rr = 0; rr < ROWS; rr++) if (!matched.has(`${rr},${c}`)) toAdd.add(`${rr},${c}`);
    } else if (cell.special === "rainbow") {
      // 彩虹被消除时随机清一种颜色
      const types = CAT_TYPES.map((_,i)=>i);
      const t = types[Math.floor(Math.random()*types.length)];
      for (let rr = 0; rr < ROWS; rr++)
        for (let cc = 0; cc < COLS; cc++)
          if (grid[rr][cc] && grid[rr][cc].type === t && !matched.has(`${rr},${cc}`))
            toAdd.add(`${rr},${cc}`);
    }
  }
  for (const k of toAdd) matched.add(k);
}

/* ============================================================
   下落 & 填充新猫
   ============================================================ */
async function dropAndFill() {
  // 每一列:收集非空,沉底
  for (let c = 0; c < COLS; c++) {
    let writeRow = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r][c]) {
        if (r !== writeRow) {
          grid[writeRow][c] = grid[r][c];
          grid[r][c] = null;
          catEls[writeRow][c] = catEls[r][c];
          catEls[r][c] = null;
          const el = catEls[writeRow][c];
          if (el) {
            const p = posOf(writeRow, c);
            el.style.top = p.top + "px";
            // 更新坐标标签,点击才不会漂移
            el.dataset.r = writeRow;
            el.dataset.c = c;
          }
        }
        writeRow--;
      }
    }
    // 顶部填充新猫
    for (let r = writeRow; r >= 0; r--) {
      const data = { type: Math.floor(Math.random() * CAT_TYPES.length), special: null };
      grid[r][c] = data;
      const el = makeCatEl(r, c, data);
      // 从屏幕上方落入
      const startTop = -(writeRow - r + 1) * (CELL + GAP);
      el.style.top = startTop + "px";
      boardEl.appendChild(el);
      catEls[r][c] = el;
      // 触发回流后下落到目标位置
      requestAnimationFrame(() => {
        const p = posOf(r, c);
        el.style.top = p.top + "px";
      });
    }
  }
  await sleep(380);
}

/* ============================================================
   视觉效果:粒子 / 飘字 / 大连击
   ============================================================ */
function spawnParticles(el) {
  const rect = el.getBoundingClientRect();
  const boardRect = boardEl.getBoundingClientRect();
  const cx = rect.left - boardRect.left + rect.width / 2;
  const cy = rect.top - boardRect.top + rect.height / 2;
  const color = getComputedStyle(el.querySelector(".cat-bg")).backgroundColor;
  for (let i = 0; i < 8; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = cx + "px";
    p.style.top = cy + "px";
    p.style.background = color;
    const ang = (Math.PI * 2 * i) / 8;
    const dist = 30 + Math.random() * 20;
    p.style.transition = "transform 0.5s ease-out, opacity 0.5s";
    boardEl.appendChild(p);
    requestAnimationFrame(() => {
      p.style.transform = `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px) scale(0)`;
      p.style.opacity = "0";
    });
    setTimeout(() => p.remove(), 520);
  }
}

function floatScoreAt(matched, total) {
  // 在 matched 的中心位置显示得分
  let sumR = 0, sumC = 0, n = 0;
  for (const key of matched) {
    const [r, c] = key.split(",").map(Number);
    sumR += r; sumC += c; n++;
  }
  if (n === 0) return;
  const cr = sumR / n, cc = sumC / n;
  const p = posOf(cr, cc);
  const el = document.createElement("div");
  el.className = "float-score";
  el.textContent = "+" + total;
  el.style.left = (p.left + CELL/2) + "px";
  el.style.top = p.top + "px";
  boardEl.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

let comboTimer = null;
function showCombo(combo) {
  const labels = ["", "", "GOOD! 🐾", "GREAT! ✨", "AMAZING! 🔥", "PURR-FECT! 🌟"];
  comboEl.textContent = labels[Math.min(combo, labels.length-1)] || `COMBO x${combo}`;
  comboEl.classList.remove("show");
  void comboEl.offsetWidth; // 重启动画
  comboEl.classList.add("show");
  clearTimeout(comboTimer);
  comboTimer = setTimeout(() => { comboEl.classList.remove("show"); comboEl.textContent = ""; }, 950);
}

/* ============================================================
   计分 & HUD & 关卡管理
   ============================================================ */
function addScore(n) {
  score += n;
  updateHUD();
}
function updateHUD() {
  $("hud-score").textContent = score;
  $("hud-level").textContent = level;
  $("hud-target").textContent = target;
  const m = $("hud-moves");
  m.textContent = moves;
  m.classList.toggle("warn", moves <= 5);
  const pct = Math.min(100, (score / target) * 100);
  $("progress").style.width = pct + "%";
  // 更新提示/重排按钮上的剩余次数徽章
  updateQuota("btn-hint", hintLeft);
  updateQuota("btn-shuffle", shuffleLeft);
}
function updateQuota(btnId, left) {
  const btn = $(btnId);
  const span = btn.querySelector(".quota");
  if (!span) return;
  span.textContent = left;
  span.classList.toggle("zero", left <= 0);
}

function afterMove() {
  // 检查死局
  if (!hasPossibleMove()) {
    showToast("😵 没有可消除的步了,自动重排!");
    setTimeout(() => shuffleBoard(false), 600);
  }
  // 判定胜负
  if (score >= target) {
    setTimeout(() => endLevel(true), 400);
  } else if (moves <= 0) {
    setTimeout(() => endLevel(false), 400);
  }
}

function endLevel(win) {
  stopIdle();  // 关卡结束,停止大儿计时
  if (win) sfx.win(); else sfx.lose();
  $("modal-emoji").textContent = win ? "🎉" : "😿";
  $("modal-title").textContent = win ? `第 ${level} 关通过!` : "挑战失败";
  $("modal-desc").textContent = win
    ? "你成功收集了足够多的猫咪!"
    : `差一点就成功了,目标 ${target} 分。`;
  $("modal-stat").textContent = `本局得分:${score}`;
  $("modal-btn").textContent = win ? "下一关 ➜" : "重新挑战";
  $("modal-btn").onclick = () => {
    overlay.classList.remove("show");
    if (win) {
      level++;
      startLevel();
    } else {
      startLevel(); // 同关重来
    }
  };
  overlay.classList.add("show");
}

function startLevel() {
  // 难度递增
  target = 1000 + (level - 1) * 600;
  moves  = Math.max(12, 22 - Math.floor((level - 1) / 2));
  score  = 0;
  selected = null;
  usedPasswords.clear();   // 新关重置已用密码记录
  hintLeft = FREE_QUOTA.hint;      // 重置提示额度
  shuffleLeft = FREE_QUOTA.shuffle; // 重置重排额度
  stubbornEls.clear();     // 新关重置倔强状态
  initBoard();
  buildCells();
  renderAll();
  updateHUD();
  pokeIdle();  // 启动大儿空闲计时
}

/* ============================================================
   按钮:提示 / 重排 / 音效 / 重开
   ============================================================ */
function findHint() {
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      if (c + 1 < COLS) {
        swapData(r, c, r, c + 1);
        if (findMatches().size > 0) {
          swapData(r, c, r, c + 1);
          return [{r,c},{r,c:c+1}];
        }
        swapData(r, c, r, c + 1);
      }
      if (r + 1 < ROWS) {
        swapData(r, c, r + 1, c);
        if (findMatches().size > 0) {
          swapData(r, c, r + 1, c);
          return [{r,c},{r:r+1,c}];
        }
        swapData(r, c, r + 1, c);
      }
    }
  return null;
}

function showHint() {
  if (busy) return;
  pokeIdle();  // 用户有操作,重置大儿空闲计时
  if (hintLeft <= 0) {
    // 免费次数用完,弹扫码解锁
    openUnlockModal("hint");
    return;
  }
  const hint = findHint();
  if (!hint) { showToast("没有可消除的步啦!"); return; }
  hintLeft--;
  updateHUD();  // 同步刷新按钮上的剩余次数徽章
  showToast(`💡 提示已用,剩余 ${hintLeft} 次`);
  hint.forEach(({r,c}) => {
    const el = catEls[r][c];
    if (el) {
      el.classList.add("hint-glow");
      setTimeout(() => el.classList.remove("hint-glow"), 2600);
    }
  });
}

/* ============================================================
   扫码解锁弹窗(提示/重排共用)
   规则:4 位数字 + 含 2 + 含 8 + 本关未用过
   ============================================================ */
const unlockOverlay = $("unlock-overlay");
const pwdBoxes = document.querySelectorAll(".pwd-box");
const pwdError = $("pwd-error");

// 各动作的文案配置
const UNLOCK_TEXT = {
  hint: {
    title: "提示次数已用完",
    desc:  "本关免费提示已用完,扫码 V 我 50 继续获取提示 😼",
    btn:   "确认解锁提示",
  },
  shuffle: {
    title: "重排次数已用完",
    desc:  "本关免费重排已用完,扫码 V 我 50 获得重排密码助力通关 😼",
    btn:   "确认解锁重排",
  },
};

function openUnlockModal(action) {
  if (busy) return;
  unlockAction = action;
  const t = UNLOCK_TEXT[action];
  $("unlock-title").textContent  = t.title;
  $("unlock-desc").textContent   = t.desc;
  $("unlock-confirm").textContent = t.btn;
  pwdBoxes.forEach(b => { b.value = ""; b.classList.remove("filled","error-shake"); });
  pwdError.textContent = "";
  unlockOverlay.classList.add("show");
  setTimeout(() => pwdBoxes[0].focus(), 320);
}

function closeUnlockModal() {
  unlockOverlay.classList.remove("show");
  unlockAction = null;
}

// 校验密码:4位数字 + 含 2 + 含 8 + 本关未使用过
function checkUnlockPwd() {
  const code = Array.from(pwdBoxes).map(b => b.value).join("");
  if (!/^\d{4}$/.test(code)) {
    pwdError.textContent = "请输入完整的 4 位密码";
    shakePwd(); sfx.bad(); return false;
  }
  if (!code.includes("2") || !code.includes("8")) {
    pwdError.textContent = "密码不正确,记得扫码 V50 哦 😼";
    shakePwd(); sfx.bad(); return false;
  }
  if (usedPasswords.has(code)) {
    pwdError.textContent = "这个密码已经用过了,请换一个 😼";
    shakePwd(); sfx.bad(); return false;
  }
  return true;
}

function shakePwd() {
  pwdBoxes.forEach(b => {
    b.classList.add("error-shake");
    setTimeout(() => b.classList.remove("error-shake"), 420);
  });
}

// 密码框:只允许数字 + 自动跳转 + 回车确认
pwdBoxes.forEach((box, i) => {
  box.addEventListener("input", (e) => {
    e.target.value = e.target.value.replace(/\D/g, "").slice(0, 1);
    if (e.target.value) {
      e.target.classList.add("filled");
      if (i < pwdBoxes.length - 1) pwdBoxes[i + 1].focus();
    } else {
      e.target.classList.remove("filled");
    }
    pwdError.textContent = "";
  });
  box.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && !box.value && i > 0) {
      pwdBoxes[i - 1].focus();
    } else if (e.key === "Enter") {
      $("unlock-confirm").click();
    }
  });
});

// 确认按钮:验证密码 → 记录已用 → 执行对应动作
$("unlock-confirm").onclick = () => {
  if (!checkUnlockPwd()) return;
  const code = Array.from(pwdBoxes).map(b => b.value).join("");
  usedPasswords.add(code);   // 标记本关已使用
  const action = unlockAction;
  closeUnlockModal();
  sfx.special();
  if (action === "hint") {
    // 解锁后执行一次提示(不消耗免费额度)
    const hint = findHint();
    if (!hint) { showToast("没有可消除的步啦!"); return; }
    showToast("✨ 解锁成功,已为你提示!");
    hint.forEach(({r,c}) => {
      const el = catEls[r][c];
      if (el) {
        el.classList.add("hint-glow");
        setTimeout(() => el.classList.remove("hint-glow"), 2600);
      }
    });
  } else if (action === "shuffle") {
    showToast("✨ 解锁成功,已重排!");
    shuffleBoard(true);
  }
};
// 取消按钮
$("unlock-cancel").onclick = () => { closeUnlockModal(); sfx.select(); };

/* 用户主动点击重排按钮:先检查免费额度 */
function requestShuffle() {
  if (busy) return;
  pokeIdle();  // 用户有操作,重置大儿空闲计时
  if (shuffleLeft <= 0) { openUnlockModal("shuffle"); return; }
  shuffleLeft--;
  updateHUD();  // 同步刷新按钮上的剩余次数徽章
  showToast(`🔀 重排已用,剩余 ${shuffleLeft} 次`);
  shuffleBoard(true);
}

function shuffleBoard(userTriggered = true) {
  if (busy) return;
  // 收集所有猫咪类型,重新随机分布
  const types = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c]) types.push(grid[r][c]);
  // Fisher-Yates
  for (let i = types.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [types[i], types[j]] = [types[j], types[i]];
  }
  let idx = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c]) grid[r][c] = { ...types[idx++], special: null };

  // 重排后可能开局有三连,顺便消除一波(不扣步数)
  renderAll();
  if (userTriggered) showToast("🔀 已重排!");
  setTimeout(async () => {
    const m = findMatches();
    if (m.size > 0) { busy = true; await resolveCascades(m, 1); busy = false; }
    afterMove();
  }, 400);
}

/* Toast 提示(轻量) */
function showToast(msg) {
  let t = document.getElementById("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    t.style.cssText = `position:fixed;left:50%;top:20%;transform:translateX(-50%);
      background:rgba(0,0,0,0.8);color:#fff;padding:10px 18px;border-radius:12px;
      font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;`;
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.opacity = "0", 1800);
}

/* ============================================================
   工具
   ============================================================ */
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ============================================================
   大儿(调皮猫):空闲 5 秒后随机乱跑交换位置,不产生消除
   ============================================================ */

// 用户有操作时调用,重置空闲计时
function pokeIdle() {
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(naughtyRun, IDLE_TIMEOUT);
}

// 停止大儿计时(换关/重开/弹窗时)
function stopIdle() {
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
}

// 找出棋盘上所有大儿的位置
function findNaughtyCats() {
  const list = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c] && grid[r][c].type === NAUGHTY_TYPE && !grid[r][c].special)
        list.push({ r, c });
  return list;
}

// 大儿调皮乱跑:随机挑一只大儿,与一只非大儿邻居交换
async function naughtyRun() {
  // 游戏忙 / 弹窗打开 / 锁定中 → 稍后再试
  if (busy || naughtyLock || overlay.classList.contains("show")
      || unlockOverlay.classList.contains("show")
      || $("help-overlay").classList.contains("show")) {
    idleTimer = setTimeout(naughtyRun, IDLE_TIMEOUT);
    return;
  }
  const naughties = findNaughtyCats();
  if (naughties.length === 0) {
    idleTimer = setTimeout(naughtyRun, IDLE_TIMEOUT);
    return;
  }
  // 随机选一只大儿
  const cat = naughties[Math.floor(Math.random() * naughties.length)];
  // 收集它的上下左右邻居中"非大儿"的格子
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  const targets = [];
  for (const [dr, dc] of dirs) {
    const nr = cat.r + dr, nc = cat.c + dc;
    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS
        && grid[nr][nc] && grid[nr][nc].type !== NAUGHTY_TYPE) {
      targets.push({ r: nr, c: nc });
    }
  }
  if (targets.length === 0) {
    idleTimer = setTimeout(naughtyRun, IDLE_TIMEOUT);
    return;
  }
  const target = targets[Math.floor(Math.random() * targets.length)];

  // 执行交换(仅视觉+数据,不检测消除)
  naughtyLock = true;
  sfx.select();
  // 两个元素互相移动
  const e1 = catEls[cat.r][cat.c], e2 = catEls[target.r][target.c];
  const p1 = posOf(cat.r, cat.c), p2 = posOf(target.r, target.c);
  if (e1) {
    e1.style.transition = "left 0.4s cubic-bezier(.34,1.56,.64,1), top 0.4s cubic-bezier(.34,1.2,.64,1), transform 0.3s";
    e1.style.zIndex = "6";
    e1.style.transform = "scale(1.15) rotate(8deg)";
    e1.style.left = p2.left + "px";
    e1.style.top  = p2.top + "px";
  }
  if (e2) {
    e2.style.transition = "left 0.4s cubic-bezier(.34,1.56,.64,1), top 0.4s cubic-bezier(.34,1.2,.64,1)";
    e2.style.left = p1.left + "px";
    e2.style.top  = p1.top + "px";
  }
  await sleep(420);
  // 恢复样式
  if (e1) { e1.style.transform = ""; e1.style.zIndex = ""; e1.style.transition = ""; }
  if (e2) { e2.style.transition = ""; }
  // 交换数据 + 元素 + 坐标标签
  swapData(cat.r, cat.c, target.r, target.c);
  swapEls(cat.r, cat.c, target.r, target.c);
  naughtyLock = false;

  // 大儿换位置不再弹 toast 提示(太频繁),只保留视觉动画
  // 继续下一轮空闲计时
  pokeIdle();
}

/* ============================================================
   绑定事件 & 启动
   ============================================================ */
$("btn-hint").onclick = showHint;
$("btn-shuffle").onclick = requestShuffle;
$("btn-help").onclick = () => { $("help-overlay").classList.add("show"); sfx.select(); };
$("help-close").onclick = () => { $("help-overlay").classList.remove("show"); sfx.select(); };
// 点击图鉴弹窗外部背景也可关闭
$("help-overlay").addEventListener("click", (e) => {
  if (e.target.id === "help-overlay") $("help-overlay").classList.remove("show");
});
$("btn-sound").onclick = (e) => {
  soundOn = !soundOn;
  e.target.textContent = soundOn ? "🔊 音效" : "🔇 静音";
  e.target.classList.toggle("on", !soundOn);
  if (soundOn) ensureAudio();
};
$("btn-restart").onclick = () => { level = 1; startLevel(); };

window.addEventListener("resize", () => {
  readCellSize();
  buildCells();
  renderAll();
});

// 首次交互激活音频
document.addEventListener("click", ensureAudio, { once: true });

// 启动
readCellSize();
startLevel();

</script>
